<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina nu a fost găsită | CSSI Brașov</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="https://eu.chat-img.sintra.ai/32c1b29c-0c86-4833-a031-e7c45e21a11e/983d52bb-2eb6-42f1-bed4-f94d769bb634/Logo_CSSI.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .container { text-align: center; max-width: 520px; }
    .code { font-size: 120px; font-weight: 800; color: #e2e8f0; line-height: 1; }
    h1 { font-size: 24px; font-weight: 700; margin: 16px 0 8px; }
    p { color: #64748b; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; text-decoration: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(to right, #dc2626, #b91c1c); color: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(0,0,0,0.15); }
    .btn-secondary { background: #fff; color: #334155; border: 1px solid #e2e8f0; }
    .btn-secondary:hover { background: #f1f5f9; }
    .contact { margin-top: 40px; padding-top: 24px; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: 13px; }
    .contact a { display: inline; padding: 0; color: #dc2626; font-weight: 600; background: none; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Pagina nu a fost găsită</h1>
    <p>Ne pare rău, pagina pe care o cauți nu există sau a fost mutată. Verifică adresa URL sau navighează înapoi la pagina principală.</p>
    <div class="actions">
      <a href="/" class="btn-primary">🏠 Pagina Principală</a>
      <a href="/contact" class="btn-secondary">📞 Contactează-ne</a>
    </div>
    <div class="contact">
      Ai nevoie de ajutor? Sună-ne la <a href="tel:0752288400">0752 288 400</a>
    </div>
  </div>
<script src="/tawk-chat.js" defer></script>
</body>
</html>
