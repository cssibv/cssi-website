<!-- ============================================
     GOOGLE ANALYTICS 4 — CSSI.RO
     ============================================
     INSTRUCȚIUNI:
     1. Mergi la https://analytics.google.com/
     2. Creează cont nou → Property "CSSI Brașov" → Web stream "cssi.ro"
     3. Copiază Measurement ID-ul (format: G-XXXXXXXXXX)
     4. Înlocuiește G-XXXXXXXXXX de mai jos cu ID-ul tău real
     5. Lipește acest bloc IMEDIAT după <head> pe TOATE paginile HTML
     ============================================ -->

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>

<!-- ============================================
     GOOGLE SEARCH CONSOLE VERIFICATION
     ============================================
     INSTRUCȚIUNI:
     1. Mergi la https://search.google.com/search-console/
     2. Adaugă proprietatea "https://cssi.ro"
     3. Alege verificare "HTML tag"
     4. Copiază meta tag-ul primit și înlocuiește linia de mai jos
     5. Pune-l pe homepage (index.html) în <head>
     ============================================ -->

<meta name="google-site-verification" content="CODUL_TAU_DE_VERIFICARE_AICI" />
