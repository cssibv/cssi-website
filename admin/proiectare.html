<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proiectare — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link rel="manifest" href="../manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--teal:#14b8a6;--yellow:#eab308;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}

.page-header{background:linear-gradient(135deg,#0f4c81,#1e3a8a);color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;display:flex;align-items:center;gap:6px;}
.page-actions{display:flex;gap:8px;align-items:center;}
.page-btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.page-btn.secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}.page-btn.secondary:hover{background:rgba(255,255,255,0.2);}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
.sync-ok{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);}.sync-off{background:var(--gray-l);}.sync-loading{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.container{max-width:1200px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.s-item{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:140px;display:flex;align-items:center;gap:12px;}
.s-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.s-val{font-size:22px;font-weight:900;line-height:1;}.s-label{font-size:11px;color:var(--gray);margin-top:4px;}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;background:#fff;flex:1;min-width:220px;max-width:380px;}
.filter-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.filter-count{font-size:12px;color:var(--gray);font-weight:600;margin-left:auto;}

.proj-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all 0.2s;border-left:4px solid #1e3a8a;}
.proj-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.proj-card.complete{border-left-color:var(--green);background:linear-gradient(135deg,#f0fdf4,#fff);}
.proj-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e3a8a;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;}
.proj-card.complete .proj-icon{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534;}
.proj-info{flex:1;min-width:0;}
.proj-name{font-size:16px;font-weight:800;color:var(--dark);letter-spacing:-0.2px;}
.proj-meta{font-size:11px;color:var(--gray);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.proj-meta .pill{background:var(--gray-bg);padding:2px 8px;border-radius:99px;font-weight:700;}
.proj-meta .pill.cnt{background:#eff6ff;color:#1e3a8a;}
.proj-meta .pill.docs{background:#f5f3ff;color:var(--purple);}
.proj-progress{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:160px;}
.proj-pct{font-size:18px;font-weight:900;color:var(--orange);font-variant-numeric:tabular-nums;}
.proj-pct.complete{color:var(--green);}
.proj-bar{width:140px;height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden;border:1px solid var(--gray-b);}
.proj-bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),#ea580c);border-radius:99px;transition:width 0.4s;}
.proj-bar-fill.complete{background:linear-gradient(90deg,var(--green),#16a34a);}
.proj-stat-text{font-size:10px;color:var(--gray);font-variant-numeric:tabular-nums;}
.proj-arrow{color:var(--gray-l);font-size:18px;flex-shrink:0;}

.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 18px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:380px;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--blue);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:400;display:none;}
.loading-bar.active{display:block;}.loading-bar::after{content:'';display:block;width:30%;height:100%;background:#1e3a8a;border-radius:2px;animation:loadSlide 1.2s infinite ease-in-out;}
@keyframes loadSlide{0%{margin-left:-30%}100%{margin-left:100%}}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}
@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}.bn-item.active{color:var(--red);background:#fef2f2;}.bn-item .bn-icon{font-size:20px;}
.empty-state{text-align:center;padding:48px 24px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:0.5;}
.empty-title{font-size:16px;font-weight:800;color:var(--dark);margin-bottom:6px;}
.empty-msg{color:var(--gray-l);font-size:13px;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
@media(max-width:600px){.proj-card{flex-wrap:wrap;}.proj-progress{order:5;width:100%;align-items:flex-start;margin-top:8px;}.proj-arrow{display:none;}}
</style>
</head>
<body>
<div class="loading-bar" id="loadBar"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">📐 Proiectare</div>
            <div class="page-subtitle" id="syncStatus"><span class="sync-indicator sync-off"></span>Se încarcă...</div>
        </div>
        <div class="page-actions">
            <a href="executie.html" class="page-btn secondary">🔧 Execuție</a>
            <button class="page-btn secondary" onclick="refreshData()">🔄 Reîncarcă</button>
        </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="toolbar">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută client, proiect, adresă..." oninput="render()">
        <span class="filter-count" id="filterCount"></span>
    </div>

    <div id="projList"></div>

    <div class="footer">Portal CSSI 3.0 · Modul Proiectare v4.0 · Conform L. 333/2003 + I7-2011 + P118/3-2015 + GDPR</div>
</div>

<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="proiectare.html" class="bn-item active"><span class="bn-icon">📐</span>Proiectare</a>
    <a href="executie.html" class="bn-item"><span class="bn-icon">🔧</span>Execuție</a>
    <a href="financiar.html" class="bn-item"><span class="bn-icon">📄</span>Facturi</a>
</div>

<script>
var role = sessionStorage.getItem('cssi-role');
if (!role) { window.location.href = '../admin.html'; }
var API_DB = '/admin/api.php';
var STATE = { proiecte:[], loaded:false, isLive:false };

function esc(s){if(s==null)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showLoading(s){document.getElementById('loadBar').classList.toggle('active',s);}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100px)';t.style.transition='all 0.3s'},2500);setTimeout(function(){t.remove()},3000);}

function refreshData(){
    showLoading(true);
    document.getElementById('syncStatus').innerHTML = '<span class="sync-indicator sync-loading"></span>Se încarcă...';
    fetch(API_DB+'?action=getProiectareList&_t='+Date.now())
        .then(function(r){return r.json()}).then(function(res){
            if(!res.success) throw new Error(res.error||'Eroare');
            STATE.proiecte = res.data||[];STATE.loaded=true;STATE.isLive=true;
            document.getElementById('syncStatus').innerHTML = '<span class="sync-indicator sync-ok"></span>MySQL · '+STATE.proiecte.length+' proiecte în proiectare';
            render();
        }).catch(function(e){
            document.getElementById('syncStatus').innerHTML = '<span class="sync-indicator sync-off"></span>Indisponibil';
            toast('❌ '+(e.message||e),'error');
        }).finally(function(){showLoading(false);});
}

function render(){
    var q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
    var filtered = STATE.proiecte.filter(function(p){
        if(!q) return true;
        return (p.client_nume||'').toLowerCase().includes(q) ||
               (p.proiect_id||'').toLowerCase().includes(q) ||
               (p.adresa_obiectiv||'').toLowerCase().includes(q) ||
               (p.serviciu||'').toLowerCase().includes(q);
    });
    document.getElementById('filterCount').textContent = filtered.length+' proiecte';

    renderSummary();
    var c = document.getElementById('projList');
    if(!STATE.loaded){c.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-msg">Se încarcă...</div></div>';return;}
    if(!STATE.proiecte.length){c.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Niciun proiect în Proiectare</div><div class="empty-msg">Mută un proiect cu status "Contract" în "Proiectare" din Board Proiecte.</div></div>';return;}
    if(!filtered.length){c.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-msg">Niciun rezultat pentru căutare.</div></div>';return;}

    var html = '';
    filtered.forEach(function(p){
        var tot = parseInt(p.checklist_total)||0;
        var done = parseInt(p.checklist_done)||0;
        var na = parseInt(p.checklist_na)||0;
        var doneTotal = done+na;
        var pct = tot ? Math.round((doneTotal/tot)*100) : 0;
        var complete = pct >= 100 && tot > 0;
        var initials = (p.client_nume||'?').split(/\s+/).filter(Boolean).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
        html += '<div class="proj-card'+(complete?' complete':'')+'" onclick="window.location.href=\'proiectare-proiect.html?id='+p.proiect_db_id+'\'">';
        html += '<div class="proj-icon">'+esc(initials)+'</div>';
        html += '<div class="proj-info">';
        html += '<div class="proj-name">'+esc(p.client_nume||'?')+'</div>';
        html += '<div class="proj-meta">';
        html += '<span class="pill cnt">'+esc(p.proiect_id)+'</span>';
        if(p.serviciu) html += '<span class="pill">'+esc(p.serviciu)+'</span>';
        if(p.docs_count > 0) html += '<span class="pill docs">📁 '+p.docs_count+' docs</span>';
        if(p.adresa_obiectiv) html += '<span style="color:var(--gray-l)">📍 '+esc(p.adresa_obiectiv)+'</span>';
        html += '</div></div>';
        html += '<div class="proj-progress">';
        html += '<div class="proj-pct'+(complete?' complete':'')+'">'+pct+'%</div>';
        html += '<div class="proj-bar"><div class="proj-bar-fill'+(complete?' complete':'')+'" style="width:'+pct+'%"></div></div>';
        html += '<div class="proj-stat-text">'+done+' bif. · '+na+' n/a · '+(tot-doneTotal)+' rămase</div>';
        html += '</div>';
        html += '<div class="proj-arrow">→</div>';
        html += '</div>';
    });
    c.innerHTML = html;
}

function renderSummary(){
    var nProj = STATE.proiecte.length;
    var ready = STATE.proiecte.filter(function(p){return parseInt(p.checklist_total)>0 && parseInt(p.checklist_done)+parseInt(p.checklist_na) >= parseInt(p.checklist_total);}).length;
    var inProgress = nProj - ready;
    var totalDocs = STATE.proiecte.reduce(function(s,p){return s+(parseInt(p.docs_count)||0);},0);
    document.getElementById('summary').innerHTML =
        '<div class="s-item"><div class="s-icon" style="background:#dbeafe">📐</div><div><div class="s-val" style="color:#1e3a8a">'+nProj+'</div><div class="s-label">Proiecte în lucru</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#fff7ed">⏳</div><div><div class="s-val" style="color:var(--orange)">'+inProgress+'</div><div class="s-label">În desfășurare</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#f0fdf4">✅</div><div><div class="s-val" style="color:var(--green)">'+ready+'</div><div class="s-label">Gata de predat</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#f5f3ff">📁</div><div><div class="s-val" style="color:var(--purple)">'+totalDocs+'</div><div class="s-label">Documente uploadate</div></div></div>';
}

refreshData();
</script>
<script>
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('../sw.js').then(function(r){console.log('[PWA] SW registered, scope:',r.scope)}).catch(function(e){console.log('[PWA] SW failed:',e)});
    var __reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(__reloaded)return;__reloaded=true;
        window.location.reload();
    });
}
</script>
</body>
</html>
