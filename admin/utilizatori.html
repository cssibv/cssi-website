<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilizatori — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--teal:#14b8a6;--yellow:#eab308;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--shadow-lg:0 12px 32px rgba(0,0,0,0.12);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
.container{max-width:1200px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

/* Header */
.page-header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;display:flex;align-items:center;gap:6px;}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-add{padding:10px 18px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s;}
.btn-add:hover{background:#16a34a;transform:translateY(-1px);box-shadow:0 8px 20px -5px rgba(34,197,94,0.4);}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;}
.sync-ok{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);}
.sync-loading{background:var(--orange);animation:pulse 1s infinite;}
.sync-off{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr);}}
.stat{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-val{font-size:22px;font-weight:900;line-height:1;}
.stat-label{font-size:11px;color:var(--gray);margin-top:4px;}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.search-input{padding:10px 16px 10px 38px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 12px center;flex:1;min-width:200px;max-width:340px;}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.f-chips{display:flex;flex-wrap:wrap;gap:6px;}
.f-chip{padding:7px 13px;border-radius:99px;border:1px solid var(--gray-b);background:#fff;color:var(--gray);font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.f-chip:hover{border-color:var(--blue);color:var(--blue);}
.f-chip.active{background:var(--dark);color:#fff;border-color:var(--dark);}
.f-chip .num{background:rgba(0,0,0,0.1);padding:1px 6px;border-radius:99px;font-size:10px;font-weight:800;}
.f-chip.active .num{background:rgba(255,255,255,0.25);}
.filter-count{font-size:12px;color:var(--gray);font-weight:600;margin-left:auto;}

/* User cards */
.users-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px;}
@media(min-width:640px){.users-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.users-grid{grid-template-columns:repeat(3,1fr);}}
.user-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--gray-b);transition:all 0.2s;display:flex;flex-direction:column;}
.user-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.user-card.inactive{opacity:0.55;}
.user-card.locked{border-color:#fecaca;}
.user-head{padding:18px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff,#f8fafc);border-bottom:1px solid var(--gray-bg);}
.user-card.locked .user-head{background:linear-gradient(135deg,#fef2f2,#fff);}
.avatar{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-0.5px;}
.av-admin{background:linear-gradient(135deg,#0f172a,#334155);}
.av-sales{background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.av-org{background:linear-gradient(135deg,#f97316,#c2410c);}
.av-mkt{background:linear-gradient(135deg,#8b5cf6,#6d28d9);}
.av-tech{background:linear-gradient(135deg,#14b8a6,#0d9488);}
.av-tehnician{background:linear-gradient(135deg,#f97316,#9a3412);}
.user-head-info{flex:1;min-width:0;}
.user-name{font-size:16px;font-weight:800;color:var(--dark);letter-spacing:-0.2px;overflow:hidden;text-overflow:ellipsis;}
.user-meta{font-size:11px;color:var(--gray);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.user-meta .username{font-family:'Courier New',monospace;font-weight:700;}
.role-pill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.3px;}
.role-pill.admin{background:#0f172a;color:#fff;}
.role-pill.sales{background:#dbeafe;color:#1d4ed8;}
.role-pill.org{background:#ffedd5;color:#9a3412;}
.role-pill.mkt{background:#ede9fe;color:#6d28d9;}
.role-pill.tech{background:#ccfbf1;color:#0d9488;}
.role-pill.tehnician{background:linear-gradient(135deg,#fff7ed,#ffedd5);color:#9a3412;border:1px solid #fed7aa;}

.user-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:10px;}
.status-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray);}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;flex-shrink:0;}
.status-badge.active{background:#dcfce7;color:#166534;}
.status-badge.inactive{background:var(--gray-bg);color:var(--gray);}
.status-badge.locked{background:#fef2f2;color:var(--red);animation:pulseBadge 2s infinite;}
@keyframes pulseBadge{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.last-login{font-size:11px;color:var(--gray);}
.last-login strong{color:var(--dark);font-weight:700;}
.failed-warn{display:inline-flex;align-items:center;gap:4px;background:#fff7ed;color:var(--orange);padding:2px 7px;border-radius:99px;font-size:10px;font-weight:800;}

.actions{display:flex;flex-wrap:wrap;gap:5px;padding:12px 14px;background:var(--gray-bg);border-top:1px solid var(--gray-bg);}
.act-btn{padding:7px 11px;border-radius:8px;border:1px solid var(--gray-b);background:#fff;color:var(--gray);font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit;display:inline-flex;align-items:center;gap:4px;}
.act-btn:hover{border-color:var(--blue);color:var(--blue);background:#eff6ff;}
.act-btn.primary:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.act-btn.warn{border-color:var(--orange);color:var(--orange);background:#fff7ed;}
.act-btn.warn:hover{background:var(--orange);color:#fff;}
.act-btn.success{border-color:var(--green);color:var(--green);background:#f0fdf4;}
.act-btn.success:hover{background:var(--green);color:#fff;}
.act-btn.danger:hover{border-color:var(--red);color:var(--red);background:#fef2f2;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:16px;font-weight:800;}
.modal-title strong{color:var(--blue);}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;cursor:pointer;}.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:20px 22px;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--dark);margin-bottom:6px;}
.form-label .req{color:var(--red);}
.form-label .hint{color:var(--gray-l);font-weight:500;font-size:10px;text-transform:none;letter-spacing:0;margin-left:4px;}
.form-input,.form-select{width:100%;padding:11px 14px;border:2px solid var(--gray-b);border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}
.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.form-input.mono{font-family:'Courier New',monospace;letter-spacing:1px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-helper-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;margin-bottom:14px;}
.helper-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--gray-b);background:#fff;color:var(--gray);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.helper-btn:hover{border-color:var(--blue);color:var(--blue);background:#eff6ff;}
.form-submit{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.2s;}
.form-submit:hover{background:#1d4ed8;transform:translateY(-1px);}
.form-submit.green{background:var(--green);}.form-submit.green:hover{background:#16a34a;}
.form-err{color:var(--red);font-size:12px;padding:9px 12px;background:#fef2f2;border-radius:8px;display:none;margin-bottom:12px;font-weight:600;border-left:3px solid var(--red);}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:380px;}
.toast{padding:12px 18px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--blue);}.toast.warn{background:var(--orange);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.empty-state{text-align:center;padding:48px 24px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:0.5;}
.empty-msg{color:var(--gray-l);font-size:13px;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 40px;}
.loading{text-align:center;padding:60px 20px;color:var(--gray-l);}
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">👥 Utilizatori</div>
            <div class="page-subtitle"><span class="sync-indicator sync-loading" id="syncDot"></span><span id="syncText">Se încarcă...</span></div>
        </div>
        <div class="page-actions">
            <button class="btn-add" onclick="openCreateModal()">➕ Utilizator nou</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
        <input type="text" class="search-input" id="searchInput" placeholder="Caută user, nume..." oninput="render()" autocomplete="off">
        <div class="f-chips" id="filterChips"></div>
        <span class="filter-count" id="filterCount"></span>
    </div>

    <div id="usersList"><div class="loading">⏳ Se încarcă...</div></div>

    <div class="footer">Portal CSSI 3.0 · Administrare conturi · auth bcrypt + sesiuni PHP</div>
</div>

<!-- MODAL: SET PASSWORD -->
<div id="setPwModal" class="modal-overlay" onclick="if(event.target===this)closeSetPwModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title">🔑 Setează parolă pentru <strong id="setPwUser">—</strong></div><button class="modal-close" onclick="closeSetPwModal()">✕</button></div>
    <div class="modal-body">
        <form onsubmit="doSetPassword(event)">
            <input type="hidden" id="setPwUserId">
            <div class="form-group">
                <label class="form-label">Parolă nouă <span class="req">*</span> <span class="hint">(min. 6 caractere)</span></label>
                <input type="text" class="form-input mono" id="setPwNew" required minlength="6" autocomplete="new-password" autocapitalize="off">
            </div>
            <div class="form-helper-row">
                <button type="button" class="helper-btn" onclick="document.getElementById('setPwNew').value=genPw(12)">🎲 Generează (12 chars)</button>
                <button type="button" class="helper-btn" onclick="togglePwVis('setPwNew')">👁️ Toggle vizibilitate</button>
            </div>
            <div id="setPwErr" class="form-err"></div>
            <button type="submit" class="form-submit green">💾 Setează parola</button>
        </form>
    </div>
</div>
</div>

<!-- MODAL: CREATE USER -->
<div id="createModal" class="modal-overlay" onclick="if(event.target===this)closeCreateModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title">➕ Utilizator nou</div><button class="modal-close" onclick="closeCreateModal()">✕</button></div>
    <div class="modal-body">
        <form onsubmit="doCreate(event)">
            <div class="form-group">
                <label class="form-label">Username <span class="req">*</span> <span class="hint">(3-30 caractere: a-z, 0-9, _, -)</span></label>
                <input type="text" class="form-input mono" id="cuUsername" required pattern="[a-z0-9_-]{3,30}" autocomplete="off" autocapitalize="off" placeholder="ex: andrei">
            </div>
            <div class="form-group">
                <label class="form-label">Nume afișat</label>
                <input type="text" class="form-input" id="cuDisplayName" placeholder="ex: Andrei Popescu" autocomplete="off">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Rol <span class="req">*</span></label>
                    <select class="form-select" id="cuRole">
                        <option value="tech">📐 tech</option>
                        <option value="sales">💰 sales</option>
                        <option value="org">📋 org</option>
                        <option value="mkt">📊 mkt</option>
                        <option value="admin">🔑 admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Tip cont</label>
                    <select class="form-select" id="cuTehnician">
                        <option value="0">🏢 Birou</option>
                        <option value="1">🔧 Tehnician teren</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Parolă inițială <span class="req">*</span></label>
                <input type="text" class="form-input mono" id="cuPassword" required minlength="6" autocomplete="new-password" autocapitalize="off">
            </div>
            <div class="form-helper-row">
                <button type="button" class="helper-btn" onclick="document.getElementById('cuPassword').value=genPw(12)">🎲 Generează (12 chars)</button>
            </div>
            <div id="cuErr" class="form-err"></div>
            <button type="submit" class="form-submit green">➕ Creează contul</button>
        </form>
    </div>
</div>
</div>

<!-- MODAL: MODULE ACCESS -->
<div id="modulesModal" class="modal-overlay" onclick="if(event.target===this)closeModulesModal()">
<div class="modal" style="max-width:540px">
    <div class="modal-head"><div class="modal-title">🔐 Module accesibile pentru <strong id="modUser">—</strong></div><button class="modal-close" onclick="closeModulesModal()">✕</button></div>
    <div class="modal-body">
        <div id="modStatus" style="font-size:12px;color:var(--gray);background:var(--gray-bg);padding:10px 14px;border-radius:8px;margin-bottom:12px"></div>
        <div style="font-size:11px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Bifează modulele permise:</div>
        <div id="modulesList" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px"></div>
        <div id="modErr" class="form-err"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="form-submit" style="flex:1" onclick="doSaveModules()">💾 Salvează</button>
            <button type="button" class="helper-btn" onclick="doResetModules()" title="Șterge override-ul, revine la defaults per rol">🔄 Reset la defaults</button>
        </div>
    </div>
</div>
</div>

<style>
.mod-chip{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid var(--gray-b);border-radius:10px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;user-select:none;transition:all 0.15s;}
.mod-chip:hover{border-color:var(--blue);background:#eff6ff;}
.mod-chip.checked{border-color:var(--blue);background:#eff6ff;color:#1d4ed8;}
.mod-chip input{accent-color:var(--blue);}
.mod-chip .ic{font-size:16px;}
</style>

<!-- MODAL: EDIT USER -->
<div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeEditModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title">✏️ Editează <strong id="editUser">—</strong></div><button class="modal-close" onclick="closeEditModal()">✕</button></div>
    <div class="modal-body">
        <form onsubmit="doEdit(event)">
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label class="form-label">Username <span class="hint">(read-only)</span></label>
                <input type="text" class="form-input mono" id="editUsername" disabled style="background:var(--gray-bg);color:var(--gray)">
            </div>
            <div class="form-group">
                <label class="form-label">Nume afișat</label>
                <input type="text" class="form-input" id="editDisplayName" autocomplete="off">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Rol</label>
                    <select class="form-select" id="editRole">
                        <option value="tech">📐 tech</option>
                        <option value="sales">💰 sales</option>
                        <option value="org">📋 org</option>
                        <option value="mkt">📊 mkt</option>
                        <option value="admin">🔑 admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Tip cont</label>
                    <select class="form-select" id="editTehnician">
                        <option value="0">🏢 Birou</option>
                        <option value="1">🔧 Tehnician teren</option>
                    </select>
                </div>
            </div>
            <div id="editErr" class="form-err"></div>
            <button type="submit" class="form-submit">💾 Salvează modificările</button>
        </form>
    </div>
</div>
</div>

<script>
// ═══ AUTH GUARD ═══
var sessRole = sessionStorage.getItem('cssi-role');
if (sessRole !== 'admin') { window.location.href = '../admin.html'; }
var API = '/admin/api.php';

// ═══ STATE ═══
var STATE = { users: [], filter: 'all' };

// ═══ HELPERS ═══
function esc(s){if(s==null)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showToast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100px)';t.style.transition='all 0.3s'},3000);setTimeout(function(){t.remove()},3500);}
function genPw(len){var chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#%';var s='';for(var i=0;i<(len||10);i++)s+=chars.charAt(Math.floor(Math.random()*chars.length));return s;}
function togglePwVis(id){var i=document.getElementById(id);i.type=i.type==='text'?'password':'text';}
function avClass(u){if(u.is_tehnician)return 'av-tehnician';return 'av-'+(u.role||'tech');}
function pillClass(u){if(u.is_tehnician&&u.role!=='admin')return 'tehnician';return u.role||'tech';}
function pillLabel(u){if(u.is_tehnician&&u.role!=='admin')return 'Tehnician';var labels={admin:'Admin',sales:'Sales',org:'Org',mkt:'Mkt',tech:'Tech'};return labels[u.role]||u.role;}
function fmtRel(s){if(!s)return 'niciodată';var d=new Date(s.replace(' ','T'));var diff=Math.floor((Date.now()-d.getTime())/1000);if(diff<60)return 'acum';if(diff<3600)return 'acum '+Math.floor(diff/60)+' min';if(diff<86400)return 'acum '+Math.floor(diff/3600)+' h';if(diff<2592000)return 'acum '+Math.floor(diff/86400)+' zile';return d.toLocaleDateString('ro-RO');}

// ═══ FETCH ═══
function loadUsers(){
    document.getElementById('syncDot').className='sync-indicator sync-loading';
    document.getElementById('syncText').textContent='Se încarcă...';
    fetch(API+'?action=adminListUsers&_t='+Date.now(),{credentials:'include'})
        .then(function(r){return r.json();})
        .then(function(res){
            if(!res.success){throw new Error(res.error||'Eroare');}
            STATE.users = res.data || [];
            document.getElementById('syncDot').className='sync-indicator sync-ok';
            document.getElementById('syncText').textContent='MySQL · '+STATE.users.length+' useri';
            render();
        })
        .catch(function(e){
            document.getElementById('syncDot').className='sync-indicator sync-off';
            document.getElementById('syncText').textContent='Eroare: '+(e.message||e);
            showToast('❌ '+(e.message||e),'error');
        });
}

// ═══ RENDER ═══
function render(){
    renderStats();
    renderFilterChips();
    renderUsers();
}

function renderStats(){
    var total = STATE.users.length;
    var active = STATE.users.filter(function(u){return u.active && !u.locked;}).length;
    var locked = STATE.users.filter(function(u){return u.locked;}).length;
    var tech = STATE.users.filter(function(u){return u.is_tehnician && u.active;}).length;
    document.getElementById('stats').innerHTML =
        '<div class="stat"><div class="stat-icon" style="background:#eff6ff">👥</div><div><div class="stat-val" style="color:var(--blue)">'+total+'</div><div class="stat-label">Total useri</div></div></div>'+
        '<div class="stat"><div class="stat-icon" style="background:#f0fdf4">✓</div><div><div class="stat-val" style="color:var(--green)">'+active+'</div><div class="stat-label">Activi</div></div></div>'+
        '<div class="stat"><div class="stat-icon" style="background:#fef2f2">🔒</div><div><div class="stat-val" style="color:var(--red)">'+locked+'</div><div class="stat-label">Blocați</div></div></div>'+
        '<div class="stat"><div class="stat-icon" style="background:#fff7ed">🔧</div><div><div class="stat-val" style="color:var(--orange)">'+tech+'</div><div class="stat-label">Tehnicieni teren</div></div></div>';
}

function renderFilterChips(){
    var counts = {all:STATE.users.length, active:0, locked:0, inactive:0, admin:0, tech:0, sales:0, org:0, mkt:0, tehnician:0};
    STATE.users.forEach(function(u){
        if(u.locked) counts.locked++;
        else if(u.active) counts.active++;
        else counts.inactive++;
        if(u.role) counts[u.role] = (counts[u.role]||0) + 1;
        if(u.is_tehnician) counts.tehnician++;
    });
    var f = STATE.filter;
    function chip(k,label){return '<button class="f-chip'+(f===k?' active':'')+'" onclick="setFilter(\''+k+'\')">'+label+' <span class="num">'+(counts[k]||0)+'</span></button>';}
    document.getElementById('filterChips').innerHTML =
        chip('all','Toți') +
        chip('active','✓ Activi') +
        chip('locked','🔒 Blocați') +
        chip('inactive','⊘ Inactivi') +
        chip('admin','🔑 Admin') +
        chip('tehnician','🔧 Tehnicieni');
}

function setFilter(f){STATE.filter=f;renderUsers();renderFilterChips();}

function renderUsers(){
    var q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
    var f = STATE.filter;
    var list = STATE.users.filter(function(u){
        if(q && (u.username||'').toLowerCase().indexOf(q)===-1 && (u.display_name||'').toLowerCase().indexOf(q)===-1) return false;
        if(f==='active') return u.active && !u.locked;
        if(f==='locked') return u.locked;
        if(f==='inactive') return !u.active;
        if(f==='admin') return u.role==='admin';
        if(f==='tehnician') return u.is_tehnician;
        if(f==='sales') return u.role==='sales';
        if(f==='org') return u.role==='org';
        if(f==='mkt') return u.role==='mkt';
        if(f==='tech') return u.role==='tech' && !u.is_tehnician;
        return true;
    });
    document.getElementById('filterCount').textContent = list.length+' / '+STATE.users.length;
    var c = document.getElementById('usersList');
    if(!list.length){c.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-msg">Niciun user nu corespunde filtrului.</div></div>'; return;}

    var html = '<div class="users-grid">';
    list.forEach(function(u){
        var name = u.display_name || u.username;
        var initial = name.charAt(0).toUpperCase();
        var statusBadge = u.locked ? '<span class="status-badge locked">🔒 Blocat</span>'
                        : u.active ? '<span class="status-badge active">✓ Activ</span>'
                        : '<span class="status-badge inactive">⊘ Inactiv</span>';
        var cardCls = 'user-card' + (u.locked ? ' locked' : '') + (!u.active ? ' inactive' : '');
        html += '<div class="'+cardCls+'">';
        html += '<div class="user-head">';
        html += '<div class="avatar '+avClass(u)+'">'+esc(initial)+'</div>';
        html += '<div class="user-head-info">';
        html += '<div class="user-name">'+esc(name)+'</div>';
        html += '<div class="user-meta"><span class="username">@'+esc(u.username)+'</span> · <span class="role-pill '+pillClass(u)+'">'+pillLabel(u)+'</span></div>';
        html += '</div></div>';
        html += '<div class="user-body">';
        html += '<div class="status-row">'+statusBadge;
        if(u.failed_attempts > 0) html += '<span class="failed-warn">⚠ '+u.failed_attempts+' eșec'+(u.failed_attempts===1?'':'uri')+'</span>';
        html += '</div>';
        html += '<div class="last-login">📅 Ultim login: <strong>'+fmtRel(u.last_login)+'</strong></div>';
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="act-btn primary" onclick="openEditModal('+u.id+')">✏️ Editează</button>';
        html += '<button class="act-btn primary" onclick="openSetPwModal('+u.id+',\''+esc(name).replace(/\047/g,'')+'\')">🔑 Parolă</button>';
        if(u.username !== 'admin') html += '<button class="act-btn primary" onclick="openModulesModal('+u.id+',\''+esc(name).replace(/\047/g,'')+'\')">🔐 Module</button>';
        if(u.locked) html += '<button class="act-btn warn" onclick="doUnlock('+u.id+',\''+esc(name).replace(/\047/g,'')+'\')">🔓 Deblochează</button>';
        if(u.username !== 'admin'){
            if(u.active) html += '<button class="act-btn danger" onclick="doToggleActive('+u.id+',\''+esc(name).replace(/\047/g,'')+'\',false)">⊘ Dezactivează</button>';
            else html += '<button class="act-btn success" onclick="doToggleActive('+u.id+',\''+esc(name).replace(/\047/g,'')+'\',true)">✓ Activează</button>';
        }
        html += '</div></div>';
    });
    html += '</div>';
    c.innerHTML = html;
}

// ═══ ACTIONS ═══
function openSetPwModal(uid, name){
    document.getElementById('setPwUserId').value = uid;
    document.getElementById('setPwUser').textContent = name;
    document.getElementById('setPwNew').value = '';
    document.getElementById('setPwNew').type = 'text';
    document.getElementById('setPwErr').style.display = 'none';
    document.getElementById('setPwModal').classList.add('active');
    setTimeout(function(){document.getElementById('setPwNew').focus();},150);
}
function closeSetPwModal(){document.getElementById('setPwModal').classList.remove('active');}
function doSetPassword(ev){
    ev.preventDefault();
    var uid = parseInt(document.getElementById('setPwUserId').value);
    var pw = document.getElementById('setPwNew').value;
    var err = document.getElementById('setPwErr'); err.style.display='none';
    if(pw.length<6){err.textContent='Min. 6 caractere';err.style.display='block';return;}
    fetch(API+'?action=adminSetPassword',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminSetPassword',user_id:uid,new:pw})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){closeSetPwModal();showToast('✅ Parolă setată. Comunic-o user-ului în siguranță: '+pw,'success');loadUsers();}
            else{err.textContent=res.error||'Eroare';err.style.display='block';}
        }).catch(function(e){err.textContent='Eroare server';err.style.display='block';});
}

function openCreateModal(){
    document.getElementById('cuUsername').value='';
    document.getElementById('cuDisplayName').value='';
    document.getElementById('cuRole').value='tech';
    document.getElementById('cuTehnician').value='1';
    document.getElementById('cuPassword').value=genPw(12);
    document.getElementById('cuErr').style.display='none';
    document.getElementById('createModal').classList.add('active');
    setTimeout(function(){document.getElementById('cuUsername').focus();},150);
}
function closeCreateModal(){document.getElementById('createModal').classList.remove('active');}
function doCreate(ev){
    ev.preventDefault();
    var u = document.getElementById('cuUsername').value.trim().toLowerCase();
    var d = document.getElementById('cuDisplayName').value.trim();
    var r = document.getElementById('cuRole').value;
    var t = parseInt(document.getElementById('cuTehnician').value);
    var p = document.getElementById('cuPassword').value;
    var err = document.getElementById('cuErr'); err.style.display='none';
    fetch(API+'?action=adminCreateUser',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminCreateUser',username:u,password:p,display_name:d,role:r,is_tehnician:t})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){closeCreateModal();showToast('✅ User creat: '+u+' / parola: '+p,'success');loadUsers();}
            else{err.textContent=res.error||'Eroare';err.style.display='block';}
        }).catch(function(e){err.textContent='Eroare server';err.style.display='block';});
}

function openEditModal(uid){
    var u = STATE.users.find(function(x){return x.id===uid;});
    if(!u)return;
    document.getElementById('editUserId').value = uid;
    document.getElementById('editUser').textContent = u.display_name || u.username;
    document.getElementById('editUsername').value = u.username;
    document.getElementById('editDisplayName').value = u.display_name || '';
    document.getElementById('editRole').value = u.role || 'tech';
    document.getElementById('editTehnician').value = u.is_tehnician ? '1' : '0';
    document.getElementById('editErr').style.display = 'none';
    document.getElementById('editModal').classList.add('active');
}
function closeEditModal(){document.getElementById('editModal').classList.remove('active');}
function doEdit(ev){
    ev.preventDefault();
    var uid = parseInt(document.getElementById('editUserId').value);
    var d = document.getElementById('editDisplayName').value.trim();
    var r = document.getElementById('editRole').value;
    var t = parseInt(document.getElementById('editTehnician').value);
    var err = document.getElementById('editErr'); err.style.display='none';
    fetch(API+'?action=adminUpdateUser',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminUpdateUser',user_id:uid,display_name:d,role:r,is_tehnician:t})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){closeEditModal();showToast('✅ Modificări salvate','success');loadUsers();}
            else{err.textContent=res.error||'Eroare';err.style.display='block';}
        }).catch(function(e){err.textContent='Eroare server';err.style.display='block';});
}

function doUnlock(uid, name){
    if(!confirm('Deblochezi contul '+name+'?'))return;
    fetch(API+'?action=adminUnlockUser',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminUnlockUser',user_id:uid})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){showToast('✅ Cont deblocat: '+name,'success');loadUsers();}
            else showToast('❌ '+(res.error||'Eroare'),'error');
        });
}

    {id:'proiecte',    icon:'📋', name:'Proiecte (Board Kanban)'},
    {id:'crm',         icon:'💰', name:'CRM Clienți'},
    {id:'calculator',  icon:'📝', name:'Oferte (Generator)'},
    {id:'contracte',   icon:'📄', name:'Contracte'},
    {id:'planificare', icon:'📅', name:'Planificare'},
    {id:'executie',    icon:'🔧', name:'Execuție'},
    {id:'proiectare',  icon:'📐', name:'Proiectare'},
    {id:'mentenanta',  icon:'🔄', name:'Mentenanță'},
    {id:'financiar',   icon:'💳', name:'Financiar'},
    {id:'materiale',   icon:'📦', name:'Inventar & Stocuri'},
    {id:'necesar',     icon:'🛒', name:'Necesar Materiale'},
    {id:'social',      icon:'📅', name:'Calendar Social'},
    {id:'marketing',   icon:'📊', name:'Marketing Hub'},
    {id:'documente',   icon:'📁', name:'Documente'},
];
var modCurrentUid = null;

function openModulesModal(uid, name){
    modCurrentUid = uid;
    document.getElementById('modUser').textContent = name;
    document.getElementById('modErr').style.display = 'none';
    document.getElementById('modStatus').textContent = '⏳ Se încarcă...';
    document.getElementById('modulesList').innerHTML = '';
    document.getElementById('modulesModal').classList.add('active');

    fetch(API+'?action=adminGetUserModules&user_id='+uid+'&_t='+Date.now(),{credentials:'include'})
        .then(function(r){return r.json();}).then(function(res){
            if(!res.success){document.getElementById('modStatus').textContent='❌ '+(res.error||'Eroare');return;}
            var d = res.data;
            var status = d.has_override
                ? '✏️ <strong>Custom override</strong> — folosește lista de mai jos.'
                : '🔄 <strong>Defaults per rol</strong> ('+d.defaults.length+' module). Bifele de mai jos sunt cele active. Modifică-le pentru a suprascrie.';
            document.getElementById('modStatus').innerHTML = status;
            // Render checkbox-uri
            var html = MODULE_CATALOG.map(function(m){
                var checked = d.allowed.indexOf(m.id) >= 0;
                return '<label class="mod-chip'+(checked?' checked':'')+'" data-mid="'+m.id+'">'+
                       '<input type="checkbox" value="'+m.id+'"'+(checked?' checked':'')+' onchange="this.parentElement.classList.toggle(\'checked\',this.checked)">'+
                       '<span class="ic">'+m.icon+'</span>'+esc(m.name)+'</label>';
            }).join('');
            document.getElementById('modulesList').innerHTML = html;
        }).catch(function(e){document.getElementById('modStatus').textContent='❌ '+(e.message||e);});
}
function closeModulesModal(){document.getElementById('modulesModal').classList.remove('active');modCurrentUid=null;}
function doSaveModules(){
    if(!modCurrentUid)return;
    var picked = [].slice.call(document.querySelectorAll('#modulesList input:checked')).map(function(i){return i.value;});
    var err = document.getElementById('modErr'); err.style.display='none';
    fetch(API+'?action=adminSetUserModules',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminSetUserModules',user_id:modCurrentUid,modules:picked})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){closeModulesModal();showToast('✅ Module salvate ('+picked.length+')','success');loadUsers();}
            else{err.textContent=res.error||'Eroare';err.style.display='block';}
        }).catch(function(e){err.textContent='Eroare server';err.style.display='block';});
}
function doResetModules(){
    if(!modCurrentUid)return;
    if(!confirm('Resetezi modulele la defaults per rol? Override-ul custom va fi șters.'))return;
    fetch(API+'?action=adminSetUserModules',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminSetUserModules',user_id:modCurrentUid,use_defaults:true})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){closeModulesModal();showToast('✅ Resetat la defaults','success');loadUsers();}
            else showToast('❌ '+(res.error||'Eroare'),'error');
        });
}

function doToggleActive(uid, name, activate){
    var msg = activate ? 'Activezi contul '+name+'?' : 'Dezactivezi contul '+name+'?\n\nUser-ul nu se va mai putea autentifica până la reactivare.';
    if(!confirm(msg))return;
    fetch(API+'?action=adminUpdateUser',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'adminUpdateUser',user_id:uid,active:activate?1:0})})
        .then(function(r){return r.json();}).then(function(res){
            if(res.success){showToast('✅ '+(activate?'Activat':'Dezactivat')+': '+name,'success');loadUsers();}
            else showToast('❌ '+(res.error||'Eroare'),'error');
        });
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSetPwModal();closeCreateModal();closeEditModal();}});
