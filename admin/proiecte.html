<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proiecte — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal CSSI">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--yellow:#eab308;--teal:#14b8a6;--pink:#ec4899;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}

/* Page Header */
.page-header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:color 0.2s;}
.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-actions{display:flex;gap:8px;}
.page-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;}
.page-btn.primary{background:var(--red);color:#fff;}
.page-btn.primary:hover{background:var(--red-d);transform:translateY(-1px);}
.page-btn.ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);}
.page-btn.ghost:hover{background:rgba(255,255,255,0.2);}

/* Container */
.container{max-width:1400px;margin:0 auto;padding:16px;}
@media(min-width:768px){.container{padding:24px;}}

/* Tabs */
.tabs{display:flex;gap:4px;background:#fff;border-radius:var(--radius);padding:4px;box-shadow:var(--shadow);margin-bottom:16px;}
.tab{flex:1;padding:12px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;border:none;background:transparent;color:var(--gray);transition:all 0.2s;text-align:center;}
.tab.active{background:var(--dark);color:#fff;box-shadow:var(--shadow-md);}
.tab:hover:not(.active){background:var(--gray-bg);}

/* Filter Bar */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-chip{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;color:var(--gray);cursor:pointer;transition:all 0.2s;}
.filter-chip:hover{border-color:var(--blue);color:var(--blue);}
.filter-chip.active{background:var(--dark);color:#fff;border-color:var(--dark);}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;min-width:200px;transition:all 0.2s;background:#fff;}
.filter-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}

/* Kanban (same as admin.html) */
.kanban-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
.kanban-wrap::-webkit-scrollbar{height:6px;}.kanban-wrap::-webkit-scrollbar-thumb{background:var(--gray-b);border-radius:3px;}
.kanban{display:flex;gap:12px;min-width:max-content;padding:2px;}
.kanban-col{width:200px;flex-shrink:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
@media(min-width:1200px){.kanban-col{width:calc((100% - 84px)/8);min-width:160px;}}
.kcol-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid transparent;}
.kcol-head.lead{border-color:var(--blue);background:#eff6ff;}.kcol-head.oferta{border-color:var(--purple);background:#f5f3ff;}
.kcol-head.contract{border-color:var(--green);background:#f0fdf4;}.kcol-head.proiectare{border-color:var(--teal);background:#f0fdfa;}
.kcol-head.executie{border-color:var(--orange);background:#fff7ed;}.kcol-head.receptie{border-color:var(--yellow);background:#fefce8;}
.kcol-head.facturat{border-color:var(--pink);background:#fdf2f8;}.kcol-head.mentenanta{border-color:var(--gray);background:var(--gray-bg);}
.kcol-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.kcol-count{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.06);color:var(--gray);}
.kcol-body{padding:8px;min-height:100px;display:flex;flex-direction:column;gap:8px;}
.kcard{background:var(--gray-bg);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:all 0.2s;border:1px solid transparent;}
.kcard:hover{border-color:var(--gray-b);box-shadow:var(--shadow);transform:translateY(-1px);}
.kcard-id{font-size:10px;font-weight:700;color:var(--gray);letter-spacing:0.5px;}
.kcard-title{font-size:13px;font-weight:600;color:var(--dark);margin:4px 0;line-height:1.3;}
.kcard-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray);flex-wrap:wrap;}
.kcard-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;}
.kcard-tag.alarm{background:#fef2f2;color:var(--red);}.kcard-tag.camera{background:#eff6ff;color:var(--blue);}
.kcard-tag.incendiu{background:#fff7ed;color:var(--orange);}.kcard-tag.electric{background:#fefce8;color:#a16207;}
.kcard-tag.install{background:#f0fdf4;color:#059669;}.kcard-tag.auto{background:#f5f3ff;color:var(--purple);}
.kcard-val{font-size:11px;font-weight:700;color:var(--dark);margin-top:6px;}
.kanban-empty{text-align:center;padding:16px;color:var(--gray-l);font-size:12px;font-style:italic;}

/* Table View */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:var(--dark);color:#fff;padding:14px 16px;text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:sticky;top:0;}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--gray-bg);white-space:nowrap;}
.tbl tr:hover td{background:#fafbfc;}
.tbl .status-select{padding:6px 10px;border-radius:8px;border:1px solid var(--gray-b);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;background:#fff;outline:none;transition:all 0.2s;}
.tbl .status-select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,0.1);}
.tbl .val{font-weight:700;color:var(--dark);}
.tbl .loc{color:var(--gray);font-size:12px;}

/* Summary Bar */
.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.summary-item{background:#fff;border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;flex:1;min-width:140px;}
.summary-val{font-size:20px;font-weight:900;color:var(--dark);}
.summary-label{font-size:11px;color:var(--gray);}

/* Modal (same as admin) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:24px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px;}
.form-label .req{color:var(--red);}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 16px;border:2px solid var(--gray-b);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.form-textarea{min-height:80px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;transition:all 0.3s;}
.form-submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px -5px rgba(34,197,94,0.4);}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}
@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}
.bn-item.active{color:var(--red);background:#fef2f2;}
.bn-item .bn-icon{font-size:20px;}

.hidden{display:none!important;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}

/* Loading Bar */
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:400;display:none;}
.loading-bar.active{display:block;}
.loading-bar::after{content:'';display:block;width:30%;height:100%;background:var(--red);border-radius:2px;animation:loadSlide 1.2s infinite ease-in-out;}
@keyframes loadSlide{0%{margin-left:-30%}100%{margin-left:100%}}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 18px;border-radius:12px;color:#fff;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:360px;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--blue);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Nepreluat card animation */
.kcard.nepreluat{border:2px solid var(--red);animation:pulseRed 2s infinite;}
@keyframes pulseRed{0%,100%{border-color:var(--red);box-shadow:0 0 0 0 rgba(220,38,38,0.3)}50%{border-color:#f87171;box-shadow:0 0 8px 2px rgba(220,38,38,0.15)}}
.kcard-resp{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px;}
.kcard-resp.assigned{background:#eff6ff;color:var(--blue);}
.kcard-resp.unassigned{background:#fef2f2;color:var(--red);}
.btn-preia{padding:4px 10px;border-radius:6px;border:none;background:var(--red);color:#fff;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:3px;}
.btn-preia:hover{background:var(--red-d);transform:translateY(-1px);}
.kcard-nepreluat-badge{font-size:9px;font-weight:700;color:var(--red);background:#fef2f2;padding:2px 6px;border-radius:4px;display:inline-block;}

/* Timeline */
.timeline{padding:0;margin:0;list-style:none;}
.tl-item{display:flex;gap:12px;padding:8px 0;position:relative;}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px;border:2px solid #fff;box-shadow:0 0 0 2px var(--gray-b);}
.tl-dot.active{box-shadow:0 0 0 2px var(--blue);}
.tl-line{position:absolute;left:5px;top:20px;bottom:0;width:2px;background:var(--gray-b);}
.tl-item:last-child .tl-line{display:none;}
.tl-content{flex:1;font-size:12px;}
.tl-status{font-weight:700;color:var(--dark);}
.tl-date{color:var(--gray);font-size:11px;}
.tl-user{color:var(--blue);font-size:11px;font-weight:600;}

/* Edit modal wider */
.modal.wide{max-width:600px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:600px){.form-row-3{grid-template-columns:1fr;}}
.form-hint{font-size:11px;color:var(--gray);margin-top:4px;}

/* Oferte badge pe card */
.kcard-oferte{font-size:10px;font-weight:600;color:var(--green);margin-top:4px;}
</style>
</head>
<body>
<div class="loading-bar" id="loadBar"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">📋 Proiecte</div>
        </div>
        <div class="page-actions">
            <button class="page-btn ghost" onclick="refreshProjects()">🔄 Refresh</button>
            <a href="https://docs.google.com/spreadsheets/d/1_2VtCkUU07fNLWI-gUqFY_guDj29xeTWRWGaDzjU0Rc/edit" target="_blank" class="page-btn ghost">📊 Sheet</a>
            <button class="page-btn primary" onclick="openModal()">+ Proiect Nou</button>
        </div>
    </div>

    <!-- Summary -->
    <div class="summary" id="summary"></div>

    <!-- Tabs: Board / Tabel -->
    <div class="tabs">
        <button class="tab active" data-view="board" onclick="switchView('board',this)">📌 Board Kanban</button>
        <button class="tab" data-view="table" onclick="switchView('table',this)">📊 Tabel</button>
    </div>

    <!-- Filters -->
    <div class="filters" id="filterBar">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută proiect..." oninput="applyFilters()">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">Toate</button>
        <button class="filter-chip" data-filter="Lead" onclick="setFilter('Lead',this)">📞 Lead</button>
        <button class="filter-chip" data-filter="Ofertă" onclick="setFilter('Ofertă',this)">📋 Ofertă</button>
        <button class="filter-chip" data-filter="Contract" onclick="setFilter('Contract',this)">✅ Contract</button>
        <button class="filter-chip" data-filter="Execuție" onclick="setFilter('Execuție',this)">🔧 Execuție</button>
        <button class="filter-chip" data-filter="Facturat" onclick="setFilter('Facturat',this)">💳 Facturat</button>
        <button class="filter-chip" data-filter="Mentenanță" onclick="setFilter('Mentenanță',this)">🔄 Mentenanță</button>
    </div>

    <!-- Board View -->
    <div id="boardView" class="kanban-wrap"><div class="kanban" id="kanbanBoard"></div></div>

    <!-- Table View -->
    <div id="tableView" class="table-wrap hidden">
        <table class="tbl">
            <thead><tr>
                <th>ID</th><th>Client</th><th>Serviciu</th><th>Locație</th><th>Valoare</th><th>Responsabil</th><th>Status</th><th></th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">Portal CSSI 3.0 · Modul Proiecte</div>
</div>


<!-- EDIT PROJECT MODAL -->
<div id="editProjectModal" class="modal-overlay" onclick="if(event.target===this)closeEditModal()">
<div class="modal wide">
    <div class="modal-head"><div class="modal-title" id="editModalTitle">✏️ Editare Proiect</div><button class="modal-close" onclick="closeEditModal()">✕</button></div>
    <div class="modal-body">
        <form id="editProjectForm" onsubmit="saveEditProject(event)">
            <input type="hidden" name="editDbId" id="eDbId">
            <input type="hidden" name="editPid" id="ePid">
            <div class="form-row">
                <div class="form-group"><label class="form-label">Client</label><input type="text" class="form-input" name="client" id="eClient"></div>
                <div class="form-group"><label class="form-label">CUI / CNP</label><input type="text" class="form-input" name="cui" id="eCui"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Telefon</label><input type="tel" class="form-input" name="telefon" id="eTelefon"></div>
                <div class="form-group"><label class="form-label">Persoană contact</label><input type="text" class="form-input" name="contact" id="eContact"></div>
            </div>
            <div class="form-row-3">
                <div class="form-group"><label class="form-label">Serviciu</label>
                    <select class="form-select" name="serviciu" id="eServiciu">
                        <option>Detecție Incendiu</option><option>Alarmă Antiefracție</option>
                        <option>Supraveghere Video</option><option>Instalații Electrice</option>
                        <option>Automatizări Porți</option><option>Control Acces</option>
                        <option>Proiect Complex</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Valoare estimată</label><input type="number" class="form-input" name="valoare_estimata" id="eValoare" min="0"></div>
                <div class="form-group"><label class="form-label">Valoare contract</label><input type="number" class="form-input" name="valoare_contract" id="eValContract" min="0"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Responsabil</label>
                    <select class="form-select" name="responsabil" id="eResponsabil">
                        <option value="">— Neselectat —</option>
                        <option value="Mihai">💰 Mihai — Ofertare</option>
                        <option value="Roxana">📋 Roxana — Contracte</option>
                        <option value="Valentin">📐 Valentin — Proiectare</option>
                        <option value="Cristina">📞 Cristina — Lead-uri</option>
                        <option value="Admin">🔑 Admin</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Status</label>
                    <select class="form-select" name="status" id="eStatus">
                        <option value="Lead">📞 Lead</option><option value="Ofertă">📋 Ofertă</option>
                        <option value="Contract">✅ Contract</option><option value="Proiectare">📐 Proiectare</option>
                        <option value="Execuție">🔧 Execuție</option><option value="Recepție">📸 Recepție</option>
                        <option value="Facturat">💳 Facturat</option><option value="Mentenanță">🔄 Mentenanță</option>
                        <option value="Finalizat">✅ Finalizat</option><option value="Anulat">❌ Anulat</option>
                    </select>
                </div>
            </div>
            <div class="form-group"><label class="form-label">Adresă obiectiv</label><input type="text" class="form-input" name="adresa_obiectiv" id="eAdresa"></div>
            <div class="form-group"><label class="form-label">Obiectiv / Descriere</label><input type="text" class="form-input" name="obiectiv" id="eObiectiv"></div>
            <div class="form-group"><label class="form-label">Observații</label><textarea class="form-textarea" name="note" id="eNote"></textarea></div>
            <button type="submit" class="form-submit" id="editSubmitBtn">💾 Salvează Modificările</button>
        </form>
    </div>
</div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item active"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="crm-clienti.html" class="bn-item"><span class="bn-icon">💰</span>CRM</a>
    <a href="executie.html" class="bn-item"><span class="bn-icon">🔧</span>Execuție</a>
    <a href="financiar.html" class="bn-item"><span class="bn-icon">📄</span>Facturi</a>
</div>

<!-- ADD PROJECT MODAL -->
<div id="addProjectModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title">➕ Proiect Nou</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
        <form id="addProjectForm" onsubmit="addProject(event)">
            <div class="form-group"><label class="form-label">Client / Beneficiar <span class="req">*</span></label><input type="text" class="form-input" name="client" required placeholder="Denumire client / firmă"></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">CUI / CNP</label><input type="text" class="form-input" name="cui" placeholder="RO12345678"></div>
                <div class="form-group"><label class="form-label">Telefon</label><input type="tel" class="form-input" name="telefon" placeholder="07xx xxx xxx"></div>
            </div>
            <div class="form-group"><label class="form-label">Persoană contact</label><input type="text" class="form-input" name="contact" placeholder="Nume + telefon contact"></div>
            <div class="form-group"><label class="form-label">Serviciu <span class="req">*</span></label>
                <select class="form-select" name="serviciu" required>
                    <option value="">— Alege —</option>
                    <option>Detecție Incendiu</option><option>Alarmă Antiefracție</option>
                    <option>Supraveghere Video</option><option>Instalații Electrice</option>
                    <option>Automatizări Porți</option><option>Control Acces</option>
                    <option>Proiect Complex</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Locație</label><input type="text" class="form-input" name="locatie" placeholder="Brașov, str..."></div>
                <div class="form-group"><label class="form-label">Valoare (RON)</label><input type="number" class="form-input" name="valoare" placeholder="0"></div>
            </div>
            <div class="form-group"><label class="form-label">Status inițial <span class="req">*</span></label>
                <select class="form-select" name="status" required>
                    <option value="Lead">📞 Lead</option><option value="Ofertă">📋 Ofertă</option>
                    <option value="Contract">✅ Contract</option><option value="Proiectare">📐 Proiectare</option>
                    <option value="Execuție">🔧 Execuție</option><option value="Recepție">📸 Recepție</option>
                    <option value="Facturat">💳 Facturat</option><option value="Mentenanță">🔄 Mentenanță</option>
                </select>
            </div>
            <div class="form-group"><label class="form-label">Obiectiv / Descriere lucrare</label><input type="text" class="form-input" name="obiectiv" placeholder="Ex: Sistem supraveghere depozit"></div>
            <div class="form-group"><label class="form-label">Responsabil</label>
                    <select class="form-select" name="responsabil">
                        <option value="">— Neselectat —</option>
                        <option value="Mihai">💰 Mihai</option>
                        <option value="Roxana">📋 Roxana</option>
                        <option value="Valentin">📐 Valentin</option>
                        <option value="Cristina">📞 Cristina</option>
                        <option value="Admin">🔑 Admin</option>
                    </select></div>
            <div class="form-group"><label class="form-label">Observații</label><textarea class="form-textarea" name="note" placeholder="Detalii..."></textarea></div>
            <button type="submit" class="form-submit">Creează Proiect</button>
        </form>
    </div>
</div>
</div>

<script>
// ═══════ CONFIG ═══════
var API_URL=null;
var API_DB='/admin/api.php';
var SERV_DB_TO_UI={'Detectie Incendiu':'Detecție Incendiu','Alarma':'Alarmă Antiefracție','Supraveghere Video':'Supraveghere Video','Electric':'Instalații Electrice','Automatizari':'Automatizări Porți','Complex':'Proiect Complex','Control Acces':'Control Acces'};
var SERV_UI_TO_DB={'Detecție Incendiu':'Detectie Incendiu','Alarmă Antiefracție':'Alarma','Supraveghere Video':'Supraveghere Video','Instalații Electrice':'Electric','Instalații Sanitare':'Electric','Automatizări Porți':'Automatizari','Proiect Complex':'Complex','Control Acces':'Control Acces'};
var STAT_DB_TO_UI={'Lead':'Lead','Oferta':'Ofertă','Contract':'Contract','Proiectare':'Proiectare','Executie':'Execuție','Receptie':'Recepție','Facturat':'Facturat','Mentenanta':'Mentenanță','Finalizat':'Finalizat','Anulat':'Anulat'};
var STAT_UI_TO_DB={'Lead':'Lead','Ofertă':'Oferta','Contract':'Contract','Proiectare':'Proiectare','Execuție':'Executie','Recepție':'Receptie','Facturat':'Facturat','Mentenanță':'Mentenanta','Finalizat':'Finalizat','Anulat':'Anulat'};
var RESP_ICONS={'Mihai':'💰','Roxana':'📋','Valentin':'📐','Cristina':'📞','Admin':'🔑'};

// ═══════ AUTH CHECK ═══════
var role=sessionStorage.getItem('cssi-role');
if(!role){window.location.href='../admin.html';}
var userName=sessionStorage.getItem('cssi-user')||role;

// ═══════ CONSTANTS ═══════
var STATUSES=[{id:'lead',name:'Lead',cls:'lead'},{id:'oferta',name:'Ofertă',cls:'oferta'},{id:'contract',name:'Contract',cls:'contract'},{id:'proiectare',name:'Proiectare',cls:'proiectare'},{id:'executie',name:'Execuție',cls:'executie'},{id:'receptie',name:'Recepție',cls:'receptie'},{id:'facturat',name:'Facturat',cls:'facturat'},{id:'mentenanta',name:'Mentenanță',cls:'mentenanta'}];
var STATUS_MAP={'Lead':'lead','Ofertă':'oferta','Contract':'contract','Proiectare':'proiectare','Execuție':'executie','Recepție':'receptie','Facturat':'facturat','Mentenanță':'mentenanta'};
var SERVICE_TAGS={'Detecție Incendiu':{cls:'incendiu',s:'Incendiu'},'Alarmă Antiefracție':{cls:'alarm',s:'Alarmă'},'Supraveghere Video':{cls:'camera',s:'Camere'},'Instalații Electrice':{cls:'electric',s:'Electric'},'Instalații Sanitare':{cls:'install',s:'Sanitare'},'Automatizări Porți':{cls:'auto',s:'Porți'},'Control Acces':{cls:'install',s:'Acces'},'Proiect Complex':{cls:'incendiu',s:'Complex'}};
var STATUS_ICONS={'Lead':'📞','Ofertă':'📋','Contract':'✅','Proiectare':'📐','Execuție':'🔧','Recepție':'📸','Facturat':'💳','Mentenanță':'🔄'};

// ═══════ STATE ═══════
var PROJECTS=[];
var currentView='board';
var currentFilter='all';
var isLoading=false;
var Q=String.fromCharCode(39); // single quote helper

// ═══════ INIT ═══════
loadProjects();

// ═══════ LOAD PROJECTS ═══════
function loadProjects(){
    isLoading=true;showLoading(true);
    fetch(API_DB+'?action=getProiecte&_t='+Date.now())
    .then(function(r){return r.json()})
    .then(function(res){
        if(res.success && res.data){
            PROJECTS=res.data.map(function(p){
                return {
                    id:p.proiect_id||p.id||'',
                    dbId:p.id,
                    clientDbId:p.client_db_id||p.client_id||'',
                    client:p.client_nume||'',
                    cui:p.cui_cnp||'',
                    adresa:p.client_adresa||p.adresa_obiectiv||'',
                    contact:p.persoana_contact||'',
                    telefon:p.telefon||'',
                    email:p.email||'',
                    serviciu:SERV_DB_TO_UI[p.serviciu]||p.serviciu||'',
                    serviciuDb:p.serviciu||'',
                    obiectiv:p.obiectiv||'',
                    status:STAT_DB_TO_UI[p.status]||p.status||'Lead',
                    valoare:parseFloat(p.valoare_estimata)||0,
                    valoareContract:parseFloat(p.valoare_contract)||0,
                    responsabil:p.responsabil||'',
                    preluat_de:p.preluat_de||'',
                    preluat_la:p.preluat_la||'',
                    istoric:p.istoric_status||'[]',
                    folderId:'',
                    loc:p.oras||'Brașov',
                    note:p.note||'',
                    dataCreare:p.created_at||'',
                    updatedAt:p.updated_at||''
                };
            });
        } else { PROJECTS=[]; }
        isLoading=false;showLoading(false);renderAll();
    })
    .catch(function(err){
        console.error('API error:',err);
        isLoading=false;showLoading(false);PROJECTS=[];renderAll();
        showToast('⚠️ Eroare încărcare proiecte','error');
    });
}

function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showLoading(on){var el=document.getElementById('loadBar');if(el)el.classList.toggle('active',on);}
function showToast(msg,type){var c=document.getElementById('toastContainer');if(!c){c=document.createElement('div');c.id='toastContainer';c.className='toast-container';document.body.appendChild(c);}var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.remove()},4000);}
function renderAll(){renderSummary();renderKanban();renderTable();}
function applyFilters(){renderAll();}

// ═══════ VIEW SWITCHING ═══════
function switchView(v,btn){
    currentView=v;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    btn.classList.add('active');
    document.getElementById('boardView').classList.toggle('hidden',v!=='board');
    document.getElementById('tableView').classList.toggle('hidden',v!=='table');
}

// ═══════ FILTERS ═══════
function setFilter(f,btn){
    currentFilter=f;
    document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active')});
    btn.classList.add('active');
    renderAll();
}
function getFiltered(){
    var q=(document.getElementById('searchInput')?document.getElementById('searchInput').value:'').toLowerCase();
    return PROJECTS.filter(function(p){
        var matchStatus=currentFilter==='all'||p.status===currentFilter;
        var matchSearch=!q||p.client.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)||p.serviciu.toLowerCase().includes(q)||(p.loc||'').toLowerCase().includes(q)||(p.obiectiv||'').toLowerCase().includes(q)||(p.responsabil||'').toLowerCase().includes(q);
        return matchStatus&&matchSearch;
    });
}

// ═══════ SUMMARY ═══════
function renderSummary(){
    var f=getFiltered();
    var total=f.length;
    var val=f.reduce(function(s,p){return s+(p.valoare||0)},0);
    var valContract=f.reduce(function(s,p){return s+(p.valoareContract||0)},0);
    var active=f.filter(function(p){return['Lead','Ofertă','Contract','Proiectare','Execuție','Recepție'].includes(p.status)}).length;
    var neprelate=f.filter(function(p){return!p.preluat_de&&p.status!=='Lead'&&p.status!=='Finalizat'&&p.status!=='Anulat'}).length;
    document.getElementById('summary').innerHTML=
        '<div class="summary-item"><div><div class="summary-val">'+total+'</div><div class="summary-label">Total proiecte</div></div></div>'+
        '<div class="summary-item"><div><div class="summary-val">'+active+'</div><div class="summary-label">Active</div></div></div>'+
        '<div class="summary-item"><div><div class="summary-val">'+val.toLocaleString('ro-RO')+'</div><div class="summary-label">Val. estimată (RON)</div></div></div>'+
        (valContract?'<div class="summary-item"><div><div class="summary-val" style="color:var(--green)">'+valContract.toLocaleString('ro-RO')+'</div><div class="summary-label">Val. contracte (RON)</div></div></div>':'')+
        (neprelate?'<div class="summary-item"><div><div class="summary-val" style="color:var(--red)">'+neprelate+'</div><div class="summary-label">⚠️ Neprelate</div></div></div>':'');
}

// ═══════ KANBAN ═══════
function renderKanban(){
    var b=document.getElementById('kanbanBoard');b.innerHTML='';
    var filtered=getFiltered();
    STATUSES.forEach(function(st){
        var prj=filtered.filter(function(p){return STATUS_MAP[p.status]===st.id});
        var col=document.createElement('div');col.className='kanban-col';
        col.innerHTML='<div class="kcol-head '+st.cls+'"><span class="kcol-name">'+(STATUS_ICONS[st.name]||'')+' '+st.name+'</span><span class="kcol-count">'+prj.length+'</span></div>';
        var body=document.createElement('div');body.className='kcol-body';
        if(!prj.length){body.innerHTML='<div class="kanban-empty">—</div>';}
        else{prj.forEach(function(p){
            var t=SERVICE_TAGS[p.serviciu]||{cls:'install',s:p.serviciu||'—'};
            var isNepreluat=!p.preluat_de&&st.id!=='lead'&&st.id!=='facturat'&&st.id!=='mentenanta';
            var respHtml='';
            if(p.preluat_de){
                respHtml='<div class="kcard-resp assigned">'+(RESP_ICONS[p.preluat_de]||'👤')+' '+esc(p.preluat_de)+'</div>';
            } else if(p.responsabil){
                respHtml='<div class="kcard-resp assigned">'+(RESP_ICONS[p.responsabil]||'👤')+' '+esc(p.responsabil)+'</div>';
            }
            var preiaHtml='';
            if(isNepreluat){
                preiaHtml='<div style="margin-top:6px"><span class="kcard-nepreluat-badge">⚠️ Nepreluat</span> <button class="btn-preia" onclick="event.stopPropagation();preiaProiect('+Q+p.id+Q+')">🤚 Preia</button></div>';
            }
            var valHtml=(p.valoare||0).toLocaleString('ro-RO')+' RON';
            if(p.valoareContract){valHtml='<span style="color:var(--green);font-weight:900">'+(p.valoareContract).toLocaleString('ro-RO')+'</span> <span style="font-size:9px;color:var(--gray)">(est. '+(p.valoare||0).toLocaleString('ro-RO')+')</span>';}

            var c=document.createElement('div');c.className='kcard'+(isNepreluat?' nepreluat':'');
            c.onclick=function(){openProjectDetail(p.id);};
            c.innerHTML='<div class="kcard-id">'+p.id+'</div>'+
                '<div class="kcard-title">'+esc(p.client)+'</div>'+
                '<div class="kcard-meta"><span class="kcard-tag '+t.cls+'">'+t.s+'</span><span>📍 '+(p.loc||'Brașov')+'</span></div>'+
                '<div class="kcard-val">'+valHtml+'</div>'+
                respHtml+preiaHtml;
            body.appendChild(c);
        });}
        col.appendChild(body);b.appendChild(col);
    });
}

// ═══════ TABLE ═══════
function renderTable(){
    var tb=document.getElementById('tableBody');tb.innerHTML='';
    var filtered=getFiltered();
    if(!filtered.length){
        tb.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--gray-l);padding:24px">'+(isLoading?'Se încarcă...':'Niciun proiect')+'</td></tr>';
        return;
    }
    filtered.forEach(function(p){
        var t=SERVICE_TAGS[p.serviciu]||{cls:'install',s:p.serviciu||'—'};
        var opts=Object.keys(STATUS_MAP).map(function(s){return '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+STATUS_ICONS[s]+' '+s+'</option>';}).join('');
        var respName=p.preluat_de||p.responsabil||'—';
        var respIcon=RESP_ICONS[respName]||'';
        var tr=document.createElement('tr');
        tr.innerHTML=
            '<td><strong>'+p.id+'</strong></td>'+
            '<td>'+esc(p.client)+'</td>'+
            '<td><span class="kcard-tag '+t.cls+'">'+t.s+'</span></td>'+
            '<td class="loc">📍 '+(p.loc||'Brașov')+'</td>'+
            '<td class="val">'+(p.valoare||0).toLocaleString('ro-RO')+' RON</td>'+
            '<td style="font-size:12px">'+(respIcon?respIcon+' ':'')+esc(respName)+'</td>'+
            '<td><select class="status-select" onchange="changeStatus('+Q+p.id+Q+',this.value)">'+opts+'</select></td>'+
            '<td><button onclick="openEditModal('+Q+p.id+Q+')" style="padding:5px 10px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:11px;font-weight:700;cursor:pointer" title="Editare">✏️</button></td>';
        tb.appendChild(tr);
    });
}

// ═══════ STATUS CHANGE ═══════
function changeStatus(projectId,newStatus){
    var p=PROJECTS.find(function(x){return x.id===projectId});
    if(!p) return;
    var oldStatus=p.status;
    p.status=newStatus;
    renderAll();
    showToast('🔄 '+projectId+' → '+newStatus,'info');
    var statusDB=STAT_UI_TO_DB[newStatus]||newStatus;
    fetch(API_DB+'?action=updateStatus',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'updateStatus',id:p.dbId||projectId,status:statusDB,user:userName||'Admin'})
    })
    .then(function(r){return r.json()})
    .then(function(res){
        if(res.success){showToast('✅ Status actualizat','success');loadProjects();}
        else{showToast('❌ '+(res.error||'Eroare'),'error');p.status=oldStatus;renderAll();}
    })
    .catch(function(err){showToast('❌ Eroare rețea','error');p.status=oldStatus;renderAll();});
}

// ═══════ PREIA PROIECT ═══════
function preiaProiect(projectId){
    var p=PROJECTS.find(function(x){return x.id===projectId});
    if(!p) return;
    if(!confirm('Preiei proiectul '+p.id+' ('+p.client+')?')) return;
    fetch(API_DB+'?action=preiaProiect',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'preiaProiect',id:p.dbId||projectId,user:userName})
    })
    .then(function(r){return r.json()})
    .then(function(res){
        if(res.success){
            showToast('🤚 Ai preluat '+p.id+'!','success');
            p.preluat_de=userName;
            renderAll();
            setTimeout(loadProjects,500);
        } else {showToast('❌ '+(res.error||'Eroare'),'error');}
    })
    .catch(function(err){showToast('❌ Eroare rețea','error');});
}

// ═══════ ADD PROJECT ═══════
function openModal(){document.getElementById('addProjectModal').classList.add('active');}
function closeModal(){document.getElementById('addProjectModal').classList.remove('active');}
function addProject(e){
    e.preventDefault();
    var f=document.getElementById('addProjectForm');
    var d=new FormData(f);
    var btn=f.querySelector('button[type=submit]');
    btn.disabled=true;btn.textContent='⏳ Se creează...';showLoading(true);
    var pd={client:d.get('client')||'',cui:d.get('cui')||'',adresa:d.get('locatie')||'Brașov',contact:d.get('contact')||'',telefon:d.get('telefon')||'',serviciu:d.get('serviciu')||'',obiectiv:d.get('obiectiv')||'',status:d.get('status')||'Lead',valoare:parseInt(d.get('valoare'))||0,responsabil:d.get('responsabil')||'',note:d.get('note')||''};
    fetch(API_DB+'?action=createClient',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'createClient',nume:pd.client,cui_cnp:pd.cui,telefon:pd.telefon,adresa:pd.adresa,oras:pd.adresa||'Brașov',persoana_contact:pd.contact})
    })
    .then(function(r){return r.json()})
    .then(function(cRes){
        if(!cRes.success) throw new Error(cRes.error||'Eroare client');
        var servDB=SERV_UI_TO_DB[pd.serviciu]||pd.serviciu;
        var statDB=STAT_UI_TO_DB[pd.status]||pd.status;
        return fetch(API_DB+'?action=createProiect',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'createProiect',client_id:cRes.id,serviciu:servDB,obiectiv:pd.obiectiv,status:statDB,valoare_estimata:pd.valoare,adresa_obiectiv:pd.adresa,responsabil:pd.responsabil||'Admin',note:pd.note})
        });
    })
    .then(function(r){return r.json()})
    .then(function(res){
        showLoading(false);btn.disabled=false;btn.textContent='Creează Proiect';
        if(res.success){showToast('✅ Proiect '+(res.proiect_id||'')+' creat!','success');closeModal();f.reset();loadProjects();}
        else{showToast('❌ '+(res.error||'Eroare'),'error');}
    })
    .catch(function(err){showLoading(false);btn.disabled=false;btn.textContent='Creează Proiect';showToast('❌ '+err.message,'error');});
}

// ═══════ EDIT PROJECT ═══════
function openEditModal(projectId){
    var p=PROJECTS.find(function(x){return x.id===projectId});
    if(!p) return;
    closeDetailModal();
    document.getElementById('editModalTitle').textContent='✏️ Editare '+p.id;
    document.getElementById('eDbId').value=p.dbId;
    document.getElementById('ePid').value=p.id;
    document.getElementById('eClient').value=p.client;
    document.getElementById('eCui').value=p.cui;
    document.getElementById('eTelefon').value=p.telefon;
    document.getElementById('eContact').value=p.contact;
    document.getElementById('eServiciu').value=p.serviciu;
    document.getElementById('eValoare').value=p.valoare||'';
    document.getElementById('eValContract').value=p.valoareContract||'';
    document.getElementById('eResponsabil').value=p.responsabil;
    document.getElementById('eStatus').value=p.status;
    document.getElementById('eAdresa').value=p.adresa;
    document.getElementById('eObiectiv').value=p.obiectiv;
    document.getElementById('eNote').value=p.note;
    document.getElementById('editProjectModal').classList.add('active');
}
function closeEditModal(){document.getElementById('editProjectModal').classList.remove('active');}

function saveEditProject(e){
    e.preventDefault();
    var btn=document.getElementById('editSubmitBtn');
    btn.disabled=true;btn.textContent='⏳ Se salvează...';
    var dbId=document.getElementById('eDbId').value;
    var pid=document.getElementById('ePid').value;
    var servDB=SERV_UI_TO_DB[document.getElementById('eServiciu').value]||document.getElementById('eServiciu').value;
    var statDB=STAT_UI_TO_DB[document.getElementById('eStatus').value]||document.getElementById('eStatus').value;
    var payload={
        action:'updateProiect',
        id:dbId,
        serviciu:servDB,
        obiectiv:document.getElementById('eObiectiv').value,
        status:statDB,
        valoare_estimata:parseFloat(document.getElementById('eValoare').value)||0,
        valoare_contract:parseFloat(document.getElementById('eValContract').value)||0,
        responsabil:document.getElementById('eResponsabil').value,
        adresa_obiectiv:document.getElementById('eAdresa').value,
        note:document.getElementById('eNote').value
    };
    fetch(API_DB+'?action=updateProiect',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
    })
    .then(function(r){return r.json()})
    .then(function(res){
        btn.disabled=false;btn.textContent='💾 Salvează Modificările';
        if(res.success){showToast('✅ '+pid+' actualizat!','success');closeEditModal();loadProjects();}
        else{showToast('❌ '+(res.error||'Eroare'),'error');}
    })
    .catch(function(err){btn.disabled=false;btn.textContent='💾 Salvează Modificările';showToast('❌ '+err.message,'error');});
}

// ═══════ PROJECT DETAIL ═══════
function openProjectDetail(projectId){
    var p=PROJECTS.find(function(x){return x.id===projectId});
    if(!p) return;

    // Parse istoric
    var istoric=[];
    try{istoric=JSON.parse(p.istoric||'[]');}catch(e){}

    var timelineHtml='';
    if(istoric.length){
        timelineHtml='<div style="margin-top:12px;margin-bottom:12px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">📅 Istoric Statusuri</div><ul class="timeline">';
        istoric.forEach(function(h,i){
            var isLast=i===istoric.length-1;
            var statusName=STAT_DB_TO_UI[h.status]||h.status||'?';
            var icon=STATUS_ICONS[statusName]||'📌';
            var dotColor=isLast?'var(--blue)':'var(--gray-b)';
            timelineHtml+='<li class="tl-item"><div class="tl-dot'+(isLast?' active':'')+'" style="background:'+dotColor+'"></div><div class="tl-line"></div><div class="tl-content"><span class="tl-status">'+icon+' '+statusName+'</span><div class="tl-date">'+(h.data||'—')+'</div>'+(h.user?'<div class="tl-user">👤 '+esc(h.user)+'</div>':'')+'</div></li>';
        });
        timelineHtml+='</ul></div>';
    }

    var preluatHtml='';
    if(p.preluat_de){
        preluatHtml='<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px"><strong style="color:var(--green)">✅ Preluat de:</strong> '+(RESP_ICONS[p.preluat_de]||'')+' '+esc(p.preluat_de)+(p.preluat_la?' · '+p.preluat_la:'')+'</div>';
    } else if(p.status!=='Lead'&&p.status!=='Finalizat'&&p.status!=='Anulat'){
        preluatHtml='<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center"><span style="color:var(--red);font-weight:700">⚠️ Nepreluat</span><button class="btn-preia" onclick="event.stopPropagation();closeDetailModal();preiaProiect('+Q+p.id+Q+')">🤚 Preia proiectul</button></div>';
    }

    var valHtml='<div><strong>Val. estimată:</strong> '+(p.valoare||0).toLocaleString('ro-RO')+' RON</div>';
    if(p.valoareContract) valHtml+='<div><strong>Val. contract:</strong> <span style="color:var(--green);font-weight:800">'+(p.valoareContract).toLocaleString('ro-RO')+' RON</span></div>';

    var html='<div style="padding:4px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
        '<span style="font-size:12px;font-weight:700;color:var(--blue)">'+p.id+'</span>'+
        '<span class="kcard-tag '+(STATUS_MAP[p.status]||'lead')+'" style="padding:4px 10px">'+(STATUS_ICONS[p.status]||'')+' '+p.status+'</span></div>'+
        '<div style="font-size:18px;font-weight:800;margin-bottom:8px">'+esc(p.client)+'</div>'+
        (p.obiectiv?'<div style="font-size:12px;color:var(--gray);margin-bottom:8px">📋 '+esc(p.obiectiv)+'</div>':'')+
        preluatHtml+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:12px">'+
        '<div><strong>Serviciu:</strong> '+(p.serviciu||'—')+'</div>'+
        valHtml+
        '<div><strong>Locație:</strong> '+(p.loc||'—')+'</div>'+
        '<div><strong>Telefon:</strong> '+(p.telefon||'—')+'</div>'+
        '<div><strong>CUI:</strong> '+(p.cui||'—')+'</div>'+
        '<div><strong>Contact:</strong> '+(p.contact||'—')+'</div>'+
        '<div><strong>Creat:</strong> '+(p.dataCreare||'—')+'</div>'+
        '<div><strong>Responsabil:</strong> '+(RESP_ICONS[p.responsabil]||'')+' '+(p.responsabil||'—')+'</div>'+
        '</div>'+
        (p.note?'<div style="font-size:11px;color:var(--gray);padding:8px;background:var(--gray-bg);border-radius:8px;margin-bottom:12px">📝 '+esc(p.note)+'</div>':'')+
        timelineHtml+
        '<div id="oferteSection" style="margin-bottom:12px"><div style="text-align:center;padding:12px;color:var(--gray-l);font-size:12px">⏳ Se încarcă ofertele...</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button onclick="openEditModal('+Q+p.id+Q+')" style="flex:1;padding:10px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">✏️ Editează</button>'+
        '<a href="calculator-pret.html?client='+encodeURIComponent(p.client)+'&client_db_id='+p.clientDbId+'&proiect_db_id='+p.dbId+'&obiectiv='+encodeURIComponent(p.obiectiv||'')+'&adresa='+encodeURIComponent(p.adresa||'')+'" style="flex:1;padding:10px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;text-align:center;display:block">📄 Ofertă</a>'+
        '<button onclick="closeDetailModal()" style="padding:10px 16px;border-radius:10px;border:1px solid var(--gray-b);background:#fff;color:var(--gray);font-weight:600;font-size:13px;cursor:pointer">Închide</button>'+
        '</div></div>';

    var overlay=document.getElementById('detailModal');
    if(!overlay){
        overlay=document.createElement('div');overlay.id='detailModal';overlay.className='modal-overlay';
        overlay.onclick=function(ev){if(ev.target===overlay)closeDetailModal();};
        overlay.innerHTML='<div class="modal wide"><div class="modal-head"><div class="modal-title" id="detailTitle"></div><button class="modal-close" onclick="closeDetailModal()">✕</button></div><div class="modal-body" id="detailBody"></div></div>';
        document.body.appendChild(overlay);
    }
    document.getElementById('detailTitle').textContent='📋 '+p.id+' — '+esc(p.client);
    document.getElementById('detailBody').innerHTML=html;
    overlay.classList.add('active');
    
    // Încarcă ofertele pentru acest proiect
    loadProjectOferte(p.dbId, p.clientDbId);
}

// ═══════ OFERTE ÎN DETALII PROIECT ═══════
function loadProjectOferte(dbId, clientDbId){
    var url=API_DB+'?action=getOferte&_t='+Date.now();
    if(dbId) url+='&proiect_id='+dbId;
    else if(clientDbId) url+='&client_id='+clientDbId;
    else { document.getElementById('oferteSection').innerHTML=''; return; }
    
    fetch(url)
    .then(function(r){return r.json()})
    .then(function(res){
        var sec=document.getElementById('oferteSection');
        if(!sec) return;
        if(!res.success||!res.data||!res.data.length){
            // Try with client_id if proiect_id returned nothing
            if(dbId && clientDbId){
                var url2=API_DB+'?action=getOferte&client_id='+clientDbId+'&_t='+Date.now();
                fetch(url2).then(function(r2){return r2.json()}).then(function(res2){
                    if(!res2.success||!res2.data||!res2.data.length){
                        sec.innerHTML='<div style="font-size:12px;color:var(--gray-l);text-align:center;padding:8px">Nicio ofertă asociată</div>';
                    } else { renderOferteSection(sec, res2.data); }
                });
            } else {
                sec.innerHTML='<div style="font-size:12px;color:var(--gray-l);text-align:center;padding:8px">Nicio ofertă asociată</div>';
            }
            return;
        }
        renderOferteSection(sec, res.data);
    })
    .catch(function(e){ 
        var sec=document.getElementById('oferteSection');
        if(sec) sec.innerHTML='';
    });
}

function renderOferteSection(container, oferte){
    var acceptate=oferte.filter(function(o){return o.oferta_status==='Acceptata'});
    var trimise=oferte.filter(function(o){return o.oferta_status==='Trimisa'});
    var drafts=oferte.filter(function(o){return o.oferta_status==='Draft'});
    var refuzate=oferte.filter(function(o){return o.oferta_status==='Refuzata'});
    
    var html='<div style="font-size:13px;font-weight:700;margin-bottom:8px">📄 Oferte ('+oferte.length+')</div>';
    
    // Acceptate - afișate prominent
    if(acceptate.length){
        var totalAcc=acceptate.reduce(function(s,o){return s+(parseFloat(o.total_cu_tva)||0)},0);
        html+='<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin-bottom:8px">';
        html+='<div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">✅ Oferte Acceptate ('+acceptate.length+')</div>';
        acceptate.forEach(function(o){
            var total=parseFloat(o.total_cu_tva)||0;
            var titlu=(o.titlu||o.oferta_id||'').replace(/Deviz.*?ser\.BV/,'').replace(/Nr\.\s*\d+\s*din\s*[\d.]+/,'').trim();
            if(!titlu) titlu=o.oferta_id;
            html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #dcfce7;font-size:12px">';
            html+='<div><strong>'+esc(o.oferta_id)+'</strong> — '+esc(titlu)+'<div style="font-size:10px;color:var(--gray)">'+(o.data_oferta||'')+'</div></div>';
            html+='<div style="font-weight:900;color:var(--green);white-space:nowrap">'+total.toLocaleString("ro-RO")+ ' RON</div>';
            html+='</div>';
        });
        html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 0;font-size:14px;font-weight:900;border-top:2px solid #bbf7d0;margin-top:4px">';
        html+='<span>TOTAL CONTRACT</span><span style="color:var(--green)">'+totalAcc.toLocaleString("ro-RO")+' RON</span></div>';
        html+='</div>';
    }
    
    // Trimise
    if(trimise.length){
        html+='<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;margin-bottom:8px">';
        html+='<div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:6px">📤 Trimise ('+trimise.length+')</div>';
        trimise.forEach(function(o){
            html+='<div style="font-size:12px;padding:3px 0"><strong>'+esc(o.oferta_id)+'</strong> — '+(parseFloat(o.total_cu_tva)||0).toLocaleString("ro-RO")+' RON</div>';
        });
        html+='</div>';
    }
    
    // Drafts
    if(drafts.length){
        html+='<div style="background:var(--gray-bg);border:1px solid var(--gray-b);border-radius:10px;padding:10px;margin-bottom:8px">';
        html+='<div style="font-size:11px;font-weight:700;color:var(--gray);margin-bottom:6px">📝 Draft ('+drafts.length+')</div>';
        drafts.forEach(function(o){
            html+='<div style="font-size:12px;padding:3px 0"><strong>'+esc(o.oferta_id)+'</strong> — '+(parseFloat(o.total_cu_tva)||0).toLocaleString("ro-RO")+' RON</div>';
        });
        html+='</div>';
    }
    
    // Refuzate (compact)
    if(refuzate.length){
        html+='<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-bottom:8px">';
        html+='<div style="font-size:11px;font-weight:700;color:var(--red);margin-bottom:6px">❌ Refuzate ('+refuzate.length+')</div>';
        refuzate.forEach(function(o){
            html+='<div style="font-size:12px;padding:3px 0"><strong>'+esc(o.oferta_id)+'</strong> — '+(parseFloat(o.total_cu_tva)||0).toLocaleString("ro-RO")+' RON';
            if(o.motiv_respingere) html+=' <span style="font-size:10px;color:var(--red)">('+esc(o.motiv_respingere)+')</span>';
            html+='</div>';
        });
        html+='</div>';
    }
    
    container.innerHTML=html;
}
function closeDetailModal(){var m=document.getElementById('detailModal');if(m)m.classList.remove('active');}

// ═══════ REFRESH ═══════
function refreshProjects(){showToast('🔄 Se reîncarcă...','info');loadProjects();}
