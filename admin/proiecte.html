<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proiecte — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal CSSI">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--yellow:#eab308;--teal:#14b8a6;--pink:#ec4899;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}

/* Page Header */
.page-header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:color 0.2s;}
.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-actions{display:flex;gap:8px;}
.page-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;}
.page-btn.primary{background:var(--red);color:#fff;}
.page-btn.primary:hover{background:var(--red-d);transform:translateY(-1px);}
.page-btn.ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);}
.page-btn.ghost:hover{background:rgba(255,255,255,0.2);}

/* Container */
.container{max-width:1400px;margin:0 auto;padding:16px;}
@media(min-width:768px){.container{padding:24px;}}

/* Tabs */
.tabs{display:flex;gap:4px;background:#fff;border-radius:var(--radius);padding:4px;box-shadow:var(--shadow);margin-bottom:16px;}
.tab{flex:1;padding:12px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;border:none;background:transparent;color:var(--gray);transition:all 0.2s;text-align:center;}
.tab.active{background:var(--dark);color:#fff;box-shadow:var(--shadow-md);}
.tab:hover:not(.active){background:var(--gray-bg);}

/* Filter Bar */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-chip{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;color:var(--gray);cursor:pointer;transition:all 0.2s;}
.filter-chip:hover{border-color:var(--blue);color:var(--blue);}
.filter-chip.active{background:var(--dark);color:#fff;border-color:var(--dark);}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;min-width:200px;transition:all 0.2s;background:#fff;}
.filter-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}

/* Kanban (same as admin.html) */
.kanban-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
.kanban-wrap::-webkit-scrollbar{height:6px;}.kanban-wrap::-webkit-scrollbar-thumb{background:var(--gray-b);border-radius:3px;}
.kanban{display:flex;gap:12px;min-width:max-content;padding:2px;}
.kanban-col{width:200px;flex-shrink:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
@media(min-width:1200px){.kanban-col{width:calc((100% - 84px)/8);min-width:160px;}}
.kcol-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid transparent;}
.kcol-head.lead{border-color:var(--blue);background:#eff6ff;}.kcol-head.oferta{border-color:var(--purple);background:#f5f3ff;}
.kcol-head.contract{border-color:var(--green);background:#f0fdf4;}.kcol-head.proiectare{border-color:var(--teal);background:#f0fdfa;}
.kcol-head.executie{border-color:var(--orange);background:#fff7ed;}.kcol-head.receptie{border-color:var(--yellow);background:#fefce8;}
.kcol-head.facturat{border-color:var(--pink);background:#fdf2f8;}.kcol-head.mentenanta{border-color:var(--gray);background:var(--gray-bg);}
.kcol-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.kcol-count{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.06);color:var(--gray);}
.kcol-body{padding:8px;min-height:100px;display:flex;flex-direction:column;gap:8px;}
.kcard{background:var(--gray-bg);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:all 0.2s;border:1px solid transparent;}
.kcard:hover{border-color:var(--gray-b);box-shadow:var(--shadow);transform:translateY(-1px);}
.kcard-id{font-size:10px;font-weight:700;color:var(--gray);letter-spacing:0.5px;}
.kcard-title{font-size:13px;font-weight:600;color:var(--dark);margin:4px 0;line-height:1.3;}
.kcard-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray);flex-wrap:wrap;}
.kcard-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;}
.kcard-tag.alarm{background:#fef2f2;color:var(--red);}.kcard-tag.camera{background:#eff6ff;color:var(--blue);}
.kcard-tag.incendiu{background:#fff7ed;color:var(--orange);}.kcard-tag.electric{background:#fefce8;color:#a16207;}
.kcard-tag.install{background:#f0fdf4;color:#059669;}.kcard-tag.auto{background:#f5f3ff;color:var(--purple);}
.kcard-val{font-size:11px;font-weight:700;color:var(--dark);margin-top:6px;}
.kanban-empty{text-align:center;padding:16px;color:var(--gray-l);font-size:12px;font-style:italic;}

/* Table View */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:var(--dark);color:#fff;padding:14px 16px;text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;position:sticky;top:0;}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--gray-bg);white-space:nowrap;}
.tbl tr:hover td{background:#fafbfc;}
.tbl .status-select{padding:6px 10px;border-radius:8px;border:1px solid var(--gray-b);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;background:#fff;outline:none;transition:all 0.2s;}
.tbl .status-select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,0.1);}
.tbl .val{font-weight:700;color:var(--dark);}
.tbl .loc{color:var(--gray);font-size:12px;}

/* Summary Bar */
.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.summary-item{background:#fff;border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;flex:1;min-width:140px;}
.summary-val{font-size:20px;font-weight:900;color:var(--dark);}
.summary-label{font-size:11px;color:var(--gray);}

/* Modal (same as admin) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:24px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px;}
.form-label .req{color:var(--red);}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 16px;border:2px solid var(--gray-b);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.form-textarea{min-height:80px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;transition:all 0.3s;}
.form-submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px -5px rgba(34,197,94,0.4);}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}
@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}
.bn-item.active{color:var(--red);background:#fef2f2;}
.bn-item .bn-icon{font-size:20px;}

.hidden{display:none!important;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">📋 Proiecte</div>
        </div>
        <div class="page-actions">
            <button class="page-btn primary" onclick="openModal()">+ Proiect Nou</button>
        </div>
    </div>

    <!-- Summary -->
    <div class="summary" id="summary"></div>

    <!-- Tabs: Board / Tabel -->
    <div class="tabs">
        <button class="tab active" data-view="board" onclick="switchView('board',this)">📌 Board Kanban</button>
        <button class="tab" data-view="table" onclick="switchView('table',this)">📊 Tabel</button>
    </div>

    <!-- Filters -->
    <div class="filters" id="filterBar">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută proiect..." oninput="applyFilters()">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">Toate</button>
        <button class="filter-chip" data-filter="Lead" onclick="setFilter('Lead',this)">📞 Lead</button>
        <button class="filter-chip" data-filter="Ofertă" onclick="setFilter('Ofertă',this)">📋 Ofertă</button>
        <button class="filter-chip" data-filter="Contract" onclick="setFilter('Contract',this)">✅ Contract</button>
        <button class="filter-chip" data-filter="Execuție" onclick="setFilter('Execuție',this)">🔧 Execuție</button>
        <button class="filter-chip" data-filter="Facturat" onclick="setFilter('Facturat',this)">💳 Facturat</button>
        <button class="filter-chip" data-filter="Mentenanță" onclick="setFilter('Mentenanță',this)">🔄 Mentenanță</button>
    </div>

    <!-- Board View -->
    <div id="boardView" class="kanban-wrap"><div class="kanban" id="kanbanBoard"></div></div>

    <!-- Table View -->
    <div id="tableView" class="table-wrap hidden">
        <table class="tbl">
            <thead><tr>
                <th>ID</th><th>Client</th><th>Serviciu</th><th>Locație</th><th>Valoare</th><th>Status</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">Portal CSSI 3.0 · Modul Proiecte</div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item active"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="crm-clienti.html" class="bn-item"><span class="bn-icon">💰</span>CRM</a>
    <a href="executie.html" class="bn-item"><span class="bn-icon">🔧</span>Execuție</a>
    <a href="financiar.html" class="bn-item"><span class="bn-icon">📄</span>Facturi</a>
</div>

<!-- ADD PROJECT MODAL -->
<div id="addProjectModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title">➕ Proiect Nou</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
        <form id="addProjectForm" onsubmit="addProject(event)">
            <div class="form-group"><label class="form-label">Client <span class="req">*</span></label><input type="text" class="form-input" name="client" required placeholder="Numele clientului"></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Telefon</label><input type="tel" class="form-input" name="telefon" placeholder="07xx xxx xxx"></div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" name="email" placeholder="email@client.ro"></div>
            </div>
            <div class="form-group"><label class="form-label">Serviciu <span class="req">*</span></label>
                <select class="form-select" name="serviciu" required>
                    <option value="">— Alege —</option>
                    <option>Detecție Incendiu</option><option>Alarmă Antiefracție</option>
                    <option>Supraveghere Video</option><option>Instalații Electrice</option>
                    <option>Instalații Sanitare</option><option>Automatizări Porți</option>
                    <option>Proiect Complex</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Locație</label><input type="text" class="form-input" name="locatie" placeholder="Brașov, str..."></div>
                <div class="form-group"><label class="form-label">Valoare (RON)</label><input type="number" class="form-input" name="valoare" placeholder="0"></div>
            </div>
            <div class="form-group"><label class="form-label">Status inițial <span class="req">*</span></label>
                <select class="form-select" name="status" required>
                    <option value="Lead">📞 Lead</option><option value="Ofertă">📋 Ofertă</option>
                    <option value="Contract">✅ Contract</option><option value="Proiectare">📐 Proiectare</option>
                    <option value="Execuție">🔧 Execuție</option><option value="Recepție">📸 Recepție</option>
                    <option value="Facturat">💳 Facturat</option><option value="Mentenanță">🔄 Mentenanță</option>
                </select>
            </div>
            <div class="form-group"><label class="form-label">Observații</label><textarea class="form-textarea" name="note" placeholder="Detalii..."></textarea></div>
            <button type="submit" class="form-submit">Creează Proiect</button>
        </form>
    </div>
</div>
</div>

<script>
// ═══════ AUTH CHECK ═══════
var API_URL = 'https://script.google.com/macros/s/AKfycbzdM_e5DY5nmd57TmB24sXz8dML93gKIolkmlqKxE7_d-_o3jHMVYuQ06YiQ5zJgZiB/exec';
var role=sessionStorage.getItem("cssi-role");
if(!role||!["admin","org","sales","tech"].includes(role)){window.location.href="../admin.html";}

// ═══════ DATA ═══════
var STATUSES=[{id:"lead",name:"Lead",cls:"lead"},{id:"oferta",name:"Ofertă",cls:"oferta"},{id:"contract",name:"Contract",cls:"contract"},{id:"proiectare",name:"Proiectare",cls:"proiectare"},{id:"executie",name:"Execuție",cls:"executie"},{id:"receptie",name:"Recepție",cls:"receptie"},{id:"facturat",name:"Facturat",cls:"facturat"},{id:"mentenanta",name:"Mentenanță",cls:"mentenanta"}];
var STATUS_MAP={"Lead":"lead","Ofertă":"oferta","Contract":"contract","Proiectare":"proiectare","Execuție":"executie","Recepție":"receptie","Facturat":"facturat","Mentenanță":"mentenanta"};
var SERVICE_TAGS={"Detecție Incendiu":{cls:"incendiu",s:"Incendiu"},"Alarmă Antiefracție":{cls:"alarm",s:"Alarmă"},"Supraveghere Video":{cls:"camera",s:"Camere"},"Instalații Electrice":{cls:"electric",s:"Electric"},"Instalații Sanitare":{cls:"install",s:"Sanitare"},"Automatizări Porți":{cls:"auto",s:"Porți"},"Proiect Complex":{cls:"incendiu",s:"Complex"}};
var STATUS_ICONS={"Lead":"📞","Ofertă":"📋","Contract":"✅","Proiectare":"📐","Execuție":"🔧","Recepție":"📸","Facturat":"💳","Mentenanță":"🔄"};

var PROJECTS=[
    {id:"CSSI-2026-001",client:"Hotel Cheile Râșnoavei",serviciu:"Detecție Incendiu",status:"Execuție",valoare:45000,loc:"Râșnov"},
    {id:"CSSI-2026-002",client:"Magazin Coresi",serviciu:"Supraveghere Video",status:"Lead",valoare:12000,loc:"Brașov"},
    {id:"CSSI-2026-003",client:"Vila Poiana",serviciu:"Alarmă Antiefracție",status:"Ofertă",valoare:8500,loc:"Poiana Brașov"},
    {id:"CSSI-2026-004",client:"Birouri IT Hub",serviciu:"Instalații Electrice",status:"Contract",valoare:67000,loc:"Brașov"},
    {id:"CSSI-2026-005",client:"Restaurant Central",serviciu:"Detecție Incendiu",status:"Proiectare",valoare:23000,loc:"Brașov"},
    {id:"CSSI-2026-006",client:"Depozit Ghimbav",serviciu:"Supraveghere Video",status:"Execuție",valoare:35000,loc:"Ghimbav"},
    {id:"CSSI-2026-007",client:"Școala Nr. 5",serviciu:"Detecție Incendiu",status:"Recepție",valoare:52000,loc:"Brașov"},
    {id:"CSSI-2026-008",client:"Pensiune Bran",serviciu:"Alarmă Antiefracție",status:"Facturat",valoare:6200,loc:"Bran"},
    {id:"CSSI-2026-009",client:"Primăria Săcele",serviciu:"Detecție Incendiu",status:"Mentenanță",valoare:89000,loc:"Săcele"},
    {id:"CSSI-2026-010",client:"Mall Brașov Center",serviciu:"Proiect Complex",status:"Lead",valoare:120000,loc:"Brașov"},
    {id:"CSSI-2026-011",client:"Clinica MedLife",serviciu:"Supraveghere Video",status:"Ofertă",valoare:15000,loc:"Brașov"},
    {id:"CSSI-2026-012",client:"Fabrica Autoliv",serviciu:"Instalații Electrice",status:"Execuție",valoare:95000,loc:"Brașov"},
    {id:"CSSI-2026-013",client:"Rezidențial Avantgarden",serviciu:"Automatizări Porți",status:"Contract",valoare:18000,loc:"Brașov"},
    {id:"CSSI-2026-014",client:"ANAF Brașov",serviciu:"Detecție Incendiu",status:"Mentenanță",valoare:42000,loc:"Brașov"}
];

var currentView="board";
var currentFilter="all";

// ═══════ INIT ═══════
renderSummary();
renderKanban();
renderTable();

// ═══════ VIEW SWITCHING ═══════
function switchView(v,btn){
    currentView=v;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    btn.classList.add('active');
    document.getElementById('boardView').classList.toggle('hidden',v!=='board');
    document.getElementById('tableView').classList.toggle('hidden',v!=='table');
}

// ═══════ FILTERS ═══════
function setFilter(f,btn){
    currentFilter=f;
    document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active')});
    btn.classList.add('active');
    applyFilters();
}

function applyFilters(){
    renderKanban();renderTable();renderSummary();
}

function getFiltered(){
    var q=document.getElementById('searchInput').value.toLowerCase();
    return PROJECTS.filter(function(p){
        var matchStatus=currentFilter==='all'||p.status===currentFilter;
        var matchSearch=!q||p.client.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)||p.serviciu.toLowerCase().includes(q)||p.loc.toLowerCase().includes(q);
        return matchStatus&&matchSearch;
    });
}

// ═══════ SUMMARY ═══════
function renderSummary(){
    var f=getFiltered();
    var total=f.length;
    var val=f.reduce(function(s,p){return s+p.valoare},0);
    var active=f.filter(function(p){return["Lead","Ofertă","Contract","Proiectare","Execuție","Recepție"].includes(p.status)}).length;
    document.getElementById('summary').innerHTML=
        '<div class="summary-item"><div><div class="summary-val">'+total+'</div><div class="summary-label">Total proiecte</div></div></div>'+
        '<div class="summary-item"><div><div class="summary-val">'+active+'</div><div class="summary-label">Active</div></div></div>'+
        '<div class="summary-item"><div><div class="summary-val">'+val.toLocaleString('ro-RO')+'</div><div class="summary-label">Valoare totală (RON)</div></div></div>';
}

// ═══════ KANBAN ═══════
function renderKanban(){
    var b=document.getElementById('kanbanBoard');b.innerHTML='';
    var filtered=getFiltered();

    STATUSES.forEach(function(st){
        var prj=filtered.filter(function(p){return STATUS_MAP[p.status]===st.id});
        var col=document.createElement('div');col.className='kanban-col';
        col.innerHTML='<div class="kcol-head '+st.cls+'"><span class="kcol-name">'+(STATUS_ICONS[st.name]||'')+' '+st.name+'</span><span class="kcol-count">'+prj.length+'</span></div>';
        var body=document.createElement('div');body.className='kcol-body';
        if(!prj.length){body.innerHTML='<div class="kanban-empty">—</div>'}
        else{prj.forEach(function(p){
            var t=SERVICE_TAGS[p.serviciu]||{cls:"install",s:p.serviciu};
            var c=document.createElement('div');c.className='kcard';
            c.innerHTML='<div class="kcard-id">'+p.id+'</div><div class="kcard-title">'+p.client+'</div><div class="kcard-meta"><span class="kcard-tag '+t.cls+'">'+t.s+'</span><span>📍 '+p.loc+'</span></div><div class="kcard-val">'+p.valoare.toLocaleString('ro-RO')+' RON</div>';
            body.appendChild(c);
        })}
        col.appendChild(body);b.appendChild(col);
    });
}

// ═══════ TABLE ═══════
function renderTable(){
    var tb=document.getElementById('tableBody');tb.innerHTML='';
    var filtered=getFiltered();

    filtered.forEach(function(p,idx){
        var t=SERVICE_TAGS[p.serviciu]||{cls:"install",s:p.serviciu};
        var opts=Object.keys(STATUS_MAP).map(function(s){return '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+STATUS_ICONS[s]+' '+s+'</option>'}).join('');
        var tr=document.createElement('tr');
        tr.innerHTML=
            '<td><strong>'+p.id+'</strong></td>'+
            '<td>'+p.client+'</td>'+
            '<td><span class="kcard-tag '+t.cls+'">'+t.s+'</span></td>'+
            '<td class="loc">📍 '+p.loc+'</td>'+
            '<td class="val">'+p.valoare.toLocaleString('ro-RO')+' RON</td>'+
            '<td><select class="status-select" onchange="changeStatus(\''+p.id+'\',this.value)">'+opts+'</select></td>';
        tb.appendChild(tr);
    });
}

// ═══════ STATUS CHANGE (manual — key feature!) ═══════
function changeStatus(projectId,newStatus){
    var p=PROJECTS.find(function(x){return x.id===projectId});
    if(p){
        p.status=newStatus;
        renderKanban();renderSummary();
        // TODO: Sync to Google Sheets via Apps Script
        if(API_URL) fetch(API_URL+'?action=updateStatus&id='+projectId+'&status='+encodeURIComponent(newStatus));
    }
}

// ═══════ ADD PROJECT ═══════
function openModal(){document.getElementById('addProjectModal').classList.add('active')}
function closeModal(){document.getElementById('addProjectModal').classList.remove('active')}

function addProject(e){
    e.preventDefault();var f=document.getElementById('addProjectForm');var d=new FormData(f);
    var mx=0;PROJECTS.forEach(function(p){var n=parseInt(p.id.split('-')[2]);if(n>mx)mx=n});
    PROJECTS.push({id:"CSSI-2026-"+String(mx+1).padStart(3,'0'),client:d.get('client'),serviciu:d.get('serviciu'),status:d.get('status'),valoare:parseInt(d.get('valoare'))||0,loc:d.get('locatie')||'Brașov'});
    renderKanban();renderTable();renderSummary();closeModal();f.reset();
}
