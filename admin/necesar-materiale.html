<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Necesar Materiale — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--yellow:#eab308;--teal:#14b8a6;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
.page-header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;}
.page-actions{display:flex;gap:8px;align-items:center;}
.page-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;}
.page-btn.primary{background:var(--red);color:#fff;}.page-btn.primary:hover{background:var(--red-d);transform:translateY(-1px);}
.page-btn.secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}.page-btn.secondary:hover{background:rgba(255,255,255,0.2);}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.sync-ok{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);}.sync-off{background:var(--gray-l);}.sync-loading{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.container{max-width:1400px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.s-item{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:130px;display:flex;align-items:center;gap:12px;transition:all 0.2s;cursor:pointer;}
.s-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.s-item.active-filter{border:2px solid var(--blue);}
.s-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.s-val{font-size:22px;font-weight:900;}.s-label{font-size:11px;color:var(--gray);margin-top:1px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;min-width:200px;background:#fff;flex:1;max-width:300px;}.filter-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.filter-select{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;font-family:inherit;outline:none;cursor:pointer;}
.view-toggle{display:flex;background:#fff;border-radius:10px;padding:3px;box-shadow:var(--shadow);border:1px solid var(--gray-b);margin-left:auto;}
.view-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;background:none;color:var(--gray);cursor:pointer;transition:all 0.2s;}.view-btn.active{background:var(--dark);color:#fff;}
.filter-count{font-size:12px;color:var(--gray);font-weight:500;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:16px;}
.ncard{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-left:4px solid var(--blue);transition:all 0.2s;}
.ncard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.ncard.comandat{border-left-color:var(--orange);}.ncard.livrat{border-left-color:var(--green);}.ncard.anulat{border-left-color:var(--gray);opacity:0.6;}
.ncard-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;}
.ncard-mat{font-size:14px;font-weight:800;flex:1;}
.ncard-badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.badge-solicitat{background:#eff6ff;color:var(--blue);}.badge-comandat{background:#fff7ed;color:var(--orange);}.badge-livrat{background:#f0fdf4;color:var(--green);}.badge-anulat{background:var(--gray-bg);color:var(--gray);}
.ncard-pid{font-size:11px;font-weight:700;color:var(--blue);background:#eff6ff;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.ncard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.ncard-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;}
.urg-scazuta{background:var(--gray-bg);color:var(--gray);}.urg-normal{background:#eff6ff;color:var(--blue);}.urg-urgenta{background:#fff7ed;color:var(--orange);}.urg-critica{background:#fef2f2;color:var(--red);}
.ncard-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--gray);margin-bottom:8px;}
.ncard-info dt{font-weight:700;color:var(--dark);}
.ncard-actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--gray-bg);}
.ncard-actions select{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--gray-b);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;background:#fff;outline:none;}
.btn-sm{padding:6px 12px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;}

.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--dark);color:#fff;padding:12px 14px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--gray-bg);}
tr:hover td{background:rgba(59,130,246,0.03);}

.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:14px 20px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:380px;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--blue);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:1;}
.modal-title{font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;display:flex;align-items:center;justify-content:center;}.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:24px;}
.form-group{margin-bottom:16px;}.form-label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px;}.form-label .req{color:var(--red);}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 16px;border:2px solid var(--gray-b);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.form-textarea{min-height:60px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s;}.form-submit:hover{transform:translateY(-1px);}
.form-submit:disabled{background:var(--gray-l);cursor:not-allowed;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}.bn-item.active{color:var(--red);background:#fef2f2;}.bn-item .bn-icon{font-size:20px;}
.empty-msg{text-align:center;padding:40px;color:var(--gray-l);font-size:14px;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:400;display:none;}.loading-bar.active{display:block;}.loading-bar::after{content:'';display:block;width:30%;height:100%;background:var(--red);border-radius:2px;animation:loadSlide 1.2s infinite ease-in-out;}
@keyframes loadSlide{0%{margin-left:-30%}100%{margin-left:100%}}
</style>
</head>
<body>
<div class="loading-bar" id="loadBar"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">🛒 Necesar Materiale</div>
            <div class="page-subtitle" id="syncStatus"><span class="sync-indicator sync-off"></span>Date locale (demo)</div>
        </div>
        <div class="page-actions">
            <a href="materiale.html" class="page-btn secondary">📦 Stocuri</a>
            <button class="page-btn secondary" onclick="refreshData()">🔄 Sync</button>
            <button class="page-btn primary" onclick="openAddModal()">+ Solicitare Nouă</button>
        </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="filters">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută material, proiect..." oninput="render()">
        <select class="filter-select" id="filterStatus" onchange="render()"><option value="">Toate statusurile</option><option>Solicitat</option><option>Aprobat</option><option>Comandat</option><option>Livrat</option><option>Anulat</option></select>
        <select class="filter-select" id="filterUrgenta" onchange="render()"><option value="">Toate urgențele</option><option>Critică</option><option>Urgentă</option><option>Normal</option><option>Scăzută</option></select>
        <select class="filter-select" id="filterProject" onchange="render()"><option value="">Toate proiectele</option></select>
        <div class="view-toggle">
            <button class="view-btn active" id="vCards" onclick="setView('cards')">☷ Carduri</button>
            <button class="view-btn" id="vTable" onclick="setView('table')">☰ Tabel</button>
        </div>
        <div class="filter-count" id="filterCount"></div>
    </div>

    <div id="cardsView" class="cards"></div>
    <div id="tableView" class="table-wrap" style="display:none"></div>
    <div class="footer">Portal CSSI 3.0 · Necesar Materiale v3.0</div>
</div>

<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="materiale.html" class="bn-item"><span class="bn-icon">📦</span>Stocuri</a>
    <a href="necesar-materiale.html" class="bn-item active"><span class="bn-icon">🛒</span>Necesar</a>
    <a href="executie.html" class="bn-item"><span class="bn-icon">🔧</span>Execuție</a>
</div>

<!-- ADD MODAL -->
<div id="addModal" class="modal-overlay" onclick="if(event.target===this)closeAddModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title" id="modalTitle">🛒 Solicitare Material</div><button class="modal-close" onclick="closeAddModal()">✕</button></div>
    <div class="modal-body">
        <form id="addForm" onsubmit="saveRequest(event)">
            <input type="hidden" name="editId" id="editId" value="">
            <div class="form-group"><label class="form-label">Proiect <span class="req">*</span></label><select class="form-select" name="proiectId" id="fProiect" required></select></div>
            <div class="form-group"><label class="form-label">Material solicitat <span class="req">*</span></label><textarea class="form-textarea" name="material" id="fMaterial" required placeholder="ex: 24x Detector fum Bosch FCP-O320&#10;2x Centrală FPA-5000&#10;500m cablu FTP Cat6"></textarea></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Cantitate</label><input type="number" class="form-input" name="cantitate" id="fCant" min="1" placeholder="1"></div>
                <div class="form-group"><label class="form-label">Cost estimat (RON)</label><input type="number" class="form-input" name="cost" id="fCost" min="0" step="0.01" placeholder="0"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Urgență</label>
                    <select class="form-select" name="urgenta" id="fUrg"><option>Scăzută</option><option selected>Normal</option><option>Urgentă</option><option>Critică</option></select>
                </div>
                <div class="form-group"><label class="form-label">Solicitant</label>
                    <select class="form-select" name="solicitant" id="fSol"><option>Echipa Mihai</option><option>Echipa Alex</option><option>Echipa Radu</option></select>
                </div>
            </div>
            <div class="form-group"><label class="form-label">Furnizor preferat</label><input type="text" class="form-input" name="furnizor" id="fFurnizor" placeholder="ex: Atu Tech, Elko..."></div>
            <div class="form-group"><label class="form-label">Observații</label><textarea class="form-textarea" name="note" id="fNote" placeholder="Specificații, termen, compatibilitate..." style="min-height:50px"></textarea></div>
            <button type="submit" class="form-submit" id="submitBtn">🛒 Trimite Solicitarea</button>
        </form>
    </div>
</div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="modal-overlay" onclick="if(event.target===this)closeDetailModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title" id="detailTitle">📋 Detalii Solicitare</div><button class="modal-close" onclick="closeDetailModal()">✕</button></div>
    <div class="modal-body" id="detailBody"></div>
</div>
</div>

<script>
var API_URL = '';
var role = sessionStorage.getItem('cssi-role');
if (!role || !['admin','org','tech'].includes(role)) { window.location.href = '../admin.html'; }
var canEdit = ['admin','org','tech'].includes(role);
var canApprove = ['admin','org'].includes(role);

var PROJECTS = [
    {id:'CSSI-2026-001', client:'Hotel Cheile Râșnoavei'},{id:'CSSI-2026-004', client:'Birouri IT Hub'},
    {id:'CSSI-2026-005', client:'Restaurant Central'},{id:'CSSI-2026-006', client:'Depozit Ghimbav'},
    {id:'CSSI-2026-007', client:'Școala Nr. 5'},{id:'CSSI-2026-012', client:'Fabrica Autoliv'},
    {id:'CSSI-2026-013', client:'Rezidențial Avantgarden'},{id:'CSSI-2026-014', client:'ANAF Brașov'}
];
var STATUS_LIST = ['Solicitat','Aprobat','Comandat','Livrat','Anulat'];
var BADGE_MAP = {'Solicitat':'badge-solicitat','Aprobat':'badge-solicitat','Comandat':'badge-comandat','Livrat':'badge-livrat','Anulat':'badge-anulat'};
var URG_MAP = {'Scăzută':'urg-scazuta','Normal':'urg-normal','Urgentă':'urg-urgenta','Critică':'urg-critica'};
var URG_ORDER = {'Critică':0,'Urgentă':1,'Normal':2,'Scăzută':3};
var REQUESTS = [];
var currentView = 'cards';
var isLive = false;
var kpiFilter = '';

var DEMO = [
    {id:1,row:1,data:'2026-03-04',pid:'CSSI-2026-001',material:'Detector fum adresabil Bosch FCP-O320',cant:24,urg:'Urgentă',cost:4800,sol:'Echipa Mihai',status:'Solicitat',furnizor:'Atu Tech',note:'Necesar urgent pt. etaj 3+4'},
    {id:2,row:2,data:'2026-03-04',pid:'CSSI-2026-006',material:'Cameră IP Hikvision DS-2CD2143G2-I 4MP',cant:4,urg:'Normal',cost:2080,sol:'Echipa Alex',status:'Comandat',furnizor:'Atu Tech',note:'Livrare estimată 7 zile'},
    {id:3,row:3,data:'2026-03-03',pid:'CSSI-2026-012',material:'Cablu FTP Cat6 Legrand 305m',cant:2,urg:'Normal',cost:620,sol:'Echipa Radu',status:'Livrat',furnizor:'Elko',note:'Livrat pe 04.03'},
    {id:4,row:4,data:'2026-03-03',pid:'CSSI-2026-001',material:'Centrală incendiu Bosch FPA-5000',cant:1,urg:'Critică',cost:8500,sol:'Echipa Mihai',status:'Aprobat',furnizor:'Bosch Direct',note:'Termen livrare 10 zile lucr.'},
    {id:5,row:5,data:'2026-03-02',pid:'CSSI-2026-013',material:'Motor poartă culisantă BFT Deimos BT A600',cant:2,urg:'Normal',cost:3700,sol:'Echipa Mihai',status:'Livrat',furnizor:'BFT Romania',note:''},
    {id:6,row:6,data:'2026-03-02',pid:'CSSI-2026-006',material:'NVR Hikvision 8 canale',cant:1,urg:'Normal',cost:1750,sol:'Echipa Alex',status:'Livrat',furnizor:'Atu Tech',note:''},
    {id:7,row:7,data:'2026-03-01',pid:'CSSI-2026-004',material:'Tablou electric 36 module Hager',cant:2,urg:'Scăzută',cost:370,sol:'Echipa Radu',status:'Solicitat',furnizor:'Elko',note:'Poate aștepta'},
    {id:8,row:8,data:'2026-03-01',pid:'CSSI-2026-012',material:'Pat cabluri 200x60 3m zincat',cant:20,urg:'Normal',cost:840,sol:'Echipa Radu',status:'Comandat',furnizor:'Elko',note:'Livrare pe 06.03'},
    {id:9,row:9,data:'2026-03-04',pid:'CSSI-2026-014',material:'Cablu incendiu 2x1.5 E30 100m',cant:5,urg:'Urgentă',cost:2400,sol:'Echipa Mihai',status:'Solicitat',furnizor:'Elko',note:'Proiect ANAF, termen scurt'},
    {id:10,row:10,data:'2026-02-28',pid:'CSSI-2026-007',material:'Sirenă interioară convențională',cant:6,urg:'Scăzută',cost:270,sol:'Echipa Alex',status:'Anulat',furnizor:'Atu Tech',note:'Anulat — existau în stoc'}
];

function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmt(n){return Number(n||0).toLocaleString('ro-RO');}
function getPN(pid){var p=PROJECTS.find(function(x){return x.id===pid});return p?p.client:pid;}
function showLoading(s){document.getElementById('loadBar').classList.toggle('active',s);}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100px)';t.style.transition='all 0.3s'},3000);setTimeout(function(){t.remove()},3500);}

function apiGet(a){if(!API_URL)return Promise.reject('No API');showLoading(true);return fetch(API_URL+'?action='+a).then(function(r){return r.json()}).finally(function(){showLoading(false)});}
function apiPost(d){if(!API_URL)return Promise.reject('No API');showLoading(true);return fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).finally(function(){showLoading(false)});}

function refreshData(){
    if(!API_URL){toast('⚠️ API nesetat. Date demo.','info');REQUESTS=JSON.parse(JSON.stringify(DEMO));isLive=false;updateSync();render();return;}
    updateSync('loading');
    Promise.all([apiGet('getMateriale'),apiGet('getProjects')]).then(function(res){
        if(Array.isArray(res[0])){REQUESTS=res[0].map(function(r,i){return {id:i+1,row:r.row||i+1,data:r.data||'',pid:r.proiectId||'',material:r.material||'',cant:Number(r.cantitate)||1,urg:r.urgenta||'Normal',cost:Number(r.cost)||0,sol:r.solicitant||'',status:r.status||'Solicitat',furnizor:r.furnizor||'',note:r.note||''};});}
        if(Array.isArray(res[1])){PROJECTS=res[1].map(function(p){return {id:p.id,client:p.client}});populateDropdowns();}
        isLive=true;updateSync();render();toast('✅ Sincronizat','success');
    }).catch(function(){isLive=false;updateSync();toast('❌ Sync eșuat','error');});
}
function updateSync(s){var el=document.getElementById('syncStatus');if(s==='loading')el.innerHTML='<span class="sync-indicator sync-loading"></span>Se sincronizează...';else if(isLive)el.innerHTML='<span class="sync-indicator sync-ok"></span>Conectat la Google Sheets';else el.innerHTML='<span class="sync-indicator sync-off"></span>Date locale (demo)';}

function getFiltered(){
    var q=document.getElementById('searchInput').value.toLowerCase();
    var fs=document.getElementById('filterStatus').value;
    var fu=document.getElementById('filterUrgenta').value;
    var fp=document.getElementById('filterProject').value;
    var filtered=REQUESTS.filter(function(r){
        if(fs&&r.status!==fs)return false;
        if(fu&&r.urg!==fu)return false;
        if(fp&&r.pid!==fp)return false;
        if(kpiFilter&&r.status!==kpiFilter)return false;
        if(q&&!(r.material.toLowerCase().includes(q)||r.pid.toLowerCase().includes(q)||getPN(r.pid).toLowerCase().includes(q)||r.sol.toLowerCase().includes(q)))return false;
        return true;
    });
    filtered.sort(function(a,b){
        var so={'Solicitat':0,'Aprobat':1,'Comandat':2,'Livrat':3,'Anulat':4};
        if(so[a.status]!==so[b.status])return so[a.status]-so[b.status];
        if(URG_ORDER[a.urg]!==URG_ORDER[b.urg])return URG_ORDER[a.urg]-URG_ORDER[b.urg];
        return b.data.localeCompare(a.data);
    });
    document.getElementById('filterCount').textContent=filtered.length+' solicitări';
    return filtered;
}
function toggleKpiFilter(f){kpiFilter=kpiFilter===f?'':f;render();}

function render(){renderSummary();var f=getFiltered();if(currentView==='cards'){renderCards(f);document.getElementById('cardsView').style.display='';document.getElementById('tableView').style.display='none';}else{renderTable(f);document.getElementById('cardsView').style.display='none';document.getElementById('tableView').style.display='';}}

function renderSummary(){
    var sol=REQUESTS.filter(function(r){return r.status==='Solicitat'}).length;
    var apr=REQUESTS.filter(function(r){return r.status==='Aprobat'}).length;
    var cmd=REQUESTS.filter(function(r){return r.status==='Comandat'}).length;
    var liv=REQUESTS.filter(function(r){return r.status==='Livrat'}).length;
    var costPending=REQUESTS.filter(function(r){return r.status!=='Livrat'&&r.status!=='Anulat'}).reduce(function(s,r){return s+r.cost},0);
    document.getElementById('summary').innerHTML=
        '<div class="s-item'+(kpiFilter==='Solicitat'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Solicitat\')"><div class="s-icon" style="background:#eff6ff">📝</div><div><div class="s-val" style="color:var(--blue)">'+sol+'</div><div class="s-label">De aprobat</div></div></div>'+
        '<div class="s-item'+(kpiFilter==='Aprobat'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Aprobat\')"><div class="s-icon" style="background:#f5f3ff">✅</div><div><div class="s-val" style="color:var(--purple)">'+(apr)+'</div><div class="s-label">Aprobate</div></div></div>'+
        '<div class="s-item'+(kpiFilter==='Comandat'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Comandat\')"><div class="s-icon" style="background:#fff7ed">📦</div><div><div class="s-val" style="color:var(--orange)">'+cmd+'</div><div class="s-label">Comandate</div></div></div>'+
        '<div class="s-item'+(kpiFilter==='Livrat'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Livrat\')"><div class="s-icon" style="background:#f0fdf4">✅</div><div><div class="s-val" style="color:var(--green)">'+liv+'</div><div class="s-label">Livrate</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#fef2f2">💰</div><div><div class="s-val" style="color:var(--red)">'+fmt(costPending)+'</div><div class="s-label">Cost în așteptare</div></div></div>';
}

function renderCards(filtered){
    if(!filtered.length){document.getElementById('cardsView').innerHTML='<div class="empty-msg">Nicio solicitare găsită</div>';return;}
    var html='';
    filtered.forEach(function(r){
        var cardCls=r.status==='Comandat'?'comandat':r.status==='Livrat'?'livrat':r.status==='Anulat'?'anulat':'';
        var statusOpts=STATUS_LIST.map(function(s){return '<option'+(r.status===s?' selected':'')+'>'+s+'</option>'}).join('');
        html+='<div class="ncard '+cardCls+'">';
        html+='<div class="ncard-top"><div class="ncard-mat">'+esc(r.material)+'</div><span class="ncard-badge '+(BADGE_MAP[r.status]||'')+'">'+r.status+'</span></div>';
        html+='<div class="ncard-pid">🔗 '+r.pid+' — '+esc(getPN(r.pid))+'</div>';
        html+='<div class="ncard-tags">';
        html+='<span class="ncard-tag '+(URG_MAP[r.urg]||'urg-normal')+'">'+r.urg+'</span>';
        html+='<span class="ncard-tag" style="background:var(--gray-bg);color:var(--gray)">×'+r.cant+'</span>';
        if(r.cost) html+='<span class="ncard-tag" style="background:#fef2f2;color:var(--red)">💰 '+fmt(r.cost)+' RON</span>';
        html+='<span class="ncard-tag" style="background:var(--gray-bg);color:var(--gray)">👷 '+r.sol+'</span>';
        html+='</div>';
        html+='<div class="ncard-info">';
        html+='<div><dt>📅 Data</dt>'+r.data+'</div>';
        if(r.furnizor) html+='<div><dt>🏭 Furnizor</dt>'+esc(r.furnizor)+'</div>';
        html+='</div>';
        if(r.note) html+='<div style="font-size:12px;color:var(--gray);font-style:italic;padding:6px 10px;background:var(--gray-bg);border-radius:8px;margin-bottom:8px">📝 '+esc(r.note)+'</div>';
        if(canEdit){
            html+='<div class="ncard-actions">';
            html+='<select onchange="changeStatus('+r.id+',this.value)">'+statusOpts+'</select>';
            if(canApprove&&r.status==='Solicitat') html+='<button class="btn-sm" style="background:#f0fdf4;color:var(--green)" onclick="changeStatus('+r.id+',\'Aprobat\')">✅ Aprobă</button>';
            html+='<button class="btn-sm" style="background:#eff6ff;color:var(--blue)" onclick="openDetailModal('+r.id+')">ℹ️</button>';
            html+='</div>';
        }
        html+='</div>';
    });
    document.getElementById('cardsView').innerHTML=html;
}

function renderTable(filtered){
    if(!filtered.length){document.getElementById('tableView').innerHTML='<div class="empty-msg">Nicio solicitare găsită</div>';return;}
    var html='<table><thead><tr><th>Data</th><th>Proiect</th><th>Material</th><th>Cant.</th><th>Urgență</th><th>Cost</th><th>Solicitant</th><th>Status</th></tr></thead><tbody>';
    filtered.forEach(function(r){
        var statusOpts=STATUS_LIST.map(function(s){return '<option'+(r.status===s?' selected':'')+'>'+s+'</option>'}).join('');
        html+='<tr>';
        html+='<td>'+r.data+'</td>';
        html+='<td><span style="color:var(--blue);font-weight:700">'+r.pid+'</span><br><span style="font-size:11px;color:var(--gray)">'+esc(getPN(r.pid))+'</span></td>';
        html+='<td style="white-space:normal;max-width:250px;font-weight:700">'+esc(r.material)+'</td>';
        html+='<td>'+r.cant+'</td>';
        html+='<td><span class="ncard-tag '+(URG_MAP[r.urg]||'')+'">'+r.urg+'</span></td>';
        html+='<td style="font-weight:700">'+fmt(r.cost)+' RON</td>';
        html+='<td>'+r.sol+'</td>';
        html+='<td>'+(canEdit?'<select style="padding:6px 10px;border-radius:8px;border:1px solid var(--gray-b);font-size:12px;font-weight:600;font-family:inherit" onchange="changeStatus('+r.id+',this.value)">'+statusOpts+'</select>':'<span class="ncard-badge '+(BADGE_MAP[r.status]||'')+'">'+r.status+'</span>')+'</td>';
        html+='</tr>';
    });
    html+='</tbody></table>';
    document.getElementById('tableView').innerHTML=html;
}

function setView(v){currentView=v;document.getElementById('vCards').classList.toggle('active',v==='cards');document.getElementById('vTable').classList.toggle('active',v==='table');render();}

function changeStatus(id,val){
    var r=REQUESTS.find(function(x){return x.id===id});if(!r)return;
    r.status=val;
    if(API_URL) apiPost({action:'updateMaterialeStatus',row:r.row,status:val}).catch(function(){});
    render();toast('✅ Status: '+val,'success');
}

function openDetailModal(id){
    var r=REQUESTS.find(function(x){return x.id===id});if(!r)return;
    document.getElementById('detailTitle').textContent='🛒 Solicitare #'+r.id;
    var html='<div style="display:grid;gap:14px">';
    html+='<div style="text-align:center;padding:12px 0"><span class="ncard-badge '+(BADGE_MAP[r.status]||'')+'" style="font-size:14px;padding:6px 16px">'+r.status+'</span></div>';
    html+=infoRow('📦 Material','<strong>'+esc(r.material)+'</strong>');
    html+=infoRow('🔗 Proiect','<span style="color:var(--blue);font-weight:700">'+r.pid+'</span> — '+esc(getPN(r.pid)));
    html+=infoRow('📊 Cantitate','<strong>'+r.cant+'</strong>');
    html+=infoRow('💰 Cost estimat','<strong>'+fmt(r.cost)+' RON</strong>');
    html+=infoRow('⚡ Urgență','<span class="ncard-tag '+(URG_MAP[r.urg]||'')+'">'+r.urg+'</span>');
    html+=infoRow('👷 Solicitant',r.sol);
    html+=infoRow('📅 Data',r.data);
    if(r.furnizor) html+=infoRow('🏭 Furnizor',esc(r.furnizor));
    if(r.note) html+='<div style="background:var(--gray-bg);padding:10px 14px;border-radius:8px;font-size:13px;color:var(--gray);font-style:italic">📝 '+esc(r.note)+'</div>';
    html+='</div>';
    document.getElementById('detailBody').innerHTML=html;
    document.getElementById('detailModal').classList.add('active');
}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('active');}
function infoRow(l,v){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--gray-bg)"><span style="font-size:13px;color:var(--gray)">'+l+'</span><span style="font-size:14px;font-weight:600">'+v+'</span></div>';}

function openAddModal(){
    document.getElementById('editId').value='';
    document.getElementById('addForm').reset();
    document.getElementById('addModal').classList.add('active');
}
function closeAddModal(){document.getElementById('addModal').classList.remove('active');}

function saveRequest(e){
    e.preventDefault();var fd=new FormData(document.getElementById('addForm'));
    var maxId=0;REQUESTS.forEach(function(x){if(x.id>maxId)maxId=x.id});
    var newR={id:maxId+1,row:maxId+1,data:new Date().toISOString().split('T')[0],pid:fd.get('proiectId'),material:fd.get('material'),cant:parseInt(fd.get('cantitate'))||1,urg:fd.get('urgenta'),cost:parseFloat(fd.get('cost'))||0,sol:fd.get('solicitant'),status:'Solicitat',furnizor:fd.get('furnizor')||'',note:fd.get('note')||''};

    if(API_URL){
        apiPost({action:'addMaterial',request:newR}).then(function(res){newR.row=res.row||newR.row;REQUESTS.unshift(newR);render();toast('✅ Solicitare trimisă și sincronizată','success');}).catch(function(){REQUESTS.unshift(newR);render();toast('⚠️ Salvat local','error');});
    } else {REQUESTS.unshift(newR);toast('✅ Solicitare trimisă (local)','success');}
    render();closeAddModal();document.getElementById('addForm').reset();
}

function populateDropdowns(){
    var opts='<option value="">— Alege proiect —</option>';
    PROJECTS.forEach(function(p){opts+='<option value="'+p.id+'">'+p.id+' — '+esc(p.client)+'</option>'});
    document.getElementById('fProiect').innerHTML=opts;
    var fOpts='<option value="">Toate proiectele</option>';
    PROJECTS.forEach(function(p){fOpts+='<option value="'+p.id+'">'+p.id+'</option>'});
    document.getElementById('filterProject').innerHTML=fOpts;
}

populateDropdowns();
REQUESTS=JSON.parse(JSON.stringify(DEMO));
render();
if(API_URL) refreshData();
</script>
</body>
</html>
