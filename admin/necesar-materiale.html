<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Necesar Materiale — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal CSSI">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--yellow:#eab308;--teal:#14b8a6;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
.page-header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;}
.page-actions{display:flex;gap:8px;align-items:center;}
.page-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;}
.page-btn.primary{background:var(--red);color:#fff;}.page-btn.primary:hover{background:var(--red-d);transform:translateY(-1px);}
.page-btn.secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}.page-btn.secondary:hover{background:rgba(255,255,255,0.2);}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.sync-ok{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);}.sync-off{background:var(--gray-l);}.sync-loading{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.container{max-width:1400px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.s-item{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:130px;display:flex;align-items:center;gap:12px;transition:all 0.2s;cursor:pointer;}
.s-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.s-item.active-filter{border:2px solid var(--blue);}
.s-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.s-val{font-size:22px;font-weight:900;}.s-label{font-size:11px;color:var(--gray);margin-top:1px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;min-width:200px;background:#fff;flex:1;max-width:300px;}.filter-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.filter-select{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;font-family:inherit;outline:none;cursor:pointer;}
.view-toggle{display:flex;background:#fff;border-radius:10px;padding:3px;box-shadow:var(--shadow);border:1px solid var(--gray-b);margin-left:auto;}
.view-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;background:none;color:var(--gray);cursor:pointer;transition:all 0.2s;}.view-btn.active{background:var(--dark);color:#fff;}
.filter-count{font-size:12px;color:var(--gray);font-weight:500;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:16px;}
.ncard{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-left:4px solid var(--blue);transition:all 0.2s;}
.ncard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.ncard.comandat{border-left-color:var(--orange);}.ncard.livrat{border-left-color:var(--green);}.ncard.anulat{border-left-color:var(--gray);opacity:0.6;}
.ncard-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;}
.ncard-mat{font-size:14px;font-weight:800;flex:1;}
.ncard-badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.badge-solicitat{background:#eff6ff;color:var(--blue);}.badge-comandat{background:#fff7ed;color:var(--orange);}.badge-livrat{background:#f0fdf4;color:var(--green);}.badge-anulat{background:var(--gray-bg);color:var(--gray);}
.ncard-pid{font-size:11px;font-weight:700;color:var(--blue);background:#eff6ff;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.ncard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.ncard-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;}
.urg-scazuta{background:var(--gray-bg);color:var(--gray);}.urg-normal{background:#eff6ff;color:var(--blue);}.urg-urgenta{background:#fff7ed;color:var(--orange);}.urg-critica{background:#fef2f2;color:var(--red);}
.ncard-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--gray);margin-bottom:8px;}
.ncard-info dt{font-weight:700;color:var(--dark);}
.ncard-actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--gray-bg);}
.ncard-actions select{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--gray-b);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;background:#fff;outline:none;}
.btn-sm{padding:6px 12px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;}

.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--dark);color:#fff;padding:12px 14px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--gray-bg);}
tr:hover td{background:rgba(59,130,246,0.03);}

.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:14px 20px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:380px;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--blue);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:1;}
.modal-title{font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;display:flex;align-items:center;justify-content:center;}.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:24px;}
.form-group{margin-bottom:16px;}.form-label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px;}.form-label .req{color:var(--red);}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 16px;border:2px solid var(--gray-b);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.form-textarea{min-height:60px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s;}.form-submit:hover{transform:translateY(-1px);}
.form-submit:disabled{background:var(--gray-l);cursor:not-allowed;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}.bn-item.active{color:var(--red);background:#fef2f2;}.bn-item .bn-icon{font-size:20px;}
.empty-msg{text-align:center;padding:40px;color:var(--gray-l);font-size:14px;}

/* ═══ NECESAR — ierarhic Client → Ofertă → Materiale ═══ */
.client-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:1px solid var(--gray-b);}
.client-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;background:linear-gradient(135deg,#fff,#f8fafc);transition:background 0.15s;border:none;width:100%;text-align:left;font-family:inherit;}
.client-head:hover{background:var(--gray-bg);}
.client-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#eff6ff,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.client-info{flex:1;min-width:0;}
.client-name{font-size:15px;font-weight:800;color:var(--dark);letter-spacing:-0.2px;}
.client-meta{font-size:11px;color:var(--gray);margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;}
.client-meta .pill{background:var(--gray-bg);padding:2px 8px;border-radius:99px;font-weight:600;}
.client-chevron{font-size:14px;color:var(--gray-l);transition:transform 0.25s;flex-shrink:0;}
.client-card.open .client-chevron{transform:rotate(180deg);color:var(--blue);}
.client-body{display:none;padding:0 16px 16px;border-top:1px solid var(--gray-b);}
.client-card.open .client-body{display:block;animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

.oferta-card{background:var(--gray-bg);border-radius:var(--radius-sm);margin-top:12px;overflow:hidden;border:1px solid var(--gray-b);}
.oferta-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;background:#fff;transition:background 0.15s;border:none;width:100%;text-align:left;font-family:inherit;}
.oferta-head:hover{background:var(--gray-bg);}
.oferta-codes{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.oferta-cod{font-size:13px;font-weight:800;color:var(--purple);font-family:'Courier New',monospace;}
.oferta-proj{font-size:11px;color:var(--gray);}
.oferta-proj strong{color:var(--blue);font-weight:700;}
.oferta-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:0.3px;flex-shrink:0;}
.oferta-status.proiectare{background:#f0fdfa;color:var(--teal);}
.oferta-status.executie{background:#fff7ed;color:var(--orange);}
.oferta-total{font-size:13px;font-weight:800;color:var(--dark);flex-shrink:0;}
.oferta-actions{display:flex;gap:6px;flex-shrink:0;}
.oferta-actions .btn-copy-all{padding:6px 10px;border-radius:8px;border:1px solid var(--blue);background:#eff6ff;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit;}
.oferta-actions .btn-copy-all:hover{background:var(--blue);color:#fff;}
.oferta-chevron{font-size:13px;color:var(--gray-l);transition:transform 0.25s;flex-shrink:0;}
.oferta-card.open .oferta-chevron{transform:rotate(180deg);color:var(--blue);}
.oferta-body{display:none;padding:8px;background:var(--gray-bg);}
.oferta-card.open .oferta-body{display:block;}
.oferta-obiectiv{padding:8px 14px;background:#fff;border-bottom:1px solid var(--gray-b);font-size:12px;color:var(--gray);}
.oferta-obiectiv strong{color:var(--dark);font-weight:700;}

.mat-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:13px;}
.mat-table th{background:var(--dark);color:#fff;padding:9px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.mat-table td{padding:9px 12px;border-bottom:1px solid var(--gray-bg);vertical-align:middle;}
.mat-table tr:last-child td{border-bottom:none;}
.mat-table tr:hover td{background:#f8fafc;}
.mat-cod{font-family:'Courier New',monospace;font-weight:700;color:var(--dark);background:#fef9c3;padding:3px 8px;border-radius:5px;display:inline-block;}
.mat-cod.empty{background:var(--gray-bg);color:var(--gray-l);font-style:italic;}
.mat-cant{font-weight:800;color:var(--dark);text-align:right;font-variant-numeric:tabular-nums;}
.mat-um{color:var(--gray);font-size:11px;text-transform:lowercase;}
.btn-copy{padding:5px 10px;border-radius:6px;border:1px solid var(--gray-b);background:#fff;color:var(--gray);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit;}
.btn-copy:hover{border-color:var(--blue);color:var(--blue);background:#eff6ff;}
.btn-copy.copied{background:var(--green);color:#fff;border-color:var(--green);}
@media(max-width:640px){.oferta-head{flex-wrap:wrap;}.oferta-total{order:5;width:100%;text-align:right;}.oferta-actions{order:6;width:100%;justify-content:flex-end;}}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:400;display:none;}.loading-bar.active{display:block;}.loading-bar::after{content:'';display:block;width:30%;height:100%;background:var(--red);border-radius:2px;animation:loadSlide 1.2s infinite ease-in-out;}
@keyframes loadSlide{0%{margin-left:-30%}100%{margin-left:100%}}
</style>
</head>
<body>
<div class="loading-bar" id="loadBar"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">🛒 Necesar Materiale</div>
            <div class="page-subtitle" id="syncStatus"><span class="sync-indicator sync-off"></span>Date locale (demo)</div>
        </div>
        <div class="page-actions">
            <a href="materiale.html" class="page-btn secondary">📦 Stocuri</a>
            <button class="page-btn secondary" onclick="refreshData()">🔄 Reîncarcă</button>
        </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="filters">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută client, proiect, cod, denumire..." oninput="render()">
        <select class="filter-select" id="filterStatus" onchange="render()">
            <option value="">Proiectare + Execuție</option>
            <option value="Proiectare">Doar Proiectare</option>
            <option value="Executie">Doar Execuție</option>
        </select>
        <div class="filter-count" id="filterCount"></div>
    </div>

    <div id="necesarView"><div class="empty-msg">⏳ Se încarcă necesarul...</div></div>
    <div class="footer">Portal CSSI 3.0 · Necesar Materiale v4.0 · Materiale din ofertele acceptate ale proiectelor în Proiectare și Execuție</div>
</div>

<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="crm-clienti.html" class="bn-item"><span class="bn-icon">💰</span>CRM</a>
    <a href="executie.html" class="bn-item"><span class="bn-icon">🔧</span>Execuție</a>
    <a href="financiar.html" class="bn-item"><span class="bn-icon">📄</span>Facturi</a>
</div>


<script>
// ═══ AUTH GATE ═══
var role = sessionStorage.getItem('cssi-role');
if (!role) { window.location.href = '../admin.html'; }

// ═══ STATE ═══
var API_DB = '/admin/api.php';
var DATA = []; // [{client_id, client_nume, oferte:[{oferta_id, proiect_id, ...linii:[{cod,denumire,um,cantitate}]}]}]
var isLive = false;

// ═══ HELPERS ═══
function esc(s){if(s==null)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmt(n){return Number(n||0).toLocaleString('ro-RO',{maximumFractionDigits:2});}
function fmtQty(n){var v=Number(n||0);return v%1===0?v.toString():v.toFixed(2);}
function showLoading(s){document.getElementById('loadBar').classList.toggle('active',s);}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100px)';t.style.transition='all 0.3s'},2500);setTimeout(function(){t.remove()},3000);}
function updateSync(state){var el=document.getElementById('syncStatus');if(state==='loading')el.innerHTML='<span class="sync-indicator sync-loading"></span>Se încarcă...';else if(isLive)el.innerHTML='<span class="sync-indicator sync-ok"></span>MySQL · '+countTotalLinii()+' materiale';else el.innerHTML='<span class="sync-indicator sync-off"></span>Indisponibil';}
function countTotalLinii(){var n=0;DATA.forEach(function(c){c.oferte.forEach(function(o){n+=o.linii.length});});return n;}

// ═══ FETCH ═══
function refreshData(){
    updateSync('loading');showLoading(true);
    return fetch(API_DB+'?action=getNecesarMateriale&_t='+Date.now())
        .then(function(r){return r.json()})
        .then(function(res){
            if(!res.success) throw new Error(res.error||'Eroare server');
            DATA = Array.isArray(res.data)?res.data:[];
            isLive = true;
            updateSync();render();
        })
        .catch(function(e){
            isLive = false;DATA=[];
            updateSync();render();
            toast('❌ Nu s-a putut încărca: '+(e.message||e),'error');
        })
        .finally(function(){showLoading(false)});
}

// ═══ FILTRARE ═══
function getFiltered(){
    var q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
    var fs = document.getElementById('filterStatus').value;
    var out = [];
    DATA.forEach(function(c){
        var oferteOK = c.oferte.filter(function(o){
            if(fs && o.proiect_status !== fs) return false;
            if(!q) return true;
            // Match pe client, proiect, ofertă, sau orice cod/denumire din linii
            if(c.client_nume.toLowerCase().includes(q)) return true;
            if((o.proiect_id||'').toLowerCase().includes(q)) return true;
            if((o.oferta_id||'').toLowerCase().includes(q)) return true;
            if((o.obiectiv||'').toLowerCase().includes(q)) return true;
            return o.linii.some(function(l){
                return (l.cod||'').toLowerCase().includes(q) || (l.denumire||'').toLowerCase().includes(q);
            });
        });
        if(oferteOK.length){
            out.push({
                client_id: c.client_id, client_nume: c.client_nume,
                oferte: oferteOK
            });
        }
    });
    return out;
}

// ═══ RENDER ═══
function render(){
    renderSummary();
    var filtered = getFiltered();
    var totalOferte = filtered.reduce(function(s,c){return s+c.oferte.length},0);
    var totalLinii = filtered.reduce(function(s,c){return s+c.oferte.reduce(function(ss,o){return ss+o.linii.length},0)},0);
    document.getElementById('filterCount').textContent = filtered.length+' clienți · '+totalOferte+' oferte · '+totalLinii+' materiale';

    var view = document.getElementById('necesarView');
    if(!DATA.length){
        view.innerHTML = '<div class="empty-msg">Niciun proiect activ în Proiectare/Execuție cu oferte acceptate.</div>';
        return;
    }
    if(!filtered.length){
        view.innerHTML = '<div class="empty-msg">Niciun rezultat pentru filtrele curente.</div>';
        return;
    }
    var html = '';
    filtered.forEach(function(c, ci){
        var totalCli = c.oferte.reduce(function(s,o){return s+o.linii.length},0);
        var initials = (c.client_nume||'?').split(/\s+/).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase();
        html += '<div class="client-card" id="cli-'+ci+'">';
        html += '<button class="client-head" type="button" onclick="toggleClient('+ci+')">';
        html += '<div class="client-icon">'+initials+'</div>';
        html += '<div class="client-info"><div class="client-name">'+esc(c.client_nume)+'</div>';
        html += '<div class="client-meta"><span class="pill">📋 '+c.oferte.length+' ofert'+(c.oferte.length===1?'ă':'e')+'</span><span class="pill">📦 '+totalCli+' materiale</span></div></div>';
        html += '<div class="client-chevron">▾</div></button>';
        html += '<div class="client-body">';
        c.oferte.forEach(function(o, oi){
            var statusCls = (o.proiect_status||'').toLowerCase();
            html += '<div class="oferta-card" id="of-'+ci+'-'+oi+'">';
            html += '<button class="oferta-head" type="button" onclick="toggleOferta('+ci+','+oi+')">';
            html += '<div class="oferta-codes">';
            html += '<div class="oferta-cod">'+esc(o.oferta_id||'?')+'</div>';
            html += '<div class="oferta-proj">📌 <strong>'+esc(o.proiect_id||'?')+'</strong>';
            if(o.obiectiv) html += ' · '+esc(o.obiectiv);
            html += '</div></div>';
            html += '<span class="oferta-status '+statusCls+'">'+esc(o.proiect_status||'')+'</span>';
            html += '<span class="oferta-total">'+fmt(o.total_cu_tva)+' RON</span>';
            html += '<div class="oferta-actions"><button type="button" class="btn-copy-all" onclick="event.stopPropagation();copyAllCodes('+ci+','+oi+')">📋 Copy codes</button></div>';
            html += '<div class="oferta-chevron">▾</div></button>';
            html += '<div class="oferta-body">';
            if(o.linii.length){
                html += '<table class="mat-table"><thead><tr><th style="width:30%">Cod produs</th><th>Denumire</th><th style="width:60px">UM</th><th style="width:80px;text-align:right">Cant.</th><th style="width:80px"></th></tr></thead><tbody>';
                o.linii.forEach(function(l, li){
                    var codDisplay = l.cod ? '<span class="mat-cod">'+esc(l.cod)+'</span>' : '<span class="mat-cod empty">— fără cod —</span>';
                    html += '<tr>';
                    html += '<td>'+codDisplay+'</td>';
                    html += '<td>'+esc(l.denumire)+'</td>';
                    html += '<td class="mat-um">'+esc(l.um||'buc')+'</td>';
                    html += '<td class="mat-cant">'+fmtQty(l.cantitate)+'</td>';
                    html += '<td>'+(l.cod?'<button type="button" class="btn-copy" onclick="copyCode(this,\''+esc(l.cod).replace(/'/g,"\\'")+'\')">📋 Copy</button>':'')+'</td>';
                    html += '</tr>';
                });
                html += '</tbody></table>';
            } else {
                html += '<div class="empty-msg" style="padding:20px">Nicio linie de echipament</div>';
            }
            html += '</div></div>';
        });
        html += '</div></div>';
    });
    view.innerHTML = html;
}

function renderSummary(){
    var clienti = DATA.length;
    var totalOferte = DATA.reduce(function(s,c){return s+c.oferte.length},0);
    var totalMat = countTotalLinii();
    var totalQty = 0, totalVal = 0;
    DATA.forEach(function(c){c.oferte.forEach(function(o){
        totalVal += Number(o.total_cu_tva)||0;
        o.linii.forEach(function(l){totalQty += Number(l.cantitate)||0});
    })});
    document.getElementById('summary').innerHTML =
        '<div class="s-item"><div class="s-icon" style="background:#eff6ff">🏢</div><div><div class="s-val" style="color:var(--blue)">'+clienti+'</div><div class="s-label">Clienți activi</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#f5f3ff">📋</div><div><div class="s-val" style="color:var(--purple)">'+totalOferte+'</div><div class="s-label">Oferte acceptate</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#fff7ed">📦</div><div><div class="s-val" style="color:var(--orange)">'+totalMat+'</div><div class="s-label">Linii materiale</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#f0fdf4">🔢</div><div><div class="s-val" style="color:var(--green)">'+fmtQty(totalQty)+'</div><div class="s-label">Total cantitate</div></div></div>'+
        '<div class="s-item"><div class="s-icon" style="background:#fef2f2">💰</div><div><div class="s-val" style="color:var(--red)">'+fmt(totalVal)+'</div><div class="s-label">Valoare totală RON</div></div></div>';
}

// ═══ INTERACȚIUNI ═══
function toggleClient(ci){var el=document.getElementById('cli-'+ci);if(el)el.classList.toggle('open');}
function toggleOferta(ci,oi){var el=document.getElementById('of-'+ci+'-'+oi);if(el)el.classList.toggle('open');}
function copyCode(btn, code){
    if(!code) return;
    navigator.clipboard.writeText(code).then(function(){
        btn.classList.add('copied');btn.textContent='✓ Copiat';
        setTimeout(function(){btn.classList.remove('copied');btn.textContent='📋 Copy'},1400);
    }).catch(function(){toast('⚠️ Nu pot copia în clipboard','error')});
}
function copyAllCodes(ci, oi){
    var c = DATA[ci]; if(!c) return;
    var o = c.oferte[oi]; if(!o) return;
    var lines = o.linii.filter(function(l){return l.cod}).map(function(l){return l.cod+'\t'+fmtQty(l.cantitate)});
    if(!lines.length){toast('Nu sunt coduri de copiat','info');return;}
    navigator.clipboard.writeText(lines.join('\n')).then(function(){
        toast('✅ '+lines.length+' coduri copiate (cod + cantitate, separate cu Tab)','success');
    }).catch(function(){toast('⚠️ Nu pot copia în clipboard','error')});
}

// ═══ INIT ═══
refreshData();

</script>

    navigator.serviceWorker.register('../sw.js').then(function(r){console.log('[PWA] SW registered, scope:',r.scope)}).catch(function(e){console.log('[PWA] SW failed:',e)});
    var __reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(__reloaded)return;__reloaded=true;
        console.log('[PWA] SW nou activ — reload pentru cache curat');
        window.location.reload();
    });
}
</script>
