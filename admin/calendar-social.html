<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar Social Media — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal CSSI">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--yellow:#eab308;--teal:#14b8a6;--pink:#ec4899;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
.page-header{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;}
.page-actions{display:flex;gap:8px;align-items:center;}
.page-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;}
.page-btn.primary{background:#fff;color:#7c3aed;}.page-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(0,0,0,0.2);}
.page-btn.secondary{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);}.page-btn.secondary:hover{background:rgba(255,255,255,0.25);}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.sync-ok{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);}.sync-off{background:rgba(255,255,255,0.4);}.sync-loading{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.container{max-width:1400px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

.kpi-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.kpi-card{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:120px;cursor:pointer;transition:all 0.2s;}.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.kpi-card.active-filter{border:2px solid var(--purple);}
.kpi-val{font-size:22px;font-weight:900;}.kpi-label{font-size:11px;color:var(--gray);margin-top:1px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;min-width:180px;background:#fff;flex:1;max-width:280px;}.filter-search:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,0.08);}
.filter-select{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;font-family:inherit;outline:none;cursor:pointer;}
.view-toggle{display:flex;background:#fff;border-radius:10px;padding:3px;box-shadow:var(--shadow);border:1px solid var(--gray-b);margin-left:auto;}
.view-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;background:none;color:var(--gray);cursor:pointer;transition:all 0.2s;}.view-btn.active{background:var(--dark);color:#fff;}
.filter-count{font-size:12px;color:var(--gray);font-weight:500;}

/* Platform colors */
.plat-fb{color:#1877F2;}.plat-ig{color:#E4405F;}.plat-goog{color:#4285F4;}.plat-yt{color:#FF0000;}.plat-tiktok{color:#000;}.plat-linkedin{color:#0A66C2;}
.bg-fb{background:#1877F215;}.bg-ig{background:#E4405F15;}.bg-goog{background:#4285F415;}.bg-yt{background:#FF000015;}.bg-tiktok{background:#00000010;}.bg-linkedin{background:#0A66C215;}

/* POST CARDS */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:16px;}
.pcard{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-top:3px solid var(--gray-b);transition:all 0.2s;cursor:pointer;}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.pcard.fb{border-top-color:#1877F2;}.pcard.ig{border-top-color:#E4405F;}.pcard.goog{border-top-color:#4285F4;}.pcard.yt{border-top-color:#FF0000;}.pcard.tiktok{border-top-color:#000;}.pcard.linkedin{border-top-color:#0A66C2;}
.pcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pcard-plat{font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;}
.pcard-date{font-size:11px;color:var(--gray);font-weight:600;}
.pcard-content{font-size:13px;line-height:1.6;color:var(--dark2);margin-bottom:10px;max-height:80px;overflow:hidden;}
.pcard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pcard-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;}
.badge-idee{background:#f5f3ff;color:var(--purple);}.badge-draft{background:var(--gray-bg);color:var(--gray);}.badge-programat{background:#fff7ed;color:var(--orange);}.badge-publicat{background:#f0fdf4;color:var(--green);}
.pcard-footer{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--gray-bg);}

/* CALENDAR VIEW */
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:#fff;border-radius:var(--radius);padding:12px 20px;box-shadow:var(--shadow);}
.cal-nav-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--gray-b);background:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s;font-family:inherit;}.cal-nav-btn:hover{background:var(--gray-bg);}
.cal-month{font-size:18px;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:16px;}
.cal-head{padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;}
.cal-day{background:#fff;min-height:90px;padding:6px;border-radius:8px;font-size:11px;position:relative;cursor:pointer;transition:all 0.15s;}
.cal-day:hover{box-shadow:var(--shadow-md);}
.cal-day.other{opacity:0.3;}.cal-day.today{border:2px solid var(--purple);}
.cal-day-num{font-weight:800;font-size:12px;margin-bottom:4px;}
.cal-post{padding:3px 5px;border-radius:4px;font-size:9px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cal-post.fb{background:#1877F215;color:#1877F2;}.cal-post.ig{background:#E4405F15;color:#E4405F;}.cal-post.goog{background:#4285F415;color:#4285F4;}.cal-post.yt{background:#FF000015;color:#FF0000;}.cal-post.tiktok{background:#00000010;color:#000;}.cal-post.linkedin{background:#0A66C215;color:#0A66C2;}

/* KANBAN */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;}
.kanban-col{min-width:260px;flex:1;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.kanban-head{padding:14px 16px;color:#fff;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.kanban-head .count{background:rgba(255,255,255,0.3);padding:2px 8px;border-radius:6px;font-size:11px;}
.kanban-body{padding:8px;min-height:100px;max-height:500px;overflow-y:auto;}
.k-card{background:var(--gray-bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;border-left:3px solid transparent;}
.k-card:hover{transform:translateX(2px);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.k-card.fb{border-left-color:#1877F2;}.k-card.ig{border-left-color:#E4405F;}.k-card.goog{border-left-color:#4285F4;}.k-card.yt{border-left-color:#FF0000;}.k-card.tiktok{border-left-color:#000;}
.k-card-title{font-size:12px;font-weight:700;margin-bottom:4px;}.k-card-sub{font-size:11px;color:var(--gray);}

.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:14px 20px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:380px;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--purple);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:1;}
.modal-title{font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;display:flex;align-items:center;justify-content:center;}.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:24px;}
.form-group{margin-bottom:16px;}.form-label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px;}.form-label .req{color:var(--red);}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 16px;border:2px solid var(--gray-b);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,0.08);}
.form-textarea{min-height:80px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-submit{width:100%;padding:14px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s;}.form-submit:hover{transform:translateY(-1px);}
.char-count{font-size:11px;color:var(--gray);text-align:right;margin-top:4px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}.bn-item.active{color:var(--purple);background:#f5f3ff;}.bn-item .bn-icon{font-size:20px;}
.empty-msg{text-align:center;padding:40px;color:var(--gray-l);font-size:14px;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:400;display:none;}.loading-bar.active{display:block;}.loading-bar::after{content:'';display:block;width:30%;height:100%;background:var(--purple);border-radius:2px;animation:loadSlide 1.2s infinite ease-in-out;}
@keyframes loadSlide{0%{margin-left:-30%}100%{margin-left:100%}}
</style>
</head>
<body>
<div class="loading-bar" id="loadBar"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-header">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title">📅 Calendar Social Media</div>
            <div class="page-subtitle" id="syncStatus"><span class="sync-indicator sync-off"></span>Date locale (demo)</div>
        </div>
        <div class="page-actions">
            <a href="marketing.html" class="page-btn secondary">📊 Marketing</a>
            <button class="page-btn secondary" onclick="refreshData()">🔄 Sync</button>
            <button class="page-btn primary" onclick="openAddModal()">+ Postare Nouă</button>
        </div>
    </div>

    <div class="kpi-row" id="kpiRow"></div>

    <div class="filters">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută conținut..." oninput="render()">
        <select class="filter-select" id="filterStatus" onchange="render()"><option value="">Toate statusurile</option><option>Idee</option><option>Draft</option><option>Programat</option><option>Publicat</option></select>
        <select class="filter-select" id="filterPlatform" onchange="render()"><option value="">Toate platformele</option><option value="fb">📘 Facebook</option><option value="ig">📸 Instagram</option><option value="goog">🔍 Google</option><option value="yt">▶️ YouTube</option><option value="tiktok">🎵 TikTok</option><option value="linkedin">💼 LinkedIn</option></select>
        <div class="view-toggle">
            <button class="view-btn active" id="vList" onclick="setView('list')">📋 Lista</button>
            <button class="view-btn" id="vCal" onclick="setView('calendar')">📅 Calendar</button>
            <button class="view-btn" id="vKanban" onclick="setView('kanban')">◫ Kanban</button>
        </div>
        <div class="filter-count" id="filterCount"></div>
    </div>

    <div id="listView" class="posts"></div>
    <div id="calView" style="display:none"><div class="cal-nav"><button class="cal-nav-btn" onclick="navMonth(-1)">← Luna anterioară</button><div class="cal-month" id="calMonth"></div><button class="cal-nav-btn" onclick="navMonth(1)">Luna următoare →</button></div><div class="cal-grid" id="calGrid"></div></div>
    <div id="kanbanView" style="display:none"></div>
    <div class="footer">Portal CSSI 3.0 · Calendar Social Media v3.0</div>
</div>

<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="crm-clienti.html" class="bn-item"><span class="bn-icon">💰</span>CRM</a>
    <a href="executie.html" class="bn-item"><span class="bn-icon">🔧</span>Execuție</a>
    <a href="financiar.html" class="bn-item"><span class="bn-icon">📄</span>Facturi</a>
</div>

<!-- ADD/EDIT MODAL -->
<div id="addModal" class="modal-overlay" onclick="if(event.target===this)closeAddModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title" id="modalTitle">📝 Postare Nouă</div><button class="modal-close" onclick="closeAddModal()">✕</button></div>
    <div class="modal-body">
        <form id="addForm" onsubmit="savePost(event)">
            <input type="hidden" name="editId" id="editId" value="">
            <div class="form-row">
                <div class="form-group"><label class="form-label">Platformă <span class="req">*</span></label>
                    <select class="form-select" name="platforma" id="fPlat" required><option value="fb">📘 Facebook</option><option value="ig">📸 Instagram</option><option value="goog">🔍 Google Business</option><option value="yt">▶️ YouTube</option><option value="tiktok">🎵 TikTok</option><option value="linkedin">💼 LinkedIn</option></select>
                </div>
                <div class="form-group"><label class="form-label">Data publicare</label><input type="date" class="form-input" name="data" id="fData"></div>
            </div>
            <div class="form-group"><label class="form-label">Conținut <span class="req">*</span></label><textarea class="form-textarea" name="continut" id="fContent" required placeholder="Textul postării, hashtag-uri..." oninput="updateCharCount()"></textarea><div class="char-count" id="charCount">0 caractere</div></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Status</label>
                    <select class="form-select" name="status" id="fStatus"><option>Idee</option><option selected>Draft</option><option>Programat</option><option>Publicat</option></select>
                </div>
                <div class="form-group"><label class="form-label">Tip conținut</label>
                    <select class="form-select" name="tip" id="fTip"><option>Foto</option><option>Video</option><option>Carusel</option><option>Story</option><option>Reel</option><option>Text</option></select>
                </div>
            </div>
            <div class="form-group"><label class="form-label">Observații</label><input type="text" class="form-input" name="note" id="fNote" placeholder="Link imagine, notițe echipă..."></div>
            <button type="submit" class="form-submit" id="submitBtn">📝 Salvează Postare</button>
        </form>
    </div>
</div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="modal-overlay" onclick="if(event.target===this)closeDetailModal()">
<div class="modal">
    <div class="modal-head"><div class="modal-title" id="detailTitle">📋 Detalii Postare</div><button class="modal-close" onclick="closeDetailModal()">✕</button></div>
    <div class="modal-body" id="detailBody"></div>
</div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzdM_e5DY5nmd57TmB24sXz8dML93gKIolkmlqKxE7_d-_o3jHMVYuQ06YiQ5zJgZiB/exec';
var role = sessionStorage.getItem('cssi-role');
if (!role || !['admin','mkt'].includes(role)) { window.location.href = '../admin.html'; }

var PLAT = {fb:'📘 Facebook',ig:'📸 Instagram',goog:'🔍 Google Business',yt:'▶️ YouTube',tiktok:'🎵 TikTok',linkedin:'💼 LinkedIn'};
var POSTS = [];
var currentView = 'list';
var isLive = false;
var kpiFilter = '';
var calYear, calMonth;

var DEMO = [

    {id:3,row:3,plat:'goog',content:'CSSI Brașov — Soluții complete de securitate: alarme, CCTV, detecție incendiu, automatizări porți. Peste 15 ani experiență!',data:'2026-03-03',status:'Publicat',tip:'Text',note:'Update profil GMB'},
    {id:4,row:4,plat:'fb',content:'⚡ Știai că verificarea periodică a instalațiilor electrice este obligatorie? CSSI oferă servicii complete de verificare PRAM + buletin. #PRAM #verificari',data:'2026-03-07',status:'Draft',tip:'Foto',note:'Trebuie creată imaginea'},
    {id:5,row:5,plat:'ig',content:'🏗️ Proiect în desfășurare: Fabrica Autoliv — sistem complet CCTV perimetral. Stay tuned! #workinprogress #CCTV',data:'2026-03-10',status:'Idee',tip:'Carusel',note:'3-4 poze progres'},

    {id:7,row:7,plat:'tiktok',content:'🎬 Behind the scenes: Cum montăm un sistem de detecție incendiu de la zero. De la proiectare la recepție!',data:'2026-03-12',status:'Idee',tip:'Video',note:'Filmări necesare pe teren'},
    {id:8,row:8,plat:'yt',content:'Tutorial: Cum funcționează un sistem de detecție incendiu adresabil Bosch FPA-5000. Configurare, testare, mentenanță.',data:'2026-03-15',status:'Idee',tip:'Video',note:'Video lung, 5-10 min'},
    {id:9,row:9,plat:'linkedin',content:'🏆 CSSI Brașov — 15 ani de excelență în securitate! De la primele sisteme de alarmă la proiecte complexe pentru clienți industriali. Mulțumim partenerilor noștri!',data:'2026-03-08',status:'Draft',tip:'Foto',note:'Post aniversar'},
    {id:10,row:10,plat:'fb',content:'📷 CCTV pentru siguranța ta! Sisteme de supraveghere video de la Hikvision, montaj profesional de echipa CSSI. Solicită ofertă!',data:'2026-03-14',status:'Programat',tip:'Foto',note:'Programat cu Buffer'}
];

function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showLoading(s){document.getElementById('loadBar').classList.toggle('active',s);}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100px)';t.style.transition='all 0.3s'},3000);setTimeout(function(){t.remove()},3500);}
function todayStr(){return new Date().toISOString().split('T')[0];}

function apiGet(a){if(!API_URL)return Promise.reject('No API');showLoading(true);return fetch(API_URL+'?action='+a).then(function(r){return r.json()}).finally(function(){showLoading(false)});}
function apiPost(d){if(!API_URL)return Promise.reject('No API');showLoading(true);return fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).finally(function(){showLoading(false)});}

function refreshData(){
    if(!API_URL){toast('⚠️ API nesetat. Date demo.','info');POSTS=JSON.parse(JSON.stringify(DEMO));isLive=false;updateSync();render();return;}
    updateSync('loading');
    apiGet('getSocial').then(function(res){
        if(Array.isArray(res)){POSTS=res.map(function(r,i){return {id:i+1,row:r.row||i+1,plat:r.platforma||'fb',content:r.continut||'',data:r.data||'',status:r.status||'Idee',tip:r.tip||'Foto',note:r.note||''};});}
        isLive=true;updateSync();render();toast('✅ Sincronizat','success');
    }).catch(function(){isLive=false;updateSync();toast('❌ Sync eșuat','error');});
}
function updateSync(s){var el=document.getElementById('syncStatus');if(s==='loading')el.innerHTML='<span class="sync-indicator sync-loading"></span>Se sincronizează...';else if(isLive)el.innerHTML='<span class="sync-indicator sync-ok"></span>Conectat la Google Sheets';else el.innerHTML='<span class="sync-indicator sync-off"></span>Date locale (demo)';}

function getFiltered(){
    var q=document.getElementById('searchInput').value.toLowerCase();
    var fs=document.getElementById('filterStatus').value;
    var fp=document.getElementById('filterPlatform').value;
    return POSTS.filter(function(p){
        if(fs&&p.status!==fs)return false;
        if(fp&&p.plat!==fp)return false;
        if(kpiFilter&&p.status!==kpiFilter)return false;
        if(q&&!p.content.toLowerCase().includes(q))return false;
        return true;
    });
}
function toggleKpiFilter(f){kpiFilter=kpiFilter===f?'':f;render();}

function render(){
    renderKPI();
    var f=getFiltered();
    document.getElementById('filterCount').textContent=f.length+' postări';
    if(currentView==='list'){renderList(f);show('listView');hide('calView');hide('kanbanView');}
    else if(currentView==='calendar'){renderCal();hide('listView');show('calView');hide('kanbanView');}
    else{renderKanban(f);hide('listView');hide('calView');show('kanbanView');}
}
function show(id){document.getElementById(id).style.display='';}function hide(id){document.getElementById(id).style.display='none';}

function renderKPI(){
    var idei=POSTS.filter(function(p){return p.status==='Idee'}).length;
    var drafts=POSTS.filter(function(p){return p.status==='Draft'}).length;
    var prog=POSTS.filter(function(p){return p.status==='Programat'}).length;
    var pub=POSTS.filter(function(p){return p.status==='Publicat'}).length;
    document.getElementById('kpiRow').innerHTML=
        '<div class="kpi-card" onclick="toggleKpiFilter(\'\')"><div class="kpi-val">'+POSTS.length+'</div><div class="kpi-label">Total postări</div></div>'+
        '<div class="kpi-card'+(kpiFilter==='Idee'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Idee\')"><div class="kpi-val" style="color:var(--purple)">'+idei+'</div><div class="kpi-label">💡 Idei</div></div>'+
        '<div class="kpi-card'+(kpiFilter==='Draft'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Draft\')"><div class="kpi-val" style="color:var(--gray)">'+drafts+'</div><div class="kpi-label">📝 Drafturi</div></div>'+
        '<div class="kpi-card'+(kpiFilter==='Programat'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Programat\')"><div class="kpi-val" style="color:var(--orange)">'+prog+'</div><div class="kpi-label">⏰ Programate</div></div>'+
        '<div class="kpi-card'+(kpiFilter==='Publicat'?' active-filter':'')+'" onclick="toggleKpiFilter(\'Publicat\')"><div class="kpi-val" style="color:var(--green)">'+pub+'</div><div class="kpi-label">✅ Publicate</div></div>';
}

function renderList(filtered){
    if(!filtered.length){document.getElementById('listView').innerHTML='<div class="empty-msg">Nicio postare găsită</div>';return;}
    var sorted=filtered.slice().sort(function(a,b){return b.data.localeCompare(a.data);});
    var html='';
    sorted.forEach(function(p){
        var badgeCls='badge-'+(p.status==='Publicat'?'publicat':p.status==='Programat'?'programat':p.status==='Draft'?'draft':'idee');
        html+='<div class="pcard '+p.plat+'" onclick="openDetailModal('+p.id+')">';
        html+='<div class="pcard-top"><div class="pcard-plat plat-'+p.plat+'">'+(PLAT[p.plat]||p.plat)+'</div><div class="pcard-date">📅 '+p.data+'</div></div>';
        html+='<div class="pcard-content">'+esc(p.content)+'</div>';
        html+='<div class="pcard-tags"><span class="pcard-badge '+badgeCls+'">'+p.status+'</span>';
        if(p.tip) html+='<span class="pcard-badge" style="background:var(--gray-bg);color:var(--gray)">'+p.tip+'</span>';
        html+='</div>';
        html+='<div class="pcard-footer"><select onclick="event.stopPropagation()" onchange="changeStatus('+p.id+',this.value)" style="padding:6px 10px;border-radius:8px;border:1px solid var(--gray-b);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer">';
        ['Idee','Draft','Programat','Publicat'].forEach(function(s){html+='<option'+(p.status===s?' selected':'')+'>'+s+'</option>';});
        html+='</select>';
        html+='<button onclick="event.stopPropagation();openEditModal('+p.id+')" style="padding:5px 12px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:11px;font-weight:700;cursor:pointer">✏️</button></div></div>';
    });
    document.getElementById('listView').innerHTML=html;
}

function renderCal(){
    var now=new Date();if(!calYear){calYear=now.getFullYear();calMonth=now.getMonth();}
    var months=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
    document.getElementById('calMonth').textContent=months[calMonth]+' '+calYear;
    var first=new Date(calYear,calMonth,1);var lastDay=new Date(calYear,calMonth+1,0).getDate();
    var startDay=(first.getDay()+6)%7;
    var html='';['Lun','Mar','Mie','Joi','Vin','Sâm','Dum'].forEach(function(d){html+='<div class="cal-head">'+d+'</div>';});
    var prevLast=new Date(calYear,calMonth,0).getDate();
    for(var i=startDay-1;i>=0;i--) html+='<div class="cal-day other"><div class="cal-day-num">'+(prevLast-i)+'</div></div>';
    var todayD=now.getDate(),todayM=now.getMonth(),todayY=now.getFullYear();
    for(var d=1;d<=lastDay;d++){
        var isToday=d===todayD&&calMonth===todayM&&calYear===todayY;
        var dateStr=calYear+'-'+(calMonth+1<10?'0':'')+(calMonth+1)+'-'+(d<10?'0':'')+d;
        var dayPosts=POSTS.filter(function(p){return p.data===dateStr;});
        html+='<div class="cal-day'+(isToday?' today':'')+'" onclick="addForDate(\''+dateStr+'\')">';
        html+='<div class="cal-day-num">'+d+'</div>';
        dayPosts.forEach(function(p){
            html+='<div class="cal-post '+p.plat+'" onclick="event.stopPropagation();openDetailModal('+p.id+')" title="'+esc(p.content.substring(0,80))+'">'+esc(p.content.substring(0,30))+'</div>';
        });
        html+='</div>';
    }
    var totalCells=startDay+lastDay;var rem=totalCells%7?7-totalCells%7:0;
    for(var i=1;i<=rem;i++) html+='<div class="cal-day other"><div class="cal-day-num">'+i+'</div></div>';
    document.getElementById('calGrid').innerHTML=html;
}
function navMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCal();}
function addForDate(d){document.getElementById('fData').value=d;openAddModal();}

function renderKanban(){
    var statuses=[{name:'Idee',color:'#8b5cf6'},{name:'Draft',color:'#64748b'},{name:'Programat',color:'#f97316'},{name:'Publicat',color:'#22c55e'}];
    var html='';
    statuses.forEach(function(s){
        var items=POSTS.filter(function(p){return p.status===s.name;});
        html+='<div class="kanban-col"><div class="kanban-head" style="background:'+s.color+'">'+s.name+' <span class="count">'+items.length+'</span></div><div class="kanban-body">';
        if(!items.length) html+='<div style="text-align:center;color:var(--gray-l);font-size:12px;padding:20px">Gol</div>';
        items.forEach(function(p){
            html+='<div class="k-card '+p.plat+'" onclick="openDetailModal('+p.id+')">';
            html+='<div class="k-card-title">'+(PLAT[p.plat]||'')+' · '+p.data+'</div>';
            html+='<div class="k-card-sub">'+esc(p.content.substring(0,60))+(p.content.length>60?'...':'')+'</div></div>';
        });
        html+='</div></div>';
    });
    document.getElementById('kanbanView').innerHTML='<div class="kanban">'+html+'</div>';
}

function changeStatus(id,val){
    var p=POSTS.find(function(x){return x.id===id});if(!p)return;
    p.status=val;
    if(API_URL) apiPost({action:'updateSocialStatus',row:p.row,status:val}).catch(function(){});
    render();toast('✅ '+val,'success');
}

function openDetailModal(id){
    var p=POSTS.find(function(x){return x.id===id});if(!p)return;
    var badgeCls='badge-'+(p.status==='Publicat'?'publicat':p.status==='Programat'?'programat':p.status==='Draft'?'draft':'idee');
    document.getElementById('detailTitle').textContent=(PLAT[p.plat]||'')+'  Postare';
    var html='<div style="display:grid;gap:14px">';
    html+='<div style="text-align:center"><span class="pcard-badge '+badgeCls+'" style="font-size:14px;padding:8px 20px">'+p.status+'</span></div>';
    html+='<div style="background:var(--gray-bg);padding:16px;border-radius:12px;font-size:14px;line-height:1.7;white-space:pre-wrap">'+esc(p.content)+'</div>';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">';
    html+='<div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--gray-b)"><strong>Platformă</strong><br><span class="plat-'+p.plat+'" style="font-weight:700">'+(PLAT[p.plat]||p.plat)+'</span></div>';
    html+='<div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--gray-b)"><strong>Data</strong><br>'+p.data+'</div>';
    html+='<div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--gray-b)"><strong>Tip</strong><br>'+(p.tip||'—')+'</div>';
    html+='<div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--gray-b)"><strong>Caractere</strong><br>'+p.content.length+'</div>';
    html+='</div>';
    if(p.note) html+='<div style="font-size:13px;color:var(--gray);font-style:italic;padding:10px 14px;background:var(--gray-bg);border-radius:8px">📝 '+esc(p.note)+'</div>';
    html+='<div style="display:flex;gap:8px"><button onclick="closeDetailModal();openEditModal('+p.id+')" style="flex:1;padding:12px;border-radius:12px;border:none;background:var(--purple);color:#fff;font-weight:700;cursor:pointer">✏️ Editează</button>';
    html+='<button onclick="deletePost('+p.id+')" style="padding:12px 16px;border-radius:12px;border:none;background:#fef2f2;color:var(--red);font-weight:700;cursor:pointer">🗑️</button></div></div>';
    document.getElementById('detailBody').innerHTML=html;
    document.getElementById('detailModal').classList.add('active');
}
function closeDetailModal(){document.getElementById('detailModal').classList.remove('active');}

function deletePost(id){
    if(!confirm('Ștergi această postare?'))return;
    POSTS=POSTS.filter(function(p){return p.id!==id});
    closeDetailModal();render();toast('🗑️ Postare ștearsă','info');
}

function setView(v){currentView=v;document.getElementById('vList').classList.toggle('active',v==='list');document.getElementById('vCal').classList.toggle('active',v==='calendar');document.getElementById('vKanban').classList.toggle('active',v==='kanban');render();}

function openAddModal(){
    document.getElementById('editId').value='';
    document.getElementById('modalTitle').textContent='📝 Postare Nouă';
    document.getElementById('submitBtn').textContent='📝 Salvează Postare';
    document.getElementById('addForm').reset();
    if(!document.getElementById('fData').value)document.getElementById('fData').value=todayStr();
    updateCharCount();
    document.getElementById('addModal').classList.add('active');
}
function openEditModal(id){
    var p=POSTS.find(function(x){return x.id===id});if(!p)return;
    document.getElementById('editId').value=p.id;
    document.getElementById('modalTitle').textContent='✏️ Editare Postare';
    document.getElementById('submitBtn').textContent='💾 Salvează';
    document.getElementById('fPlat').value=p.plat;
    document.getElementById('fData').value=p.data;
    document.getElementById('fContent').value=p.content;
    document.getElementById('fStatus').value=p.status;
    document.getElementById('fTip').value=p.tip||'Foto';
    document.getElementById('fNote').value=p.note||'';
    updateCharCount();
    document.getElementById('addModal').classList.add('active');
}
function closeAddModal(){document.getElementById('addModal').classList.remove('active');}
function updateCharCount(){document.getElementById('charCount').textContent=(document.getElementById('fContent').value||'').length+' caractere';}

function savePost(e){
    e.preventDefault();var fd=new FormData(document.getElementById('addForm'));
    var editId=parseInt(fd.get('editId'));
    var postData={plat:fd.get('platforma'),content:fd.get('continut'),data:fd.get('data')||todayStr(),status:fd.get('status'),tip:fd.get('tip')||'Foto',note:fd.get('note')||''};
    if(editId){
        var p=POSTS.find(function(x){return x.id===editId});
        if(p) Object.assign(p,postData);
        if(API_URL) apiPost({action:'updateSocial',row:p.row,post:postData}).catch(function(){});
        toast('✅ Postare actualizată','success');
    } else {
        var maxId=0;POSTS.forEach(function(x){if(x.id>maxId)maxId=x.id});
        var newP=Object.assign({id:maxId+1,row:maxId+1},postData);
        if(API_URL) apiPost({action:'addSocial',post:postData}).then(function(res){newP.row=res.row||newP.row}).catch(function(){});
        POSTS.push(newP);
        toast('✅ Postare adăugată','success');
    }
    render();closeAddModal();document.getElementById('addForm').reset();
}

POSTS=JSON.parse(JSON.stringify(DEMO));
render();
if(API_URL) refreshData();
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').then(function(r){console.log('[PWA] SW registered, scope:',r.scope)}).catch(function(e){console.log('[PWA] SW failed:',e)})}
</script>
