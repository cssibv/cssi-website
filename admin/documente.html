<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--teal:#14b8a6;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
.page-header{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;}
.page-actions{display:flex;gap:8px;align-items:center;}
.page-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;}
.page-btn.primary{background:#fff;color:#0ea5e9;}.page-btn.primary:hover{transform:translateY(-1px);}
.page-btn.secondary{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);}.page-btn.secondary:hover{background:rgba(255,255,255,0.25);}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.sync-off{background:rgba(255,255,255,0.4);}
.container{max-width:1400px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

.tabs{display:flex;gap:4px;background:#fff;border-radius:var(--radius);padding:4px;box-shadow:var(--shadow);margin-bottom:16px;}
.tab{flex:1;padding:12px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;border:none;background:transparent;color:var(--gray);transition:all 0.2s;text-align:center;cursor:pointer;}.tab.active{background:var(--dark);color:#fff;box-shadow:var(--shadow-md);}

.kpi-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.kpi-card{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:120px;}
.kpi-val{font-size:22px;font-weight:900;}.kpi-label{font-size:11px;color:var(--gray);margin-top:1px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;min-width:200px;background:#fff;flex:1;max-width:300px;}.filter-search:focus{border-color:var(--blue);}
.filter-select{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;font-family:inherit;outline:none;cursor:pointer;}

/* FOLDERS */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:16px;}
.folder{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:all 0.2s;}.folder:hover{box-shadow:var(--shadow-md);}
.folder-head{padding:16px 18px;background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.folder-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.folder-count{background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:6px;font-size:12px;font-weight:600;}
.folder-pid{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;}
.folder-body{padding:8px;max-height:300px;overflow-y:auto;}
.doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);transition:background 0.15s;cursor:pointer;}.doc-item:hover{background:var(--gray-bg);}
.doc-icon{font-size:24px;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}.doc-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.doc-meta{font-size:11px;color:var(--gray-l);}
.doc-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;flex-shrink:0;}
.doc-tag.pdf{background:#fef2f2;color:var(--red);}.doc-tag.dwg{background:#eff6ff;color:var(--blue);}.doc-tag.doc{background:#f0fdf4;color:var(--green);}.doc-tag.img{background:#fff7ed;color:var(--orange);}.doc-tag.xls{background:#f0fdf4;color:#059669;}.doc-tag.mp4{background:#f5f3ff;color:var(--purple);}

/* GENERAL DOCS */
.gen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px;}
.gen-card{background:#fff;border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow);text-align:center;transition:all 0.2s;cursor:pointer;border-top:3px solid var(--gray-b);}
.gen-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.gen-icon{font-size:32px;margin-bottom:6px;}.gen-name{font-size:13px;font-weight:700;}.gen-desc{font-size:11px;color:var(--gray);margin-top:2px;}
.gen-card.aut{border-top-color:var(--red);}.gen-card.con{border-top-color:var(--green);}.gen-card.proc{border-top-color:var(--blue);}.gen-card.ssm{border-top-color:var(--orange);}.gen-card.ofe{border-top-color:var(--purple);}.gen-card.fir{border-top-color:var(--teal);}

/* MEDIA GALLERY */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px;}
.media-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:all 0.2s;cursor:pointer;}.media-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.media-thumb{height:140px;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
.media-thumb .overlay{position:absolute;bottom:0;left:0;right:0;padding:4px 10px;font-size:10px;font-weight:700;color:#fff;}
.media-body{padding:12px;}.media-name{font-size:13px;font-weight:700;margin-bottom:2px;}.media-meta{font-size:11px;color:var(--gray);}
.media-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.media-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--gray-bg);color:var(--gray);}

/* TEMPLATE CARDS */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;}
.tpl-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all 0.2s;cursor:pointer;border-left:4px solid var(--blue);}
.tpl-card:hover{box-shadow:var(--shadow-md);}.tpl-name{font-size:15px;font-weight:800;margin-bottom:4px;}.tpl-desc{font-size:12px;color:var(--gray);line-height:1.5;margin-bottom:8px;}
.tpl-meta{font-size:11px;color:var(--gray-l);}

.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:14px 20px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:380px;}
.toast.success{background:var(--green);}.toast.info{background:#0ea5e9;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.section-title{font-size:14px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;display:flex;align-items:center;gap:8px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}.bn-item.active{color:#0ea5e9;background:#e0f2fe;}.bn-item .bn-icon{font-size:20px;}
.empty-msg{text-align:center;padding:40px;color:var(--gray-l);font-size:14px;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
</style>

var currentTab='proiecte';

function setTab(id,btn){
    currentTab=id;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    if(btn)btn.classList.add('active');
    ['proiecte','general','media','templates'].forEach(function(t){document.getElementById('tab-'+t).style.display=t===id?'':'none';});
    if(id==='general')renderGeneral();
    if(id==='media')renderMedia();
    if(id==='templates')renderTemplates();
}

function renderFolders(){
    var q=document.getElementById('searchInput').value.toLowerCase();
    var ft=document.getElementById('filterType').value;
    var totalFiles=0,totalPdf=0,totalDwg=0;
    PROJECT_DOCS.forEach(function(p){p.docs.forEach(function(d){totalFiles++;if(d.type==='PDF')totalPdf++;if(d.type==='DWG')totalDwg++;});});
    document.getElementById('kpiFolders').textContent=PROJECT_DOCS.length;
    document.getElementById('kpiFiles').textContent=totalFiles;
    document.getElementById('kpiPdf').textContent=totalPdf;
    document.getElementById('kpiDwg').textContent=totalDwg;

    var html='';
    PROJECT_DOCS.forEach(function(p){
        var filtered=p.docs.filter(function(d){
            var mq=!q||d.name.toLowerCase().includes(q)||p.pid.toLowerCase().includes(q)||p.client.toLowerCase().includes(q);
            var mt=!ft||d.type===ft;
            return mq&&mt;
        });
        if(!filtered.length&&(q||ft))return;
        var docs=filtered.length?filtered:p.docs;
        html+='<div class="folder"><div class="folder-head"><div><div class="folder-name">📂 '+p.client+'</div><div class="folder-pid">'+p.pid+'</div></div><span class="folder-count">'+docs.length+' fișiere</span></div>';
        html+='<div class="folder-body">';
        docs.forEach(function(d){
            html+='<div class="doc-item"><div class="doc-icon">'+(FILE_ICONS[d.type]||'📄')+'</div>';
            html+='<div class="doc-info"><div class="doc-name">'+d.name+'</div><div class="doc-meta">'+d.date+' · '+d.size+'</div></div>';
            html+='<span class="doc-tag '+d.type.toLowerCase()+'">'+d.type+'</span></div>';
        });
        html+='</div></div>';
    });
    document.getElementById('folderList').innerHTML=html||'<div class="empty-msg">Niciun document găsit</div>';
}

function renderGeneral(){
    var html='<div class="gen-grid">';
    GENERAL_DOCS.forEach(function(g){
        html+='<div class="gen-card '+g.cls+'" onclick="showGenDetail(\''+g.name.replace(/'/g,"\\'")+'\')">';
        html+='<div class="gen-icon">'+g.icon+'</div><div class="gen-name">'+g.name+'</div><div class="gen-desc">'+g.desc+'</div>';
        html+='<div style="margin-top:8px;font-size:11px;color:var(--gray)">'+g.items.length+' documente</div></div>';
    });
    html+='</div>';
    document.getElementById('tab-general').innerHTML=html;
}

function showGenDetail(name){
    var g=GENERAL_DOCS.find(function(x){return x.name===name;});if(!g)return;
    var list=g.items.map(function(i){return '📄 '+i;}).join('\n');
    toast(g.name+': '+g.items.length+' documente','info');
}

function renderMedia(){
    var cats={};MEDIA_ITEMS.forEach(function(m){if(!cats[m.cat])cats[m.cat]=[];cats[m.cat].push(m);});
    var html='';
    Object.keys(cats).forEach(function(cat){
        html+='<div class="section-title">'+cat+' ('+cats[cat].length+')</div>';
        html+='<div class="media-grid">';
        cats[cat].forEach(function(m){
            html+='<div class="media-card"><div class="media-thumb" style="background:linear-gradient(135deg,#f1f5f9,#e2e8f0)">'+m.emoji;
            html+='<div class="overlay" style="background:rgba(0,0,0,0.6)">'+m.type+' · '+m.size+'</div></div>';
            html+='<div class="media-body"><div class="media-name">'+m.name+'</div>';
            html+='<div class="media-tags">';m.tags.forEach(function(t){html+='<span class="media-tag">'+t+'</span>';});
            html+='</div></div></div>';
        });
        html+='</div>';
    });
    document.getElementById('tab-media').innerHTML=html;
}

function renderTemplates(){
    var html='<div class="tpl-grid">';
    TEMPLATES.forEach(function(t){
        html+='<div class="tpl-card"><div class="tpl-name">📋 '+t.name+'</div><div class="tpl-desc">'+t.desc+'</div>';
        html+='<div class="tpl-meta">';t.tags.forEach(function(tag){html+='<span class="media-tag">'+tag+'</span> ';});
        html+='</div></div>';
    });
    html+='</div>';
    document.getElementById('tab-templates').innerHTML=html;
}

renderFolders();
</script>
