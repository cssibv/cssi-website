<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execuție — Portal CSSI 3.0</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<meta name="theme-color" content="#dc2626">
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal CSSI">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#dc2626;--red-d:#991b1b;--dark:#0f172a;--dark2:#1e293b;--gray:#64748b;--gray-l:#94a3b8;--gray-xl:#cbd5e1;--gray-bg:#f1f5f9;--gray-b:#e2e8f0;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;--yellow:#eab308;--teal:#14b8a6;--pink:#ec4899;--radius:16px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--shadow-lg:0 12px 32px rgba(0,0,0,0.12);--font:'Inter',system-ui,sans-serif;}
body{font-family:var(--font);color:var(--dark);background:var(--gray-bg);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}

.page-header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:20px 24px;border-radius:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.page-header.tech{background:linear-gradient(135deg,#9a3412,#ea580c);}
.page-back{color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;}.page-back:hover{color:#fff;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.page-subtitle{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;display:flex;align-items:center;gap:6px;}
.page-actions{display:flex;gap:8px;align-items:center;}
.page-btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;border:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.page-btn.primary{background:var(--red);color:#fff;}.page-btn.primary:hover{background:var(--red-d);transform:translateY(-1px);}
.page-btn.secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}.page-btn.secondary:hover{background:rgba(255,255,255,0.2);}
.page-btn.spinning .spin-icon{animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sync-indicator{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
.sync-ok{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,0.5);}.sync-off{background:var(--gray-l);}.sync-loading{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.container{max-width:1400px;margin:0 auto;padding:16px;}@media(min-width:768px){.container{padding:24px;}}

/* Summary KPIs */
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.s-item{background:#fff;border-radius:var(--radius-sm);padding:14px 18px;box-shadow:var(--shadow);flex:1;min-width:140px;display:flex;align-items:center;gap:12px;}
.s-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.s-val{font-size:22px;font-weight:900;line-height:1;}.s-label{font-size:11px;color:var(--gray);margin-top:4px;}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.filter-search{padding:10px 16px;border-radius:99px;font-size:13px;border:1px solid var(--gray-b);outline:none;font-family:inherit;background:#fff;flex:1;min-width:220px;max-width:380px;}
.filter-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.filter-select{padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--gray-b);background:#fff;font-family:inherit;outline:none;cursor:pointer;}
.filter-count{font-size:12px;color:var(--gray);font-weight:600;margin-left:auto;}

/* Project cards (admin/manager view) */
.proj-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:1px solid var(--gray-b);transition:box-shadow 0.2s;}
.proj-card:hover{box-shadow:var(--shadow-md);}
.proj-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;background:linear-gradient(135deg,#fff,#f8fafc);transition:background 0.15s;border:none;width:100%;text-align:left;font-family:inherit;}
.proj-head:hover{background:linear-gradient(135deg,#f8fafc,#fff7ed);}
.proj-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#fff7ed,#fed7aa);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.proj-info{flex:1;min-width:0;}
.proj-title{font-size:15px;font-weight:800;color:var(--dark);letter-spacing:-0.2px;}
.proj-meta{font-size:11px;color:var(--gray);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.proj-meta .pill{background:var(--gray-bg);padding:2px 8px;border-radius:99px;font-weight:700;}
.proj-meta .pill.exec{background:#fff7ed;color:var(--orange);}
.proj-meta .pill.recep{background:#fefce8;color:#854d0e;}
.proj-meta .pill.cnt{background:#eff6ff;color:var(--blue);}
.proj-chevron{width:32px;height:32px;border-radius:50%;background:var(--gray-bg);color:var(--gray);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all 0.25s;flex-shrink:0;}
.proj-card.open .proj-chevron{transform:rotate(180deg);background:#ffedd5;color:var(--orange);}
.proj-body{display:none;padding:0 20px 16px;border-top:1px solid var(--gray-b);}
.proj-card.open .proj-body{display:block;animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

.proj-actions{display:flex;justify-content:flex-end;padding-top:12px;}

/* Programari list */
.prg-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.prg-item{background:var(--gray-bg);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;border-left:3px solid var(--gray-l);transition:all 0.15s;}
.prg-item:hover{background:#f8fafc;}
.prg-item.programat{border-left-color:var(--blue);}
.prg-item.in-curs{border-left-color:var(--orange);background:#fff7ed;}
.prg-item.finalizat{border-left-color:var(--green);background:#f0fdf4;opacity:0.85;}
.prg-item.anulat{border-left-color:var(--gray);opacity:0.55;text-decoration:line-through;}
.prg-date{display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;width:60px;background:#fff;padding:6px 4px;border-radius:8px;border:1px solid var(--gray-b);}
.prg-date-day{font-size:18px;font-weight:900;color:var(--dark);line-height:1;}
.prg-date-month{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;margin-top:2px;}
.prg-date-time{font-size:10px;color:var(--gray);margin-top:2px;font-variant-numeric:tabular-nums;}
.prg-info{flex:1;min-width:0;}
.prg-line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;}
.prg-status{padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;}
.prg-status.programat{background:#dbeafe;color:var(--blue);}
.prg-status.in-curs{background:#ffedd5;color:var(--orange);}
.prg-status.finalizat{background:#dcfce7;color:var(--green);}
.prg-status.anulat{background:var(--gray-bg);color:var(--gray);}
.prg-durata{color:var(--gray);font-weight:600;}
.prg-team{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.prg-team-chip{font-size:10px;padding:3px 9px;border-radius:99px;background:#fff;border:1px solid var(--gray-b);color:var(--dark);font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.prg-team-chip .av{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#f97316,#9a3412);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;}
.prg-team-chip.empty{color:var(--gray-l);font-style:italic;}
.prg-note{font-size:11px;color:var(--gray);margin-top:6px;font-style:italic;}
.prg-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-icon{width:30px;height:30px;border-radius:8px;border:1px solid var(--gray-b);background:#fff;color:var(--gray);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 0.15s;}
.btn-icon:hover{border-color:var(--blue);color:var(--blue);}
.btn-icon.del:hover{border-color:var(--red);color:var(--red);background:#fef2f2;}

.btn-add-prg{padding:8px 14px;border-radius:10px;border:1px dashed var(--blue);background:#eff6ff;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;}
.btn-add-prg:hover{background:var(--blue);color:#fff;border-style:solid;}

/* Tehnician view — agenda */
.day-section{margin-bottom:18px;}
.day-section-title{font-size:11px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-left:6px;display:flex;align-items:center;gap:8px;}
.day-section-title .badge-num{background:var(--orange);color:#fff;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;letter-spacing:0;}
.day-section-title.today .badge-num{background:var(--red);}
.tech-prg-card{background:#fff;border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:8px;border-left:4px solid var(--blue);transition:all 0.15s;}
.tech-prg-card:hover{box-shadow:var(--shadow-md);}
.tech-prg-card.programat{border-left-color:var(--blue);}
.tech-prg-card.in-curs{border-left-color:var(--orange);background:#fff7ed;}
.tech-prg-card.finalizat{border-left-color:var(--green);background:#f0fdf4;}
.tech-prg-card.anulat{border-left-color:var(--gray);opacity:0.55;}
.tech-prg-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
.tech-prg-time{font-size:14px;font-weight:800;color:var(--dark);font-variant-numeric:tabular-nums;}
.tech-prg-time .durata{color:var(--gray);font-weight:600;font-size:11px;margin-left:6px;}
.tech-prg-client{font-size:15px;font-weight:800;color:var(--dark);margin:4px 0 2px;}
.tech-prg-meta{font-size:11px;color:var(--gray);}
.tech-prg-meta strong{color:var(--blue);}
.tech-prg-team{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.tech-prg-note{font-size:12px;color:var(--gray);margin-top:8px;background:var(--gray-bg);padding:8px 12px;border-radius:8px;font-style:italic;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--gray-b);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:20px 20px 0 0;z-index:1;}
.modal-title{font-size:17px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--gray-bg);color:var(--gray);font-size:18px;display:flex;align-items:center;justify-content:center;}.modal-close:hover{background:#fef2f2;color:var(--red);}
.modal-body{padding:22px;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--dark);margin-bottom:6px;}.form-label .req{color:var(--red);}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;border:2px solid var(--gray-b);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;background:#fff;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.form-textarea{min-height:60px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:480px){.form-row,.form-row-3{grid-template-columns:1fr;}}

.tech-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
@media(min-width:480px){.tech-pick{grid-template-columns:repeat(3,1fr);}}
.tech-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid var(--gray-b);border-radius:10px;background:#fff;cursor:pointer;transition:all 0.15s;font-size:12px;font-weight:700;color:var(--dark);user-select:none;}
.tech-chip:hover{border-color:var(--orange);background:#fff7ed;}
.tech-chip input{accent-color:var(--orange);}
.tech-chip.checked{border-color:var(--orange);background:#fff7ed;color:#9a3412;}
.tech-chip .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f97316,#9a3412);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}

.form-submit{width:100%;padding:13px;background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s;}
.form-submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px -5px rgba(249,115,22,0.4);}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 18px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:slideIn 0.3s ease;max-width:380px;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--blue);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray-b);box-shadow:0 -4px 20px rgba(0,0,0,0.06);padding:6px 12px;z-index:100;display:flex;gap:4px;}
@media(min-width:768px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;font-size:10px;font-weight:600;color:var(--gray);transition:all 0.2s;gap:2px;}.bn-item.active{color:var(--red);background:#fef2f2;}.bn-item .bn-icon{font-size:20px;}

.empty-state{text-align:center;padding:40px 20px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}
.empty-icon{font-size:42px;margin-bottom:10px;opacity:0.5;}
.empty-title{font-size:15px;font-weight:800;color:var(--dark);margin-bottom:4px;}
.empty-msg{color:var(--gray-l);font-size:13px;}
.footer{text-align:center;color:var(--gray-xl);font-size:11px;padding:24px 0 100px;}
.loading-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:400;display:none;}
.loading-bar.active{display:block;}.loading-bar::after{content:'';display:block;width:30%;height:100%;background:var(--orange);border-radius:2px;animation:loadSlide 1.2s infinite ease-in-out;}
@keyframes loadSlide{0%{margin-left:-30%}100%{margin-left:100%}}
</style>
</head>
<body>

<div class="loading-bar" id="loadBar"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-header" id="pageHeader">
        <div>
            <a href="../admin.html" class="page-back">← Dashboard</a>
            <div class="page-title" id="pageTitle">🔧 Execuție</div>
            <div class="page-subtitle" id="syncStatus"><span class="sync-indicator sync-off"></span>Se încarcă...</div>
        </div>
        <div class="page-actions">
            <a href="planificare.html" class="page-btn secondary">📅 Planificare</a>
            <button class="page-btn secondary" id="refreshBtn" onclick="refreshData()"><span class="spin-icon">🔄</span> Reîncarcă</button>
        </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="toolbar" id="toolbar">
        <input type="text" class="filter-search" id="searchInput" placeholder="🔍 Caută client, proiect..." oninput="render()">
        <select class="filter-select" id="filterStatus" onchange="render()">
            <option value="">Toate statusurile</option>
            <option value="Programat">Programat</option>
            <option value="In curs">În curs</option>
            <option value="Finalizat">Finalizat</option>
        </select>
        <span class="filter-count" id="filterCount"></span>
    </div>

    <div id="mainView"></div>

    <div class="footer">Portal CSSI 3.0 · Modul Execuție v4.0 · Programări + atribuiri echipă</div>
</div>

<div class="bottom-nav">
    <a href="../admin.html" class="bn-item"><span class="bn-icon">🏠</span>Acasă</a>
    <a href="proiecte.html" class="bn-item"><span class="bn-icon">📋</span>Proiecte</a>
    <a href="planificare.html" class="bn-item"><span class="bn-icon">📅</span>Plan</a>
    <a href="executie.html" class="bn-item active"><span class="bn-icon">🔧</span>Execuție</a>
    <a href="financiar.html" class="bn-item"><span class="bn-icon">📄</span>Facturi</a>
</div>

<!-- MODAL: programare nouă/editare -->
<div id="prgModal" class="modal-overlay" onclick="if(event.target===this)closePrgModal()">
<div class="modal">
    <div class="modal-head">
        <div class="modal-title" id="prgModalTitle">📅 Programare Execuție</div>
        <button class="modal-close" onclick="closePrgModal()">✕</button>
    </div>
    <div class="modal-body">
        <form id="prgForm" onsubmit="savePrg(event)">
            <input type="hidden" id="fId">
            <input type="hidden" id="fProiectId">
            <div class="form-group">
                <label class="form-label">Proiect</label>
                <div id="fProiectInfo" style="padding:10px 14px;background:var(--gray-bg);border-radius:10px;font-size:13px;font-weight:700;"></div>
            </div>
            <div class="form-row-3">
                <div class="form-group">
                    <label class="form-label">Data <span class="req">*</span></label>
                    <input type="date" class="form-input" id="fData" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Ora start</label>
                    <input type="time" class="form-input" id="fOra" value="08:00">
                </div>
                <div class="form-group">
                    <label class="form-label">Durata (ore)</label>
                    <input type="number" class="form-input" id="fDurata" value="8" min="0.5" step="0.5">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-select" id="fStatus">
                    <option value="Programat">📅 Programat</option>
                    <option value="In curs">🔧 În curs</option>
                    <option value="Finalizat">✅ Finalizat</option>
                    <option value="Anulat">❌ Anulat</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Tehnicieni atribuiți (selectează unul sau mai mulți)</label>
                <div class="tech-pick" id="fTehnicieni"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Note / instrucțiuni pentru echipă</label>
                <textarea class="form-textarea" id="fNote" placeholder="Ex: aduceți scara mare, accesul prin curte spate, contact la fața locului 0712..."></textarea>
            </div>
            <button type="submit" class="form-submit">💾 Salvează programarea</button>
        </form>
    </div>
</div>
</div>

<script>
// ═══════ AUTH ═══════
var role = sessionStorage.getItem('cssi-role');
var userName = sessionStorage.getItem('cssi-user') || role || '';
if (!role) { window.location.href = '../admin.html'; }

// ═══════ CONFIG ═══════
var API_DB = '/admin/api.php';
var TECHNICIANS = [
    {id:'zoli',  name:'Zoli'},
    {id:'sanyi', name:'Sanyi'},
    {id:'bogdan',name:'Bogdan'},
    {id:'cezar', name:'Cezar'},
    {id:'cristi',name:'Cristi'},
    {id:'denes', name:'Denes'}
];
var TECH_IDS = TECHNICIANS.map(function(t){return t.id;});
var isTehnician = TECH_IDS.indexOf(role) >= 0;

// ═══════ STATE ═══════
var STATE = {
    proiecte: [],
    programari: [],
    loaded: false,
    isLive: false,
    expanded: {}, // {proiect_db_id: bool}
};

// ═══════ HELPERS ═══════
function esc(s){if(s==null)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function todayStr(){return new Date().toISOString().split('T')[0];}
function showLoading(s){document.getElementById('loadBar').classList.toggle('active',s);}
function toast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(100px)';t.style.transition='all 0.3s'},2500);setTimeout(function(){t.remove()},3000);}
function techInitials(id){var t=TECHNICIANS.find(function(x){return x.id===id;});return t?t.name.charAt(0).toUpperCase():(id||'?').charAt(0).toUpperCase();}
function techName(id){var t=TECHNICIANS.find(function(x){return x.id===id;});return t?t.name:id;}
function statusKey(s){return (s||'').toLowerCase().replace(/[\s_]+/g,'-');}

var MONTHS_RO = ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Noi','Dec'];
function fmtDate(s){
    if(!s) return '';
    var d = new Date(s.replace(' ','T'));
    if(isNaN(d.getTime())) return s;
    return {day: d.getDate(), month: MONTHS_RO[d.getMonth()], dayOfWeek: d.getDay()};
}
function fmtTime(s){
    if(!s) return '';
    return s.substring(0, 5);
}
function relDay(s){
    if(!s) return null;
    var d = new Date(s+'T00:00:00');
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((d - today) / 86400000);
    if(diff === 0) return 'today';
    if(diff === 1) return 'tomorrow';
    if(diff > 1 && diff <= 7) return 'this-week';
    if(diff > 7 && diff <= 14) return 'next-week';
    if(diff < 0) return 'past';
    return 'future';
}

// ═══════ FETCH ═══════
function refreshData(){
    var btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    showLoading(true);
    updateSync('loading');
    var url = API_DB + '?action=getExecutie&_t=' + Date.now();
    if (isTehnician) url += '&user=' + encodeURIComponent(role);
    return fetch(url)
        .then(function(r){return r.json()})
        .then(function(res){
            if(!res.success) throw new Error(res.error||'Eroare server');
            STATE.proiecte = (res.data && res.data.proiecte) || [];
            STATE.programari = (res.data && res.data.programari) || [];
            STATE.loaded = true;
            STATE.isLive = true;
            updateSync(); render();
        })
        .catch(function(e){
            STATE.isLive = false;
            updateSync(); render();
            toast('❌ Eroare încărcare: '+(e.message||e), 'error');
        })
        .finally(function(){ btn.classList.remove('spinning'); showLoading(false); });
}
function updateSync(state){
    var el = document.getElementById('syncStatus');
    if(state==='loading') el.innerHTML='<span class="sync-indicator sync-loading"></span>Se încarcă...';
    else if(STATE.isLive) el.innerHTML='<span class="sync-indicator sync-ok"></span>MySQL · '+STATE.programari.length+' programări';
    else el.innerHTML='<span class="sync-indicator sync-off"></span>Indisponibil';
}

// ─── MANAGER VIEW: lista proiecte cu programări nested ───
function renderManagerView(){
    var q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
    var fs = document.getElementById('filterStatus').value;
    var view = document.getElementById('mainView');
    if(!STATE.loaded){ view.innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-msg">Se încarcă...</div></div>'; return; }
    if(!STATE.proiecte.length){ view.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Niciun proiect în execuție</div><div class="empty-msg">Mută un proiect în statusul "Execuție" din Board Proiecte.</div></div>'; return; }

    var filtered = STATE.proiecte.filter(function(p){
        if(!q) return true;
        return (p.client_nume||'').toLowerCase().includes(q) ||
               (p.proiect_id||'').toLowerCase().includes(q) ||
               (p.obiectiv||'').toLowerCase().includes(q) ||
               (p.adresa_obiectiv||'').toLowerCase().includes(q);
    });
    if(!filtered.length){ view.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-msg">Niciun proiect nu corespunde căutării.</div></div>'; return; }

    var html = '';
    filtered.forEach(function(p){
        var pid = p.proiect_db_id;
        var prgList = STATE.programari.filter(function(x){return x.proiect_id == pid;});
        if(fs) prgList = prgList.filter(function(x){return x.status===fs;});
        var open = !!STATE.expanded[pid];
        var initials = (p.client_nume||'?').split(/\s+/).filter(Boolean).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
        var statusCls = p.proiect_status==='Receptie' ? 'recep' : 'exec';
        html += '<div class="proj-card'+(open?' open':'')+'" id="proj-'+pid+'">';
        html += '<button class="proj-head" type="button" onclick="toggleProject('+pid+')">';
        html += '<div class="proj-icon">'+esc(initials)+'</div>';
        html += '<div class="proj-info">';
        html += '<div class="proj-title">'+esc(p.client_nume||'?')+'</div>';
        html += '<div class="proj-meta">';
        html += '<span class="pill cnt">'+esc(p.proiect_id)+'</span>';
        html += '<span class="pill '+statusCls+'">'+esc(p.proiect_status)+'</span>';
        if(p.serviciu) html += '<span class="pill">'+esc(p.serviciu)+'</span>';
        html += '<span class="pill">📅 '+prgList.length+' programări</span>';
        if(p.adresa_obiectiv) html += '<span style="color:var(--gray-l)">📍 '+esc(p.adresa_obiectiv)+'</span>';
        html += '</div></div>';
        html += '<div class="proj-chevron">▾</div></button>';
        html += '<div class="proj-body">';

        if(prgList.length){
            html += '<div class="prg-list">';
            prgList.forEach(function(prg){
                var d = fmtDate(prg.data_programata);
                var sc = statusKey(prg.status);
                html += '<div class="prg-item '+sc+'">';
                html += '<div class="prg-date">';
                html += '<div class="prg-date-day">'+(d.day||'?')+'</div>';
                html += '<div class="prg-date-month">'+(d.month||'')+'</div>';
                html += '<div class="prg-date-time">'+fmtTime(prg.ora_start)+'</div>';
                html += '</div>';
                html += '<div class="prg-info">';
                html += '<div class="prg-line1">';
                html += '<span class="prg-status '+sc+'">'+esc(prg.status||'')+'</span>';
                html += '<span class="prg-durata">⏱ '+prg.durata_ore+'h</span>';
                html += '</div>';
                html += '<div class="prg-team">';
                if(prg.atribuiri && prg.atribuiri.length){
                    prg.atribuiri.forEach(function(uid){
                        html += '<span class="prg-team-chip"><span class="av">'+esc(techInitials(uid))+'</span>'+esc(techName(uid))+'</span>';
                    });
                } else {
                    html += '<span class="prg-team-chip empty">⚠️ Nimeni atribuit</span>';
                }
                html += '</div>';
                if(prg.note) html += '<div class="prg-note">📝 '+esc(prg.note)+'</div>';
                html += '</div>';
                html += '<div class="prg-actions">';
                html += '<button class="btn-icon" onclick="openEditPrg('+prg.id+')" title="Editează">✏️</button>';
                html += '<button class="btn-icon del" onclick="deletePrg('+prg.id+')" title="Șterge">🗑️</button>';
                html += '</div>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<div style="text-align:center;padding:14px;color:var(--gray-l);font-size:12px">Nicio programare încă pentru acest proiect.</div>';
        }
        html += '<div class="proj-actions"><button class="btn-add-prg" onclick="openNewPrg('+pid+')">＋ Programare nouă</button></div>';
        html += '</div></div>';
    });
    view.innerHTML = html;
    document.getElementById('filterCount').textContent = filtered.length+' proiecte · '+STATE.programari.length+' programări totale';
}

// ─── TECH VIEW: agenda cronologică ───
function renderTechView(){
    var q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
    var fs = document.getElementById('filterStatus').value;
    var view = document.getElementById('mainView');
    if(!STATE.loaded){ view.innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-msg">Se încarcă...</div></div>'; return; }

    var prg = STATE.programari.filter(function(p){
        if(fs && p.status !== fs) return false;
        if(!q) return true;
        // Caută în client/proiect — necesită lookup
        var pj = STATE.proiecte.find(function(x){return x.proiect_db_id == p.proiect_id;});
        var clientNume = pj ? (pj.client_nume||'') : '';
        return clientNume.toLowerCase().includes(q) ||
               (pj && (pj.proiect_id||'').toLowerCase().includes(q)) ||
               (p.note||'').toLowerCase().includes(q);
    });

    if(!prg.length){ view.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Nicio programare</div><div class="empty-msg">Nu ai nicio programare atribuită încă. Vorbește cu coordonatorul.</div></div>'; return; }

    // Grupare pe perioade: today / tomorrow / this-week / next-week / future / past
    var groups = {today:[], tomorrow:[], 'this-week':[], 'next-week':[], future:[], past:[]};
    prg.forEach(function(p){
        var bucket = relDay(p.data_programata);
        if(bucket && groups[bucket]) groups[bucket].push(p);
    });

    var labels = {
        today:'🔴 Astăzi',
        tomorrow:'📅 Mâine',
        'this-week':'📆 Restul săptămânii',
        'next-week':'➡️ Săptămâna viitoare',
        future:'🗓 Mai târziu',
        past:'📚 Trecute'
    };
    var order = ['today','tomorrow','this-week','next-week','future','past'];

    var html = '';
    order.forEach(function(k){
        var arr = groups[k];
        if(!arr.length) return;
        var todayCls = k==='today' ? ' today' : '';
        html += '<div class="day-section">';
        html += '<div class="day-section-title'+todayCls+'">'+labels[k]+' <span class="badge-num">'+arr.length+'</span></div>';
        arr.forEach(function(p){
            var pj = STATE.proiecte.find(function(x){return x.proiect_db_id == p.proiect_id;}) || {};
            var d = fmtDate(p.data_programata);
            var sc = statusKey(p.status);
            html += '<div class="tech-prg-card '+sc+'">';
            html += '<div class="tech-prg-top">';
            html += '<div class="tech-prg-time">'+(d.day||'?')+' '+(d.month||'')+' · '+fmtTime(p.ora_start)+'<span class="durata">('+p.durata_ore+'h)</span></div>';
            html += '<span class="prg-status '+sc+'">'+esc(p.status||'')+'</span>';
            html += '</div>';
            html += '<div class="tech-prg-client">'+esc(pj.client_nume||'?')+'</div>';
            html += '<div class="tech-prg-meta">📌 <strong>'+esc(pj.proiect_id||'?')+'</strong>';
            if(pj.serviciu) html += ' · '+esc(pj.serviciu);
            if(pj.adresa_obiectiv) html += ' · 📍 '+esc(pj.adresa_obiectiv);
            html += '</div>';
            if(p.atribuiri && p.atribuiri.length > 1){
                html += '<div class="tech-prg-team">👥 Echipă: ';
                p.atribuiri.filter(function(uid){return uid!==role;}).forEach(function(uid){
                    html += '<span class="prg-team-chip"><span class="av">'+esc(techInitials(uid))+'</span>'+esc(techName(uid))+'</span>';
                });
                html += '</div>';
            }
            if(p.note) html += '<div class="tech-prg-note">📝 '+esc(p.note)+'</div>';
            html += '</div>';
        });
        html += '</div>';
    });
    view.innerHTML = html;
    document.getElementById('filterCount').textContent = prg.length+' programări';
}

// ═══════ TOGGLE / MODAL ═══════
function toggleProject(pid){ STATE.expanded[pid] = !STATE.expanded[pid]; render(); }

function openNewPrg(proiectDbId){
    var p = STATE.proiecte.find(function(x){return x.proiect_db_id == proiectDbId;});
    if(!p){ toast('Proiect negăsit','error'); return; }
    document.getElementById('prgModalTitle').textContent = '📅 Programare nouă';
    document.getElementById('fId').value = '';
    document.getElementById('fProiectId').value = proiectDbId;
    document.getElementById('fProiectInfo').innerHTML = '<strong>'+esc(p.client_nume)+'</strong> · '+esc(p.proiect_id)+(p.adresa_obiectiv?' · 📍 '+esc(p.adresa_obiectiv):'');
    document.getElementById('fData').value = todayStr();
    document.getElementById('fOra').value = '08:00';
    document.getElementById('fDurata').value = 8;
    document.getElementById('fStatus').value = 'Programat';
    document.getElementById('fNote').value = '';
    renderTechPicker([]);
    document.getElementById('prgModal').classList.add('active');
}

function openEditPrg(prgId){
    var prg = STATE.programari.find(function(x){return x.id == prgId;});
    if(!prg){ toast('Programare negăsită','error'); return; }
    var p = STATE.proiecte.find(function(x){return x.proiect_db_id == prg.proiect_id;});
    document.getElementById('prgModalTitle').textContent = '✏️ Editează programarea';
    document.getElementById('fId').value = prg.id;
    document.getElementById('fProiectId').value = prg.proiect_id;
    document.getElementById('fProiectInfo').innerHTML = p ? ('<strong>'+esc(p.client_nume)+'</strong> · '+esc(p.proiect_id)+(p.adresa_obiectiv?' · 📍 '+esc(p.adresa_obiectiv):'')) : ('Proiect #'+prg.proiect_id);
    document.getElementById('fData').value = prg.data_programata;
    document.getElementById('fOra').value = (prg.ora_start||'08:00:00').substring(0,5);
    document.getElementById('fDurata').value = prg.durata_ore;
    document.getElementById('fStatus').value = prg.status;
    document.getElementById('fNote').value = prg.note || '';
    renderTechPicker(prg.atribuiri || []);
    document.getElementById('prgModal').classList.add('active');
}

function closePrgModal(){ document.getElementById('prgModal').classList.remove('active'); }

function renderTechPicker(selected){
    var c = document.getElementById('fTehnicieni');
    c.innerHTML = TECHNICIANS.map(function(t){
        var checked = selected.indexOf(t.id) >= 0 ? ' checked' : '';
        return '<label class="tech-chip'+(checked?' checked':'')+'">' +
               '<input type="checkbox" value="'+t.id+'"'+checked+' onchange="this.parentElement.classList.toggle(\'checked\',this.checked)">' +
               '<span class="av">'+t.name.charAt(0)+'</span>'+esc(t.name)+'</label>';
    }).join('');
}

function savePrg(ev){
    ev.preventDefault();
    var id = document.getElementById('fId').value;
    var atribuiri = [].slice.call(document.querySelectorAll('#fTehnicieni input:checked')).map(function(i){return i.value;});
    var payload = {
        action: 'saveProgramare',
        id: id ? parseInt(id) : 0,
        proiect_id: parseInt(document.getElementById('fProiectId').value),
        data_programata: document.getElementById('fData').value,
        ora_start: document.getElementById('fOra').value + ':00',
        durata_ore: parseFloat(document.getElementById('fDurata').value) || 8,
        status: document.getElementById('fStatus').value,
        note: document.getElementById('fNote').value.trim(),
        atribuiri: atribuiri,
        user: userName
    };
    if(!payload.proiect_id || !payload.data_programata){ toast('⚠️ Completează data','error'); return; }
    showLoading(true);
    fetch(API_DB+'?action=saveProgramare', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
    }).then(function(r){return r.json()})
      .then(function(res){
          if(!res.success) throw new Error(res.error||'Eroare');
          closePrgModal();
          toast('✅ Programare salvată','success');
          refreshData();
      })
      .catch(function(e){ toast('❌ '+(e.message||e),'error'); })
      .finally(function(){ showLoading(false); });
}

function deletePrg(prgId){
    if(!confirm('Ștergi această programare?')) return;
    fetch(API_DB+'?action=deleteProgramare', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action:'deleteProgramare', id: prgId})
    }).then(function(r){return r.json()})
      .then(function(res){
          if(!res.success) throw new Error(res.error||'Eroare');
          toast('Programare ștearsă','info');
          refreshData();
      })
      .catch(function(e){ toast('❌ '+(e.message||e),'error'); });
}

// ═══════ INIT ═══════
applyRoleUI();
refreshData();
